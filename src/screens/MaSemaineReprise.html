<body>

<div class="page">

  <header class="header">
    <div class="logo">Ma Petite Assiette</div>
    <h1>Ma semaine</h1>
    <p class="subtitle">
      Votre semaine personnalisée,
      construite selon vos choix.
    </p>
  </header>

  <div id="configSummary" class="config-summary"></div>

  <div id="conteneurSemaine">

    <div class="loading">
      🥕 Préparation de votre petite semaine...
    </div>

  </div>

  <div id="resumeSemaine"></div>

  <div class="buttons">

    <button
      class="main-button"
      id="regenerer"
    >
      🔄 Générer une nouvelle semaine
    </button>

    <button
      class="secondary-button"
      id="modifier"
    >
      ✏️ Modifier mes choix
    </button>

  </div>

  <a
    href="../../index.html"
    class="back"
  >
    ← Retour à l'accueil
  </a>

</div>


<script>

  const STORAGE_KEY =
    "maPetiteAssiette_reprise";

  let configuration = null;
  let recettes = [];
  let semaine = [];


  /* =====================================================
     UTILITAIRES
  ===================================================== */

  function normaliser(texte) {

    return String(texte || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");

  }


  function nombre(valeur) {

    if (
      valeur === null ||
      valeur === undefined ||
      valeur === ""
    ) {
      return 0;
    }

    const resultat =
      Number(
        String(valeur)
          .replace(",", ".")
          .replace(/[^\d.-]/g, "")
      );

    return isNaN(resultat)
      ? 0
      : resultat;

  }


  function texteRecette(recette) {

    const morceaux = [

      recette.nom,
      recette.categorie,
      recette.type,
      recette.description,

      ...(Array.isArray(recette.ingredients)
        ? recette.ingredients
        : [])

    ];

    return normaliser(
      morceaux.join(" ")
    );

  }


  function getCalories(recette) {

    return nombre(
      recette.calories ??
      recette.kcal ??
      recette.caloriesParPortion ??
      recette.valeursNutritionnelles?.calories
    );

  }


  function getProteines(recette) {

    return nombre(
      recette.proteines ??
      recette.protein ??
      recette.proteinesParPortion ??
      recette.valeursNutritionnelles?.proteines
    );

  }


  function estVegetarienne(recette) {

    if (
      recette.vegetarien === true ||
      recette.vegetarien === "true"
    ) {
      return true;
    }

    const texte =
      texteRecette(recette);

    const viande =
      [
        "boeuf",
        "bœuf",
        "veau",
        "porc",
        "jambon",
        "poulet",
        "dinde",
        "canard",
        "agneau",
        "saucisse",
        "lard",
        "bacon",
        "thon",
        "saumon",
        "poisson",
        "crevette",
        "crevettes",
        "cabillaud",
        "colin",
        "sardine",
        "maquereau",
        "anchois"
      ];

    return !viande.some(
      aliment =>
        texte.includes(normaliser(aliment))
    );

  }


  function contientAliment(recette, aliment) {

    return texteRecette(recette)
      .includes(
        normaliser(aliment)
      );

  }


  function correspondTypeRepas(
    recette,
    typeRepas
  ) {

    const texte =
      normaliser(
        [
          recette.categorie,
          recette.type,
          recette.nom,
          recette.typeRepas
        ].join(" ")
      );


    if (typeRepas === "petitDejeuner") {

      return (
        texte.includes("petit") ||
        texte.includes("dejeuner") ||
        texte.includes("petit-dejeuner") ||
        texte.includes("petit déjeuner") ||
        texte.includes("breakfast") ||
        texte.includes("matin")
      );

    }


    if (typeRepas === "dejeuner") {

      return (
        texte.includes("dejeuner") ||
        texte.includes("déjeuner") ||
        texte.includes("diner") ||
        texte.includes("dîner") ||
        texte.includes("plat") ||
        texte.includes("repas")
      );

    }


    if (typeRepas === "diner") {

      return (
        texte.includes("diner") ||
        texte.includes("dîner") ||
        texte.includes("dejeuner") ||
        texte.includes("déjeuner") ||
        texte.includes("plat") ||
        texte.includes("repas")
      );

    }


    if (
      typeRepas === "collation"
    ) {

      return (
        texte.includes("collation") ||
        texte.includes("douceur") ||
        texte.includes("dessert") ||
        texte.includes("gouter") ||
        texte.includes("goûter") ||
        texte.includes("snack")
      );

    }

    return true;

  }


  /* =====================================================
     FILTRAGE
  ===================================================== */

  function recettesCompatibles(
    typeRepas
  ) {

    let liste =
      recettes.filter(
        recette =>
          correspondTypeRepas(
            recette,
            typeRepas
          )
      );


    if (
      configuration.regime ===
      "vegetarien"
    ) {

      liste =
        liste.filter(
          estVegetarienne
        );

    }


    const eviter =
      configuration.alimentsEviter || [];


    if (eviter.length) {

      liste =
        liste.filter(
          recette =>
            !eviter.some(
              aliment =>
                contientAliment(
                  recette,
                  aliment
                )
            )
        );

    }


    return liste;

  }


  /* =====================================================
     PREFERENCES
  ===================================================== */

  function scoreRecette(
    recette,
    typeRepas
  ) {

    let score = 0;

    const texte =
      texteRecette(recette);


    const aimes =
      configuration.alimentsAimes || [];


    aimes.forEach(
      aliment => {

        if (
          texte.includes(
            normaliser(aliment)
          )
        ) {
          score += 10;
        }

      }
    );


    /*
       Favoriser la catégorie correspondant
       au repas.
    */

    if (
      correspondTypeRepas(
        recette,
        typeRepas
      )
    ) {
      score += 5;
    }


    /*
       Si objectif protéines :
       favoriser les recettes riches
       en protéines.
    */

    if (
      configuration.proteines?.active
    ) {

      score +=
        Math.min(
          getProteines(recette) / 5,
          10
        );

    }


    return score;

  }


  function choisirRecette(
    typeRepas,
    dejaChoisies
  ) {

    let candidats =
      recettesCompatibles(
        typeRepas
      );


    /*
       Si le filtrage par catégorie
       est trop strict, on élargit.
    */

    if (
      candidats.length === 0
    ) {

      candidats =
        recettes.filter(
          recette => {

            if (
              configuration.regime ===
              "vegetarien" &&
              !estVegetarienne(recette)
            ) {
              return false;
            }

            const eviter =
              configuration.alimentsEviter || [];

            return !eviter.some(
              aliment =>
                contientAliment(
                  recette,
                  aliment
                )
            );

          }
        );

    }


    if (
      candidats.length === 0
    ) {
      return null;
    }


    /*
       Éviter autant que possible
       les doublons.
    */

    const disponibles =
      candidats.filter(
        recette =>
          !dejaChoisies.includes(
            String(recette.id)
          )
      );


    if (
      disponibles.length
    ) {
      candidats =
        disponibles;
    }


    /*
       Trier selon les préférences.
    */

    candidats.sort(
      (a, b) =>
        scoreRecette(b, typeRepas) -
        scoreRecette(a, typeRepas)
    );


    /*
       Parmi les meilleurs résultats,
       introduire un peu de variété.
    */

    const top =
      candidats.slice(
        0,
        Math.min(8, candidats.length)
      );


    return top[
      Math.floor(
        Math.random() * top.length
      )
    ];

  }


  /* =====================================================
     TYPES DE REPAS
  ===================================================== */

  function construireTypesRepas() {

    const types = [];

    if (
      configuration.repas.petitDejeuner
    ) {
      types.push(
        "petitDejeuner"
      );
    }


    if (
      configuration.repas.dejeuner
    ) {
      types.push(
        "dejeuner"
      );
    }


    if (
      configuration.repasParJour >= 4
    ) {
      types.push(
        "collation"
      );
    }


    if (
      configuration.repasParJour >= 5
    ) {
      types.push(
        "collation"
      );
    }


    if (
      configuration.repas.diner
    ) {
      types.push(
        "diner"
      );
    }


    return types;

  }


  function nomRepas(type, index) {

    if (
      type === "petitDejeuner"
    ) {
      return {
        nom: "Petit déjeuner",
        emoji: "🍳"
      };
    }


    if (
      type === "dejeuner"
    ) {
      return {
        nom: "Déjeuner",
        emoji: "🥗"
      };
    }


    if (
      type === "diner"
    ) {
      return {
        nom: "Dîner",
        emoji: "🌙"
      };
    }


    if (
      index === 0
    ) {
      return {
        nom: "Collation matin",
        emoji: "🥛"
      };
    }


    return {
      nom: "Collation",
      emoji: "🍎"
    };

  }


  /* =====================================================
     CONSTRUCTION DE LA SEMAINE
  ===================================================== */

  function construireSemaine() {

    semaine = [];

    const types =
      construireTypesRepas();


    for (
      let jour = 1;
      jour <= configuration.duree;
      jour++
    ) {

      const repas = [];
      const idsJour = [];

      types.forEach(
        (type, index) => {

          const recette =
            choisirRecette(
              type,
              idsJour
            );


          if (recette) {

            idsJour.push(
              String(recette.id)
            );

            repas.push({

              type: type,

              index: index,

              recette: recette

            });

          }

        }
      );


      semaine.push({
        jour: jour,
        repas: repas
      });

    }

  }


  /* =====================================================
     CALCULS
  ===================================================== */

  function totalJour(jour) {

    let calories = 0;
    let proteines = 0;


    jour.repas.forEach(
      repas => {

        calories +=
          getCalories(
            repas.recette
          );

        proteines +=
          getProteines(
            repas.recette
          );

      }
    );


    return {
      calories,
      proteines
    };

  }


  function objectifCaloriesRespecte(
    calories
  ) {

    if (
      !configuration.calories?.active ||
      !configuration.calories?.objectif
    ) {
      return null;
    }


    const parties =
      configuration.calories.objectif
        .split("-")
        .map(Number);


    const min =
      parties[0];

    const max =
      parties[1];


    return (
      calories >= min &&
      calories <= max
    );

  }


  /* =====================================================
     AFFICHAGE
  ===================================================== */

  function afficherConfiguration() {

    const bloc =
      document.getElementById(
        "configSummary"
      );


    let calories =
      "Aucun objectif";

    if (
      configuration.calories?.active &&
      configuration.calories?.objectif
    ) {

      calories =
        configuration.calories.objectif
          .replace("-", " à ") +
        " kcal / jour";

    }


    let proteines =
      "Aucun objectif";

    if (
      configuration.proteines?.active &&
      configuration.proteines?.objectif
    ) {

      proteines =
        configuration.proteines.objectif +
        " g / jour";

    }


    bloc.innerHTML = `

      <strong>Votre configuration</strong><br>

      📅 ${configuration.duree} jour(s)<br>

      🍽️ ${configuration.repasParJour}
      repas par jour<br>

      🎯 Calories :
      ${calories}<br>

      💪 Protéines :
      ${proteines}<br>

      ${configuration.regime === "vegetarien"
        ? "🥕 Régime végétarien"
        : "🥩 Viande / poisson"}

    `;

  }


  function afficherSemaine() {

    const conteneur =
      document.getElementById(
        "conteneurSemaine"
      );


    conteneur.innerHTML = "";


    semaine.forEach(
      jour => {

        const bloc =
          document.createElement(
            "section"
          );

        bloc.className = "day";


        const total =
          totalJour(jour);


        let html = `

          <div class="day-title">
            ${nomJour(jour.jour)}
          </div>

        `;


        jour.repas.forEach(
          (repas, index) => {

            const recette =
              repas.recette;

            const info =
              nomRepas(
                repas.type,
                repas.index
              );


            const calories =
              getCalories(recette);

            const proteines =
              getProteines(recette);


            html += `

              <div class="meal">

                <div class="meal-header">
                  ${info.emoji}
                  ${info.nom}
                </div>

                <div class="recipe-name">
                  ${escapeHtml(
                    recette.nom ||
                    "Recette"
                  )}
                </div>

                <div class="stats">

                  ${calories > 0
                    ? calories + " kcal"
                    : "Calories non renseignées"}

                  ${proteines > 0
                    ? " · " + proteines + " g protéines"
                    : ""}

                </div>

                <div class="meal-actions">

                  <a
                    class="small-button"
                    href="Recette.html?id=${encodeURIComponent(
                      recette.id
                    )}"
                  >
                    👁️ Voir la recette
                  </a>

                  <button
                    class="small-button"
                    onclick="remplacerRecette(
                      ${jour.jour},
                      ${index}
                    )"
                  >
                    🔄 Changer
                  </button>

                </div>

              </div>

            `;

          }
        );


        const etatCalories =
          objectifCaloriesRespecte(
            total.calories
          );


        let messageCalories = "";

        if (
          etatCalories === true
        ) {

          messageCalories =
            `<span class="good">
              ✓ Objectif calories respecté
            </span>`;

        }
        else if (
          etatCalories === false
        ) {

          messageCalories =
            `<span class="attention">
              ⚠ Journée à ajuster
            </span>`;

        }


        html += `

          <div class="day-total">

            <strong>
              Total de la journée
            </strong><br>

            🔥
            ${total.calories > 0
              ? Math.round(total.calories) + " kcal"
              : "Calories non renseignées"}

            &nbsp; · &nbsp;

            💪
            ${total.proteines > 0
              ? Math.round(total.proteines) + " g protéines"
              : "Protéines non renseignées"}

            <br>

            ${messageCalories}

          </div>

        `;


        bloc.innerHTML = html;

        conteneur.appendChild(
          bloc
        );

      }
    );

  }


  function nomJour(numero) {

    const jours = [
      "Lundi",
      "Mardi",
      "Mercredi",
      "Jeudi",
      "Vendredi",
      "Samedi",
      "Dimanche"
    ];

    return jours[
      (numero - 1) % 7
    ];

  }


  function escapeHtml(texte) {

    return String(texte || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =====================================================
     RESUME
  ===================================================== */

  function afficherResume() {

    let totalCalories = 0;
    let totalProteines = 0;


    semaine.forEach(
      jour => {

        const total =
          totalJour(jour);

        totalCalories +=
          total.calories;

        totalProteines +=
          total.proteines;

      }
    );


    const jours =
      semaine.length || 1;


    const moyenneCalories =
      Math.round(
        totalCalories / jours
      );


    const moyenneProteines =
      Math.round(
        totalProteines / jours
      );


    document.getElementById(
      "resumeSemaine"
    ).innerHTML = `

      <section class="week-summary">

        <h2>📊 Bilan</h2>

        <div class="summary-grid">

          <div class="summary-box">

            <div class="summary-number">
              ${moyenneCalories > 0
                ? moyenneCalories + " kcal"
                : "—"}
            </div>

            <div class="summary-label">
              Moyenne calories / jour
            </div>

          </div>

          <div class="summary-box">

            <div class="summary-number">
              ${moyenneProteines > 0
                ? moyenneProteines + " g"
                : "—"}
            </div>

            <div class="summary-label">
              Moyenne protéines / jour
            </div>

          </div>

        </div>

      </section>

    `;

  }


  /* =====================================================
     REMPLACER UNE RECETTE
  ===================================================== */

  window.remplacerRecette =
    function (
      numeroJour,
      indexRepas
    ) {

      const jour =
        semaine.find(
          element =>
            element.jour === numeroJour
        );


      if (!jour) {
        return;
      }


      const repas =
        jour.repas[indexRepas];


      if (!repas) {
        return;
      }


      let candidats =
        recettesCompatibles(
          repas.type
        );


      const ids =
        jour.repas
          .map(
            element =>
              String(
                element.recette.id
              )
          );


      candidats =
        candidats.filter(
          recette =>
            !ids.includes(
              String(recette.id)
            )
        );


      if (
        candidats.length === 0
      ) {

        alert(
          "Aucune autre recette compatible n'a été trouvée."
        );

        return;

      }


      candidats.sort(
        (a, b) =>
          scoreRecette(
            b,
            repas.type
          ) -
          scoreRecette(
            a,
            repas.type
          )
      );


      const choix =
        candidats[0];


      repas.recette =
        choix;


      afficherSemaine();

      afficherResume();

    };


  /* =====================================================
     CHARGEMENT JSON
  ===================================================== */

  async function chargerRecettes() {

    try {

      const reponse =
        await fetch(
          "../recettes.json"
        );


      if (!reponse.ok) {
        throw new Error(
          "Impossible de charger recettes.json"
        );
      }


      const donnees =
        await reponse.json();


      if (
        Array.isArray(donnees)
      ) {

        recettes =
          donnees;

      }
      else if (
        Array.isArray(
          donnees.recettes
        )
      ) {

        recettes =
          donnees.recettes;

      }
      else {

        throw new Error(
          "Format du fichier recettes.json non reconnu."
        );

      }


      if (
        recettes.length === 0
      ) {

        throw new Error(
          "Le catalogue de recettes est vide."
        );

      }


      construireSemaine();

      afficherSemaine();

      afficherResume();

    }
    catch (erreur) {

      document.getElementById(
        "conteneurSemaine"
      ).innerHTML = `

        <div class="empty">

          ❌ Impossible de charger
          les recettes.

          <br><br>

          Vérifiez que le fichier
          <strong>recettes.json</strong>
          se trouve bien dans le dossier
          <strong>src</strong>.

          <br><br>

          ${escapeHtml(
            erreur.message
          )}

        </div>

      `;

    }

  }


  /* =====================================================
     BOUTONS
  ===================================================== */

  document
    .getElementById("regenerer")
    .addEventListener(
      "click",
      function () {

        if (
          !recettes.length
        ) {
          return;
        }

        construireSemaine();

        afficherSemaine();

        afficherResume();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }
    );


  document
    .getElementById("modifier")
    .addEventListener(
      "click",
      function () {

        window.location.href =
          "ReprendreMonRythme.html";

      }
    );


  /* =====================================================
     DEMARRAGE
  ===================================================== */

  function demarrer() {

    const donnees =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (!donnees) {

      document.getElementById(
        "conteneurSemaine"
      ).innerHTML = `

        <div class="empty">

          Vous n'avez pas encore configuré
          votre semaine.

          <br><br>

          Retournez à la page précédente
          pour choisir vos préférences.

        </div>

      `;

      return;

    }


    try {

      configuration =
        JSON.parse(
          donnees
        );

    }
    catch (erreur) {

      document.getElementById(
        "conteneurSemaine"
      ).innerHTML = `

        <div class="empty">
          Votre configuration est invalide.
          Veuillez recommencer.
        </div>

      `;

      return;

    }


    afficherConfiguration();

    chargerRecettes();

  }


  demarrer();

</script>
