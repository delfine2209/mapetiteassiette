<script>

  /* =====================================================
     CONFIGURATION
  ===================================================== */

  const STORAGE_KEY = "maPetiteAssiette_reprise";

  let configuration = null;
  let recettes = [];
  let semaine = [];

  /* =====================================================
     OUTILS
  ===================================================== */

  function normaliser(value) {

    return String(value ?? "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .trim();

  }

  function nombre(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return null;
    }

    const n = parseFloat(
      String(value)
        .replace(",", ".")
        .replace(/[^\d.-]/g, "")
    );

    return Number.isFinite(n) ? n : null;

  }

  function texteRecette(recette) {

    const morceaux = [

      recette.nom,
      recette.categorie,
      recette.type,
      recette.typeRepas,
      recette.description,
      recette.portion,
      recette.envies,

      ...(Array.isArray(recette.ingredients)
        ? recette.ingredients
        : [])

    ];

    return normaliser(
      morceaux.join(" ")
    );

  }

  /* =====================================================
     CALORIES
  ===================================================== */

  function getCalories(recette) {

    const valeur =

      recette.calories ??
      recette.kcal ??
      recette.caloriesParPortion ??
      recette.valeursNutritionnelles?.calories ??
      recette.valeursNutritionnelles?.kcal;

    return nombre(valeur);

  }

  /* =====================================================
     PROTEINES
  ===================================================== */

  function getProteines(recette) {

    const valeur =

      recette.proteines ??
      recette.protein ??
      recette.proteinesParPortion ??
      recette.valeursNutritionnelles?.proteines ??
      recette.valeursNutritionnelles?.protein;

    return nombre(valeur);

  }

  /* =====================================================
     VEGETARIEN
  ===================================================== */

  function estVegetarienne(recette) {

    if (
      recette.vegetarien === true ||
      normaliser(recette.vegetarien) === "true"
    ) {
      return true;
    }

    const texte = texteRecette(recette);

    const alimentsNonVegetariens = [
      "poulet",
      "boeuf",
      "bœuf",
      "veau",
      "porc",
      "jambon",
      "dinde",
      "canard",
      "agneau",
      "steak",
      "viande",
      "saumon",
      "thon",
      "sardine",
      "anchois",
      "cabillaud",
      "poisson",
      "crevette",
      "fruits de mer"
    ];

    return !alimentsNonVegetariens.some(
      aliment => texte.includes(normaliser(aliment))
    );

  }

  /* =====================================================
     ALIMENTS A EVITER
  ===================================================== */

  function contientAliment(recette, aliment) {

    const texte = texteRecette(recette);

    return texte.includes(
      normaliser(aliment)
    );

  }

  /* =====================================================
     TYPE DE REPAS
  ===================================================== */

  function correspondTypeRepas(recette, typeRepas) {

    const categorie = normaliser(
      recette.categorie
    );

    const type = normaliser(
      recette.type
    );

    const typePrecise = normaliser(
      recette.typeRepas
    );

    const texte = texteRecette(recette);

    const donnees =
      categorie + " " +
      type + " " +
      typePrecise + " " +
      texte;

    if (typeRepas === "petitDejeuner") {

      return (
        typePrecise.includes("petit") ||
        typePrecise.includes("breakfast") ||
        categorie.includes("petit") ||
        donnees.includes("petit dejeuner") ||
        donnees.includes("petit-dejeuner") ||
        donnees.includes("matin") ||
        donnees.includes("breakfast")
      );

    }

    if (typeRepas === "dejeuner") {

      return (
        typePrecise.includes("dejeuner") ||
        typePrecise.includes("lunch") ||
        categorie === "dejeuner" ||
        categorie.includes("dejeuner") ||
        donnees.includes("lunch")
      );

    }

    if (typeRepas === "diner") {

      return (
        typePrecise.includes("diner") ||
        typePrecise.includes("dinner") ||
        categorie === "diner" ||
        categorie.includes("diner") ||
        donnees.includes("dinner")
      );

    }

    if (typeRepas === "collation") {

      return (
        typePrecise.includes("collation") ||
        typePrecise.includes("gouter") ||
        typePrecise.includes("snack") ||
        categorie.includes("petite douceur") ||
        categorie.includes("douceur") ||
        categorie.includes("collation") ||
        donnees.includes("gouter") ||
        donnees.includes("snack") ||
        donnees.includes("dessert")
      );

    }

    return false;

  }

  /* =====================================================
     COMPATIBILITE
  ===================================================== */

  function recetteCompatible(recette, typeRepas) {

    if (
      !correspondTypeRepas(
        recette,
        typeRepas
      )
    ) {
      return false;
    }

    if (
      configuration.regime === "vegetarien" &&
      !estVegetarienne(recette)
    ) {
      return false;
    }

    const alimentsAeviter =
      configuration.alimentsEviter || [];

    for (
      const aliment of alimentsAeviter
    ) {

      if (
        aliment &&
        contientAliment(
          recette,
          aliment
        )
      ) {
        return false;
      }

    }

    return true;

  }

  /* =====================================================
     SCORE
  ===================================================== */

  function scoreRecette(
    recette,
    typeRepas
  ) {

    let score = 0;

    const texte = texteRecette(
      recette
    );

    /* Type de repas */

    if (
      correspondTypeRepas(
        recette,
        typeRepas
      )
    ) {
      score += 30;
    }

    /* Aliments aimés */

    const alimentsAimes =
      configuration.alimentsAimes || [];

    alimentsAimes.forEach(
      aliment => {

        if (
          aliment &&
          texte.includes(
            normaliser(aliment)
          )
        ) {
          score += 15;
        }

      }
    );

    /* Protéines */

    const proteines =
      getProteines(recette);

    if (
      configuration.proteines?.active &&
      proteines !== null
    ) {

      if (proteines >= 15) {
        score += 10;
      }

      if (proteines >= 20) {
        score += 8;
      }

    }

    /* Calories */

    const calories =
      getCalories(recette);

    if (
      configuration.calories?.active &&
      calories !== null
    ) {

      const objectif =
        configuration.calories.objectif;

      const intervalle =
        obtenirIntervalleCalories(
          objectif
        );

      if (intervalle) {

        const milieu =
          (
            intervalle.min +
            intervalle.max
          ) / 2;

        const distance =
          Math.abs(
            calories - milieu
          );

        score += Math.max(
          0,
          15 - distance / 50
        );

      }

    }

    /* Petit bonus aléatoire */

    score += Math.random() * 5;

    return score;

  }

  /* =====================================================
     INTERVALLE CALORIES
  ===================================================== */

  function obtenirIntervalleCalories(
    objectif
  ) {

    if (!objectif) {
      return null;
    }

    const match =
      String(objectif).match(
        /(\d+)\s*-\s*(\d+)/
      );

    if (!match) {
      return null;
    }

    return {
      min: parseInt(match[1]),
      max: parseInt(match[2])
    };

  }

  /* =====================================================
     CHOISIR UNE RECETTE
  ===================================================== */

  function choisirRecette(
    typeRepas,
    recettesDejaUtilisees = []
  ) {

    let candidates =
      recettes.filter(
        recette =>
          recetteCompatible(
            recette,
            typeRepas
          )
      );

    if (!candidates.length) {

      return null;

    }

    /* Eviter les doublons */

    const sansDoublons =
      candidates.filter(
        recette =>
          !recettesDejaUtilisees.includes(
            recette.id
          )
      );

    if (sansDoublons.length) {
      candidates = sansDoublons;
    }

    /* Score */

    candidates.sort(
      (a, b) =>
        scoreRecette(
          b,
          typeRepas
        ) -
        scoreRecette(
          a,
          typeRepas
        )
    );

    /* Petite part d'aléatoire */

    const top =
      candidates.slice(
        0,
        Math.min(
          8,
          candidates.length
        )
      );

    return top[
      Math.floor(
        Math.random() * top.length
      )
    ];

  }

  /* =====================================================
     TYPES DE REPAS DE LA JOURNEE
  ===================================================== */

  function obtenirTypesRepas() {

    const types = [];

    if (
      configuration.repas?.petitDejeuner
    ) {
      types.push(
        "petitDejeuner"
      );
    }

    if (
      configuration.repas?.dejeuner
    ) {
      types.push(
        "dejeuner"
      );
    }

    if (
      configuration.repasParJour >= 4
    ) {
      types.push(
        "collation"
      );
    }

    if (
      configuration.repasParJour >= 5
    ) {
      types.push(
        "collation"
      );
    }

    if (
      configuration.repas?.diner
    ) {
      types.push(
        "diner"
      );
    }

    return types;

  }

  /* =====================================================
     LIBELLES
  ===================================================== */

  function libelleRepas(type, index) {

    if (
      type === "petitDejeuner"
    ) {
      return {
        nom: "Petit-déjeuner",
        icon: "☕"
      };
    }

    if (
      type === "dejeuner"
    ) {
      return {
        nom: "Déjeuner",
        icon: "🥗"
      };
    }

    if (
      type === "diner"
    ) {
      return {
        nom: "Dîner",
        icon: "🍽️"
      };
    }

    if (index === 2) {

      return {
        nom: "Collation",
        icon: "🍎"
      };

    }

    return {
      nom: "Petite collation",
      icon: "🍪"
    };

  }

  /* =====================================================
     GENERATION D'UNE JOURNEE
  ===================================================== */

  function genererJournee(numero) {

    const types =
      obtenirTypesRepas();

    const repas = [];

    const ids = [];

    types.forEach(
      type => {

        const recette =
          choisirRecette(
            type,
            ids
          );

        if (recette) {

          ids.push(
            recette.id
          );

          repas.push({
            type,
            recette
          });

        }

      }
    );

    return {
      numero,
      repas
    };

  }

  /* =====================================================
     GENERATION SEMAINE
  ===================================================== */

  function genererSemaine() {

    semaine = [];

    const duree =
      Number(
        configuration.duree || 1
      );

    for (
      let i = 1;
      i <= duree;
      i++
    ) {

      semaine.push(
        genererJournee(i)
      );

    }

  }

  /* =====================================================
     TOTAL JOURNEE
  ===================================================== */

  function calculerTotauxJournee(
    jour
  ) {

    let calories = 0;
    let proteines = 0;

    let caloriesConnues = false;
    let proteinesConnues = false;

    jour.repas.forEach(
      repas => {

        const kcal =
          getCalories(
            repas.recette
          );

        const prot =
          getProteines(
            repas.recette
          );

        if (kcal !== null) {

          calories += kcal;
          caloriesConnues = true;

        }

        if (prot !== null) {

          proteines += prot;
          proteinesConnues = true;

        }

      }
    );

    return {
      calories:
        caloriesConnues
          ? Math.round(calories)
          : null,

      proteines:
        proteinesConnues
          ? Math.round(
              proteines * 10
            ) / 10
          : null
    };

  }

  /* =====================================================
     STATUT JOURNEE
  ===================================================== */

  function obtenirStatutJournee(
    calories
  ) {

    if (
      !configuration.calories?.active
    ) {

      return {
        classe: "status-ok",
        texte: "✓ Journée composée"
      };

    }

    const intervalle =
      obtenirIntervalleCalories(
        configuration.calories.objectif
      );

    if (
      !intervalle ||
      calories === null
    ) {

      return {
        classe: "status-warning",
        texte: "🟠 Calories à vérifier"
      };

    }

    if (
      calories >= intervalle.min &&
      calories <= intervalle.max
    ) {

      return {
        classe: "status-ok",
        texte: "✓ Objectif respecté"
      };

    }

    const ecart =
      calories < intervalle.min
        ? intervalle.min - calories
        : calories - intervalle.max;

    /* Proche de la cible */

    if (ecart <= 150) {

      return {
        classe: "status-warning",
        texte: "🟠 À ajuster légèrement"
      };

    }

    return {
      classe: "status-danger",
      texte: "🔴 Objectif difficile à atteindre"
    };

  }

  /* =====================================================
     AFFICHAGE CONFIGURATION
  ===================================================== */

  function afficherConfiguration() {

    const container =
      document.getElementById(
        "configContainer"
      );

    const repas = [];

    if (
      configuration.repas?.petitDejeuner
    ) {
      repas.push(
        "Petit-déjeuner"
      );
    }

    if (
      configuration.repas?.dejeuner
    ) {
      repas.push(
        "Déjeuner"
      );
    }

    if (
      configuration.repas?.diner
    ) {
      repas.push(
        "Dîner"
      );
    }

    let calories =
      "Pas d'objectif";

    if (
      configuration.calories?.active
    ) {
      calories =
        configuration.calories.objectif
        + " kcal / jour";
    }

    let proteines =
      "Pas d'objectif";

    if (
      configuration.proteines?.active &&
      configuration.proteines.objectif
    ) {

      proteines =
        configuration.proteines.objectif
        + " g / jour";

    }

    const regime =
      configuration.regime === "vegetarien"
        ? "🌱 Végétarien"
        : "🥩 Viande / poisson";

    container.innerHTML = `

      <section class="config-card">

        <h2>✨ Vos critères</h2>

        <div class="config-grid">

          <div class="config-item">
            <strong>📅 Durée</strong>
            ${configuration.duree} jour${configuration.duree > 1 ? "s" : ""}
          </div>

          <div class="config-item">
            <strong>🍽️ Repas</strong>
            ${configuration.repasParJour} / jour
          </div>

          <div class="config-item">
            <strong>🥗 Organisation</strong>
            ${repas.join(", ")}
          </div>

          <div class="config-item">
            <strong>🥩 Alimentation</strong>
            ${regime}
          </div>

          <div class="config-item">
            <strong>🔥 Repère calorique</strong>
            ${calories}
          </div>

          <div class="config-item">
            <strong>💪 Protéines</strong>
            ${proteines}
          </div>

        </div>

      </section>

    `;

  }

  /* =====================================================
     AFFICHAGE SEMAINE
  ===================================================== */

  function afficherSemaine() {

    const container =
      document.getElementById(
        "semaineContainer"
      );

    if (!semaine.length) {

      container.innerHTML = `

        <div class="message">

          <div class="big">🍽️</div>

          <h2>Votre semaine n'a pas pu être créée</h2>

          <p>
            Nous n'avons pas trouvé suffisamment
            de recettes correspondant à vos critères.
            Essayez de modifier certains choix.
          </p>

          <a
            href="ReprendreMonRythme.html"
            class="button btn-primary"
          >
            ⚙️ Modifier mes choix
          </a>

        </div>

      `;

      return;

    }

    container.innerHTML = "";

    semaine.forEach(
      jour => {

        const totaux =
          calculerTotauxJournee(
            jour
          );

        const statut =
          obtenirStatutJournee(
            totaux.calories
          );

        const intervalle =
          configuration.calories?.active
            ? obtenirIntervalleCalories(
                configuration.calories.objectif
              )
            : null;

        const jourElement =
          document.createElement(
            "section"
          );

        jourElement.className =
          "day-card";

        let totalTexte =
          "";

        if (
          totaux.calories !== null
        ) {

          totalTexte += `
            <strong>
              ${totaux.calories} kcal
            </strong>
          `;

          if (intervalle) {

            totalTexte += `
              / ${intervalle.min}–${intervalle.max} kcal
            `;

          }

        } else {

          totalTexte +=
            "Calories non renseignées";

        }

        if (
          totaux.proteines !== null
        ) {

          totalTexte += `
            · <strong>
              ${totaux.proteines} g de protéines
            </strong>
          `;

        }

        jourElement.innerHTML = `

          <div class="day-header">

            <div class="day-title">

              <h2>
                Jour ${jour.numero}
              </h2>

              <span
                class="day-status ${statut.classe}"
              >
                ${statut.texte}
              </span>

            </div>

            <div class="day-total">
              ${totalTexte}
            </div>

          </div>

          <div class="day-content"></div>

        `;

        const content =
          jourElement.querySelector(
            ".day-content"
          );

        jour.repas.forEach(
          (repas, index) => {

            const libelle =
              libelleRepas(
                repas.type,
                index
              );

            const recette =
              repas.recette;

            const calories =
              getCalories(recette);

            const proteines =
              getProteines(recette);

            const meal =
              document.createElement(
                "article"
              );

            meal.className =
              "meal";

            meal.innerHTML = `

              <div class="meal-header">

                <span class="meal-icon">
                  ${libelle.icon}
                </span>

                <span class="meal-name">
                  ${libelle.nom}
                </span>

              </div>

              <div class="recipe-name">

                <a
                  href="Recette.html?id=${encodeURIComponent(recette.id)}"
                >
                  ${recette.nom || "Petite assiette"}
                </a>

              </div>

              <div class="recipe-meta">

                ${
                  calories !== null
                    ? `
                      <span class="meta">
                        🔥 ${Math.round(calories)} kcal
                      </span>
                    `
                    : `
                      <span class="meta">
                        🔥 kcal non renseignées
                      </span>
                    `
                }

                ${
                  proteines !== null
                    ? `
                      <span class="meta">
                        💪 ${proteines} g protéines
                      </span>
                    `
                    : ""
                }

                ${
                  recette.temps
                    ? `
                      <span class="meta">
                        ⏱️ ${recette.temps}
                      </span>
                    `
                    : ""
                }

              </div>

              <div class="meal-actions">

                <a
                  class="button btn-recipe"
                  href="Recette.html?id=${encodeURIComponent(recette.id)}"
                >
                  👀 Voir la recette
                </a>

                <button
                  class="btn-change"
                  onclick="changerRecette(
                    ${jour.numero},
                    ${index}
                  )"
                >
                  🔄 Changer
                </button>

              </div>

            `;

            content.appendChild(
              meal
            );

          }
        );

        /* =================================================
           BOUTON AJUSTEMENT
        ================================================= */

        if (
          configuration.calories?.active
        ) {

          const ecartImportant =
            statut.classe !== "status-ok";

          if (ecartImportant) {

            const box =
              document.createElement(
                "div"
              );

            box.className =
              "adjust-box";

            box.innerHTML = `

              <p>
                Cette journée est proche ou éloignée
                de votre repère calorique.
                Nous pouvons essayer de remplacer
                une recette pour mieux équilibrer
                la journée.
              </p>

              <button
                class="button btn-green"
                onclick="ajusterJournee(${jour.numero})"
              >
                🔄 Ajuster ma journée
              </button>

            `;

            content.appendChild(
              box
            );

          }

        }

        container.appendChild(
          jourElement
        );

      }
    );

  }

  /* =====================================================
     CHANGER UNE RECETTE
  ===================================================== */

  function changerRecette(
    numeroJour,
    indexRepas
  ) {

    const jour =
      semaine.find(
        j =>
          j.numero === numeroJour
      );

    if (!jour) {
      return;
    }

    const repas =
      jour.repas[indexRepas];

    if (!repas) {
      return;
    }

    const ids =
      jour.repas
        .filter(
          (_, index) =>
            index !== indexRepas
        )
        .map(
          r =>
            r.recette.id
        );

    const candidates =
      recettes
        .filter(
          recette =>
            recetteCompatible(
              recette,
              repas.type
            )
        )
        .filter(
          recette =>
            !ids.includes(
              recette.id
            )
        );

    if (!candidates.length) {

      alert(
        "Nous n'avons pas trouvé d'autre recette correspondant à vos critères pour ce repas."
      );

      return;

    }

    candidates.sort(
      (a, b) =>
        scoreRecette(
          b,
          repas.type
        ) -
        scoreRecette(
          a,
          repas.type
        )
    );

    const nouvelle =
      candidates[0];

    repas.recette =
      nouvelle;

    afficherSemaine();

  }

  /* =====================================================
     AJUSTER UNE JOURNEE
  ===================================================== */

  function ajusterJournee(
    numeroJour
  ) {

    const jour =
      semaine.find(
        j =>
          j.numero === numeroJour
      );

    if (!jour) {
      return;
    }

    const intervalle =
      obtenirIntervalleCalories(
        configuration.calories?.objectif
      );

    if (!intervalle) {
      return;
    }

    const actuel =
      calculerTotauxJournee(
        jour
      );

    if (
      actuel.calories === null
    ) {

      alert(
        "Les calories ne sont pas renseignées pour suffisamment de recettes pour ajuster cette journée."
      );

      return;

    }

    let meilleurJour =
      null;

    let meilleureDistance =
      Infinity;

    const repasOriginaux =
      jour.repas.map(
        repas => ({
          type: repas.type,
          recette: repas.recette
        })
      );

    /* Tester chaque remplacement */

    for (
      let index = 0;
      index < jour.repas.length;
      index++
    ) {

      const repas =
        jour.repas[index];

      const ids =
        jour.repas
          .filter(
            (_, i) =>
              i !== index
          )
          .map(
            r =>
              r.recette.id
          );

      const candidates =
        recettes
          .filter(
            recette =>
              recetteCompatible(
                recette,
                repas.type
              )
          )
          .filter(
            recette =>
              !ids.includes(
                recette.id
              )
          )
          .filter(
            recette =>
              recette.id !==
              repas.recette.id
          );

      for (
        const candidate of candidates
      ) {

        jour.repas[index].recette =
          candidate;

        const nouveau =
          calculerTotauxJournee(
            jour
          );

        if (
          nouveau.calories === null
        ) {
          continue;
        }

        let distance = 0;

        if (
          nouveau.calories <
          intervalle.min
        ) {

          distance =
            intervalle.min -
            nouveau.calories;

        } else if (
          nouveau.calories >
          intervalle.max
        ) {

          distance =
            nouveau.calories -
            intervalle.max;

        } else {

          distance = 0;

        }

        if (
          distance <
          meilleureDistance
        ) {

          meilleureDistance =
            distance;

          meilleurJour =
            jour.repas.map(
              r => ({
                type: r.type,
                recette: r.recette
              })
            );

        }

      }

    }

    /* Restaurer */

    jour.repas =
      repasOriginaux.map(
        repas => ({
          type: repas.type,
          recette: repas.recette
        })
      );

    /* Appliquer meilleur résultat */

    if (meilleurJour) {

      jour.repas =
        meilleurJour;

      afficherSemaine();

      return;

    }

    alert(
      "Aucune autre combinaison de recettes n'a permis de rapprocher cette journée de votre objectif."
    );

  }

  /* =====================================================
     NOUVELLE SEMAINE
  ===================================================== */

  function genererNouvelleSemaine() {

    genererSemaine();

    afficherSemaine();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }

  /* =====================================================
     CHARGER JSON
  ===================================================== */

  async function chargerRecettes() {

    try {

      const response =
        await fetch(
          "../recettes.json"
        );

      if (!response.ok) {

        throw new Error(
          "Impossible de charger recettes.json"
        );

      }

      const data =
        await response.json();

      if (
        Array.isArray(data)
      ) {

        recettes = data;

      } else if (
        Array.isArray(data.recettes)
      ) {

        recettes =
          data.recettes;

      } else {

        throw new Error(
          "Format du fichier recettes.json non reconnu"
        );

      }

    } catch (error) {

      console.error(error);

      document.getElementById(
        "semaineContainer"
      ).innerHTML = `

        <div class="message">

          <div class="big">⚠️</div>

          <h2>Impossible de charger les recettes</h2>

          <p>
            Vérifiez que le fichier
            <strong>recettes.json</strong>
            est bien présent dans le dossier
            <strong>src</strong>.
          </p>

          <a
            href="ReprendreMonRythme.html"
            class="button btn-primary"
          >
            ← Retour
          </a>

        </div>

      `;

      throw error;

    }

  }

  /* =====================================================
     CHARGER CONFIGURATION
  ===================================================== */

  function chargerConfiguration() {

    try {

      const sauvegarde =
        localStorage.getItem(
          STORAGE_KEY
        );

      if (!sauvegarde) {

        throw new Error(
          "Aucune configuration trouvée"
        );

      }

      configuration =
        JSON.parse(
          sauvegarde
        );

    } catch (error) {

      console.error(error);

      document.getElementById(
        "semaineContainer"
      ).innerHTML = `

        <div class="message">

          <div class="big">⚙️</div>

          <h2>Votre rythme n'est pas encore configuré</h2>

          <p>
            Commencez par choisir vos repas,
            la durée de votre semaine et vos préférences.
          </p>

          <a
            href="ReprendreMonRythme.html"
            class="button btn-primary"
          >
            ✨ Créer ma semaine
          </a>

        </div>

      `;

      return false;

    }

    return true;

  }

  /* =====================================================
     INITIALISATION
  ===================================================== */

  async function init() {

    const ok =
      chargerConfiguration();

    if (!ok) {
      return;
    }

    afficherConfiguration();

    await chargerRecettes();

    genererSemaine();

    afficherSemaine();

  }

  init();

</script>
