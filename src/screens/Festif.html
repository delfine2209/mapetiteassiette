<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Festif – Des petites recettes pour les fêtes</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff7fb;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .sous-titre {
      text-align: center;
      margin-bottom: 30px;
      color: #777;
    }

    .filtres {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 25px;
    }

    .filtre {
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      background: #f0f0f0;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .filtre.actif {
      background: #ff80aa;
      color: white;
      font-weight: bold;
    }

    #liste-recettes {
      max-width: 900px;
      margin: 0 auto;
    }

    .recette-carte {
      height: 260px;
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      display: flex;
      align-items: flex-end;
      padding: 16px;
      margin-bottom: 20px;
      position: relative;
    }

    .recette-info {
      background: rgba(255, 255, 255, 0.85);
      padding: 12px;
      border-radius: 10px;
      max-width: 70%;
    }

    .recette-info h3 {
      margin: 0;
      font-size: 1.2rem;
    }

    .recette-info p {
      margin: 6px 0 12px;
      font-size: 0.95rem;
    }

    .btn {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h1>Festif</h1>
  <p class="sous-titre">Des petites recettes pour les fêtes et les moments conviviaux.</p>

  <!-- Filtres -->
  <div class="filtres">
    <button class="filtre actif" data-filtre="TOUTES">Toutes</button>
    <button class="filtre" data-filtre="APERO">🥂 Apéro</button>
    <button class="filtre" data-filtre="CREPES">🥞 Crêpes</button>
    <button class="filtre" data-filtre="NOEL">🎄 Noël</button>
    <button class="filtre" data-filtre="PAQUES">🐣 Pâques</button>
    <button class="filtre" data-filtre="GALETTE">👑 Galette</button>
    <button class="filtre" data-filtre="FESTIF">🍓 Festif</button>
  </div>

  <!-- Liste des recettes -->
  <div id="liste-recettes"></div>

  <script>
    // Exemple de données (à remplacer par tes vraies recettes)
    const recettes = [
      {
        nom: "Apéro-dinatoire chic",
        description: "Petites bouchées salées pour démarrer la soirée.",
        categorie: "APERO",
        image: "./images/recettes/apero.jpg"
      },
      {
        nom: "Crêpes gourmandes",
        description: "Crêpes sucrées et salées pour tous les goûts.",
        categorie: "CREPES",
        image: "./images/recettes/crepes.jpg"
      },
      {
        nom: "Menu de Noël",
        description: "Un repas chaleureux pour les fêtes de fin d’année.",
        categorie: "NOEL",
        image: "./images/recettes/noel.jpg"
      },
      {
        nom: "Brunch de Pâques",
        description: "Recettes légères et colorées pour Pâques.",
        categorie: "PAQUES",
        image: "./images/recettes/paques.jpg"
      },
      {
        nom: "Galette des rois",
        description: "La traditionnelle galette pour tirer les rois.",
        categorie: "GALETTE",
        image: "./images/recettes/galette.jpg"
      },
      {
        nom: "Desserts festifs",
        description: "Des douceurs pour tous les moments conviviaux.",
        categorie: "FESTIF",
        image: "./images/recettes/festif.jpg"
      }
    ];

    function getIconCategorie(cat) {
      switch (cat) {
        case "APERO": return "🥂";
        case "CREPES": return "🥞";
        case "NOEL": return "🎄";
        case "PAQUES": return "🐣";
        case "GALETTE": return "👑";
        case "FESTIF": return "🍓";
        default: return "🍽️";
      }
    }

    function getCouleurCategorie(cat) {
      switch (cat) {
        case "APERO": return "#ffb347";     // orange pastel
        case "CREPES": return "#ffd966";    // jaune doux
        case "NOEL": return "#d9534f";      // rouge Noël
        case "PAQUES": return "#b3e6b3";    // vert pastel
        case "GALETTE": return "#f7c6c7";   // rose clair
        case "FESTIF": return "#ff80aa";    // framboise
        default: return "#cccccc";
      }
    }

    function afficherRecettes(recettesFiltrees) {
      const liste = document.getElementById("liste-recettes");

      liste.innerHTML = recettesFiltrees.map((recette) => {
        const image = recette.image || `./images/recettes/default.jpg`;
        const icone = getIconCategorie(recette.categorie);
        const couleur = getCouleurCategorie(recette.categorie);

        return `
          <div class="recette-carte ${recette.categorie}" 
               style="background-image:url('${image}')">

            <div class="recette-info">
              <h3>${icone} ${recette.nom}</h3>
              <p>${recette.description}</p>

              <a href="#" class="btn" style="background-color:${couleur}">
                Voir les recettes →
              </a>
            </div>

          </div>
        `;
      }).join('');
    }

    // Gestion des filtres
    const boutonsFiltres = document.querySelectorAll(".filtre");

    boutonsFiltres.forEach((btn) => {
      btn.addEventListener("click", () => {
        boutonsFiltres.forEach(b => b.classList.remove("actif"));
        btn.classList.add("actif");

        const filtre = btn.getAttribute("data-filtre");

        if (filtre === "TOUTES") {
          afficherRecettes(recettes);
        } else {
          const filtrées = recettes.filter(r => r.categorie === filtre);
          afficherRecettes(filtrées);
        }
      });
    });

    // Affichage initial
    afficherRecettes(recettes);
  </script>
</body>
</html>
