<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recette - Ma Petite Assiette</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf5;
      color: #4d4038;
    }

    .page {
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .hero {
      background: linear-gradient(135deg, #f6d9c8, #dce8d7);
      padding: 25px 20px 30px;
      border-radius: 0 0 30px 30px;
    }

    .back {
      display: inline-block;
      text-decoration: none;
      color: #66574e;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: rgba(255,255,255,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.15;
      color: #3f5145;
    }

    .categorie {
      font-size: 14px;
      color: #6e625a;
    }

    main {
      padding: 20px 16px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .info-card {
      background: white;
      border-radius: 18px;
      padding: 14px 8px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(90, 70, 55, 0.08);
    }

    .info-icon {
      font-size: 22px;
      display: block;
      margin-bottom: 5px;
    }

    .info-label {
      display: block;
      font-size: 11px;
      color: #8a7c73;
      margin-bottom: 3px;
    }

    .info-value {
      font-weight: bold;
      font-size: 13px;
      color: #4f6355;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 5px 18px rgba(90, 70, 55, 0.08);
    }

    .card h2 {
      margin: 0 0 15px;
      font-size: 20px;
      color: #4f6355;
    }

    /* QUANTITÉS */

    .quantity-card {
      background: linear-gradient(135deg, #fff5ed, #f1f7ee);
      border: 1px solid #eaded4;
    }

    .quantity-intro {
      margin: -5px 0 15px;
      font-size: 13px;
      color: #786b63;
      line-height: 1.5;
    }

    .quantity-options {
      display: grid;
      gap: 10px;
    }

    .quantity-option {
      position: relative;
    }

    .quantity-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .quantity-option label {
      display: block;
      padding: 14px 15px;
      background: white;
      border: 2px solid #eadfd6;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 600;
      color: #5b5049;
      transition: 0.2s;
    }

    .quantity-option input:checked + label {
      border-color: #78927d;
      background: #eef5ed;
      color: #405846;
    }

    .quantity-option label:hover {
      border-color: #a7b9a9;
    }

    .quantity-result {
      margin-top: 17px;
      padding: 15px;
      background: rgba(255,255,255,0.8);
      border-radius: 16px;
    }

    .quantity-result-title {
      font-size: 14px;
      font-weight: bold;
      color: #4f6355;
      margin-bottom: 10px;
    }

    .quantity-line {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 8px 0;
      border-bottom: 1px solid #eee4dc;
      font-size: 14px;
    }

    .quantity-line:last-child {
      border-bottom: none;
    }

    .quantity-name {
      color: #62564e;
    }

    .quantity-value {
      font-weight: bold;
      color: #4f6355;
      text-align: right;
    }

    /* INGRÉDIENTS */

    .ingredient-list,
    .preparation-list {
      margin: 0;
      padding-left: 20px;
    }

    .ingredient-list li,
    .preparation-list li {
      margin-bottom: 10px;
      line-height: 1.5;
      font-size: 14px;
    }

    .preparation-list li::marker {
      color: #78927d;
      font-weight: bold;
    }

    /* BADGES */

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .badge {
      display: inline-block;
      padding: 8px 11px;
      border-radius: 20px;
      background: #eef5ed;
      color: #506653;
      font-size: 12px;
      font-weight: 600;
    }

    .badge.peach {
      background: #fff0e6;
      color: #8b6651;
    }

    /* FAVORI */

    .favorite-button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 15px;
      background: #78927d;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .favorite-button.active {
      background: #d98772;
    }

    /* NOTE */

    .note {
      background: #fff5ed;
      border-radius: 18px;
      padding: 15px;
      font-size: 13px;
      line-height: 1.5;
      color: #75665c;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    /* NAVIGATION */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: rgba(255,255,255,0.97);
      border-top: 1px solid #eadfd6;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 100;
      box-shadow: 0 -4px 15px rgba(80, 60, 45, 0.08);
    }

    .bottom-nav a {
      text-decoration: none;
      color: #80736a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      gap: 4px;
    }

    .bottom-nav a span {
      font-size: 21px;
    }

    .bottom-nav a.active {
      color: #536b59;
      font-weight: bold;
    }

    @media (min-width: 700px) {
      main {
        max-width: 650px;
        margin: auto;
      }

      .hero {
        padding-left: calc((100% - 650px) / 2 + 20px);
        padding-right: calc((100% - 650px) / 2 + 20px);
      }
    }
  </style>
</head>

<body>

<div class="page">

  <header class="hero">
    <a href="Recettes.html" class="back">← Retour aux recettes</a>

    <div class="logo">🍽️</div>

    <h1 id="recipeName">Ma Petite Assiette</h1>
    <div class="categorie" id="recipeCategory"></div>
  </header>

  <main>

    <div id="recipeContent">
      <!-- La recette sera affichée ici -->
    </div>

  </main>

</div>

<nav class="bottom-nav">
  <a href="../../index.html">
    <span>🏠</span>
    Accueil
  </a>

  <a href="Recettes.html" class="active">
    <span>🍽️</span>
    Recettes
  </a>

  <a href="Favoris.html">
    <span>❤️</span>
    Favoris
  </a>

  <a href="MonProfil.html">
    <span>👤</span>
    Profil
  </a>
</nav>


<script>

  const params = new URLSearchParams(window.location.search);
  const recetteId = params.get("id");

  let recetteCourante = null;
  let quantiteSelectionnee = null;


  /* -------------------------------------------------
     MODE QUANTITÉ INITIAL
  ------------------------------------------------- */

  function getModeInitial(recette) {

    if (!recette.quantites) {
      return null;
    }

    const mode = localStorage.getItem("modePortion");

    if (mode === "famille") {
      return "famille2";
    }

    if (mode === "petite") {
      return "petite";
    }

    if (mode === "mixte") {
      return "petite";
    }

    return "petite";
  }


  /* -------------------------------------------------
     TITRE DE LA QUANTITÉ
  ------------------------------------------------- */

  function getNomQuantite(cle) {

    const noms = {
      petite: "🥄 Petite portion",
      famille2: "👤 2 personnes",
      famille4: "👨‍👩‍👧‍👦 4 personnes"
    };

    return noms[cle] || "";
  }


  /* -------------------------------------------------
     AFFICHAGE DES QUANTITÉS
  ------------------------------------------------- */

  function afficherQuantites() {

    const container = document.getElementById("quantitesContainer");

    if (!container || !recetteCourante || !recetteCourante.quantites) {
      return;
    }

    const quantites = recetteCourante.quantites[quantiteSelectionnee];

    if (!quantites) {
      container.innerHTML = "";
      return;
    }

    let html = `
      <div class="quantity-result">
        <div class="quantity-result-title">
          ${getNomQuantite(quantiteSelectionnee)}
        </div>
    `;

    Object.entries(quantites).forEach(([nom, valeur]) => {

      html += `
        <div class="quantity-line">
          <span class="quantity-name">${nom}</span>
          <span class="quantity-value">${valeur}</span>
        </div>
      `;

    });

    html += `</div>`;

    container.innerHTML = html;

    const portionElement = document.getElementById("portionValue");

    if (portionElement) {

      if (quantiteSelectionnee === "petite") {
        portionElement.textContent = "Petite portion";
      }

      if (quantiteSelectionnee === "famille2") {
        portionElement.textContent = "2 personnes";
      }

      if (quantiteSelectionnee === "famille4") {
        portionElement.textContent = "4 personnes";
      }
    }
  }


  /* -------------------------------------------------
     CRÉATION DU SÉLECTEUR
  ------------------------------------------------- */

  function afficherSelecteurQuantites() {

    const container = document.getElementById("quantitySelector");

    if (!container || !recetteCourante || !recetteCourante.quantites) {
      return;
    }

    quantiteSelectionnee = getModeInitial(recetteCourante);

    container.innerHTML = `
      <div class="card quantity-card">

        <h2>🍽️ Quelle quantité souhaitez-vous préparer ?</h2>

        <p class="quantity-intro">
          Choisissez la quantité qui correspond à votre repas.
          Vous pouvez passer d'une petite portion à une préparation familiale.
        </p>

        <div class="quantity-options">

          <div class="quantity-option">
            <input
              type="radio"
              name="quantite"
              id="quantitePetite"
              value="petite"
              ${quantiteSelectionnee === "petite" ? "checked" : ""}
            >
            <label for="quantitePetite">
              🥄 Petite portion
            </label>
          </div>

          <div class="quantity-option">
            <input
              type="radio"
              name="quantite"
              id="quantite2"
              value="famille2"
              ${quantiteSelectionnee === "famille2" ? "checked" : ""}
            >
            <label for="quantite2">
              👤 2 personnes
            </label>
          </div>

          <div class="quantity-option">
            <input
              type="radio"
              name="quantite"
              id="quantite4"
              value="famille4"
              ${quantiteSelectionnee === "famille4" ? "checked" : ""}
            >
            <label for="quantite4">
              👨‍👩‍👧‍👦 4 personnes
            </label>
          </div>

        </div>

        <div id="quantitesContainer"></div>

      </div>
    `;

    document
      .querySelectorAll('input[name="quantite"]')
      .forEach(input => {

        input.addEventListener("change", function() {

          quantiteSelectionnee = this.value;

          afficherQuantites();

        });

      });

    afficherQuantites();
  }


  /* -------------------------------------------------
     FAVORIS
  ------------------------------------------------- */

  function gererFavori() {

    const bouton = document.getElementById("favoriteButton");

    if (!bouton || !recetteCourante) {
      return;
    }

    let favoris = JSON.parse(
      localStorage.getItem("favoris") || "[]"
    );

    const estFavori = favoris.includes(recetteCourante.id);

    bouton.textContent = estFavori
      ? "❤️ Retirer des favoris"
      : "🤍 Ajouter aux favoris";

    bouton.classList.toggle("active", estFavori);

    bouton.onclick = function() {

      let favorisActuels = JSON.parse(
        localStorage.getItem("favoris") || "[]"
      );

      if (favorisActuels.includes(recetteCourante.id)) {

        favorisActuels = favorisActuels.filter(
          id => id !== recetteCourante.id
        );

      } else {

        favorisActuels.push(recetteCourante.id);

      }

      localStorage.setItem(
        "favoris",
        JSON.stringify(favorisActuels)
      );

      gererFavori();
    };
  }


  /* -------------------------------------------------
     AFFICHAGE DE LA RECETTE
  ------------------------------------------------- */

  function afficherRecette(recette) {

    recetteCourante = recette;

    document.title =
      recette.nom + " - Ma Petite Assiette";

    document.getElementById("recipeName").textContent =
      recette.nom;

    document.getElementById("recipeCategory").textContent =
      recette.categorie || "";


    const content = document.getElementById("recipeContent");


    /* BADGES */

    let badges = "";

    if (recette.petitAppetit) {
      badges += `<span class="badge">🥄 Petite assiette</span>`;
    }

    if (recette.preOperatoire) {
      badges += `<span class="badge">🌸 Pré-opératoire</span>`;
    }

    if (recette.postOperatoire) {
      badges += `<span class="badge">💚 Post-opératoire</span>`;
    }

    if (recette.vegetarien) {
      badges += `<span class="badge">🌱 Végétarien</span>`;
    }

    if (recette.sansGluten) {
      badges += `<span class="badge">🌾 Sans gluten</span>`;
    }

    if (recette.batchCooking) {
      badges += `<span class="badge peach">📦 Batch-cooking</span>`;
    }


    /* INGREDIENTS CLASSIQUES */

    let ingredientsHTML = "";

    if (Array.isArray(recette.ingredients)) {

      ingredientsHTML = recette.ingredients
        .map(ingredient => `<li>${ingredient}</li>`)
        .join("");

    }


    content.innerHTML = `

      <div class="info-grid">

        <div class="info-card">
          <span class="info-icon">⏱️</span>
          <span class="info-label">Temps</span>
          <span class="info-value">
            ${recette.temps || "-"} min
          </span>
        </div>

        <div class="info-card">
          <span class="info-icon">💪</span>
          <span class="info-label">Protéines</span>
          <span class="info-value">
            ${recette.proteines || "-"} g
          </span>
        </div>

        <div class="info-card">
          <span class="info-icon">🍽️</span>
          <span class="info-label">Portion</span>
          <span class="info-value" id="portionValue">
            ${recette.portion || "-"}
          </span>
        </div>

      </div>


      <div id="quantitySelector"></div>


      <button
        id="favoriteButton"
        class="favorite-button">
        🤍 Ajouter aux favoris
      </button>


      ${
        badges
          ? `
            <div class="card">
              <h2>✨ Cette recette vous correspond</h2>
              <div class="badges">
                ${badges}
              </div>
            </div>
          `
          : ""
      }


      <div class="card">

        <h2>🥕 Ingrédients</h2>

        <ul class="ingredient-list">
          ${ingredientsHTML}
        </ul>

      </div>


      <div class="card">

        <h2>👩‍🍳 Préparation</h2>

        <ol class="preparation-list">

          ${
            Array.isArray(recette.preparation)
              ? recette.preparation
                  .map(etape => `<li>${etape}</li>`)
                  .join("")
              : ""
          }

        </ol>

      </div>


      ${
        recette.batchCookingDetail
          ? `
            <div class="card">

              <h2>📦 Batch-cooking</h2>

              <p class="note">
                ${recette.batchCookingDetail}
              </p>

              ${
                recette.conservation
                  ? `
                    <p class="note" style="margin-top:10px;">
                      🧊 ${recette.conservation}
                    </p>
                  `
                  : ""
              }

              ${
                recette.congelation
                  ? `
                    <p class="note" style="margin-top:10px;">
                      ❄️ ${recette.congelation}
                    </p>
                  `
                  : ""
              }

            </div>
          `
          : ""
      }


      <div class="card">

        <h2>🌸 À savoir</h2>

        <p class="note">
          Les quantités et textures doivent toujours être adaptées
          à votre appétit, à votre tolérance et, lorsqu'il s'agit
          d'un parcours chirurgical, aux recommandations de votre
          équipe médicale.
        </p>

      </div>

    `;


    /* Affichage du sélecteur uniquement
       pour les recettes qui possèdent
       un système de quantités */

    afficherSelecteurQuantites();

    gererFavori();
  }


  /* -------------------------------------------------
     RECUPERATION DU FICHIER JSON
  ------------------------------------------------- */

  fetch("../recettes.json")

    .then(response => {

      if (!response.ok) {
        throw new Error("Impossible de charger les recettes.");
      }

      return response.json();

    })

    .then(recettes => {

      const recette = recettes.find(
        item => item.id === recetteId
      );

      if (!recette) {

        document.getElementById("recipeContent").innerHTML = `

          <div class="empty">

            <div class="empty-icon">🍽️</div>

            <h2>Recette introuvable</h2>

            <p>
              Cette recette n'existe pas ou n'est plus disponible.
            </p>

          </div>

        `;

        return;
      }

      afficherRecette(recette);

    })

    .catch(error => {

      console.error(error);

      document.getElementById("recipeContent").innerHTML = `

        <div class="empty">

          <div class="empty-icon">⚠️</div>

          <h2>Une erreur est survenue</h2>

          <p>
            Impossible de charger cette recette.
          </p>

        </div>

      `;

    });

</script>

</body>
</html>
