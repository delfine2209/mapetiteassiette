<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recette - Ma Petite Assiette</title>

  <link rel="stylesheet" href="../style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf5;
      color: #4b4039;
    }

    .page {
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .hero {
      padding: 28px 20px 30px;
      background: linear-gradient(
        135deg,
        #f8d8c7,
        #f4e5c8,
        #dce8d5
      );
      border-radius: 0 0 30px 30px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #5f7553;
      text-decoration: none;
      font-weight: 600;
    }

    .logo {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.7);
      border-radius: 18px;
      font-size: 30px;
      margin-bottom: 15px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.15;
    }

    .hero p {
      margin: 0;
      line-height: 1.5;
    }

    .content {
      padding: 20px 16px;
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(90,70,50,.07);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .badge {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 20px;
      background: #f5eee7;
      font-size: 13px;
    }

    .badge.green {
      background: #e4efdf;
      color: #55704d;
    }

    .badge.peach {
      background: #fae3d7;
      color: #805c4d;
    }

    .section-title {
      margin: 0 0 15px;
      font-size: 21px;
      color: #51453e;
    }

    /* SELECTEUR DE QUANTITES */

    .quantity-card {
      background: linear-gradient(
        135deg,
        #fff8f1,
        #f7f3e9
      );
      border: 1px solid #eee2d5;
    }

    .quantity-intro {
      margin: -5px 0 16px;
      color: #756961;
      font-size: 14px;
      line-height: 1.5;
    }

    .quantity-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .quantity-option {
      position: relative;
    }

    .quantity-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .quantity-option label {
      display: block;
      padding: 13px 7px;
      text-align: center;
      border: 2px solid #eadfd5;
      border-radius: 16px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.35;
      transition: .2s;
    }

    .quantity-option label span {
      display: block;
      font-size: 21px;
      margin-bottom: 5px;
    }

    .quantity-option input:checked + label {
      border-color: #8ba17e;
      background: #edf4e9;
      color: #50684a;
      font-weight: 600;
    }

    .quantity-info {
      margin-top: 15px;
      padding: 12px 14px;
      background: #fff;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
      color: #6e625a;
    }

    .ingredient-list {
      margin: 0;
      padding-left: 20px;
    }

    .ingredient-list li {
      margin-bottom: 10px;
      line-height: 1.45;
    }

    .preparation-list {
      margin: 0;
      padding-left: 22px;
    }

    .preparation-list li {
      margin-bottom: 13px;
      line-height: 1.5;
    }

    .favorite-button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #f3dfd3;
      color: #6b5146;
      margin-top: 5px;
    }

    .favorite-button.active {
      background: #e8efdf;
      color: #55704d;
    }

    .notice {
      padding: 14px 16px;
      background: #fff4df;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.5;
      color: #6c5b49;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
    }

    .empty a {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 18px;
      border-radius: 16px;
      background: #dfead9;
      color: #50684a;
      text-decoration: none;
      font-weight: 600;
    }

    /* NAVIGATION */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: rgba(255,255,255,.96);
      border-top: 1px solid #eee5dd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #82766e;
      text-align: center;
      font-size: 12px;
    }

    .bottom-nav a span {
      display: block;
      font-size: 22px;
      margin-bottom: 2px;
    }

    .bottom-nav a.active {
      color: #5c7552;
      font-weight: 700;
    }

    @media (max-width: 380px) {
      .quantity-options {
        gap: 5px;
      }

      .quantity-option label {
        font-size: 12px;
        padding-left: 4px;
        padding-right: 4px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div id="app">
    <div class="empty">
      <p>Chargement de la recette…</p>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <a href="../../index.html">
    <span>🏠</span>
    Accueil
  </a>

  <a href="Recettes.html" class="active">
    <span>🍽️</span>
    Recettes
  </a>

  <a href="Favoris.html">
    <span>❤️</span>
    Favoris
  </a>

  <a href="MonProfil.html">
    <span>👤</span>
    Profil
  </a>
</nav>


<script>

  /* =========================================================
     PARAMETRES
  ========================================================= */

  const params = new URLSearchParams(window.location.search);
  const recetteId = params.get("id");

  let recetteActuelle = null;
  let modeQuantiteActuel = "petite";


  /* =========================================================
     OUTILS
  ========================================================= */

  function normaliserTexte(texte) {
    return String(texte || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .trim();
  }


  /*
   * Transforme une quantité écrite sous forme :
   *
   * 120
   * 1/2
   * 1,5
   * 1 1/2
   *
   * en nombre.
   */
  function convertirNombre(texte) {

    if (!texte) {
      return null;
    }

    let valeur = String(texte)
      .trim()
      .replace(",", ".");

    // Fraction simple : 1/2
    if (/^\d+\s*\/\s*\d+$/.test(valeur)) {

      const morceaux = valeur.split("/");

      return (
        Number(morceaux[0].trim()) /
        Number(morceaux[1].trim())
      );
    }

    // Nombre mixte : 1 1/2
    const mixte = valeur.match(
      /^(\d+(?:\.\d+)?)\s+(\d+)\s*\/\s*(\d+)$/
    );

    if (mixte) {

      return (
        Number(mixte[1]) +
        Number(mixte[2]) / Number(mixte[3])
      );
    }

    const nombre = Number(valeur);

    return Number.isFinite(nombre)
      ? nombre
      : null;
  }


  /*
   * Transforme 0.5 en 1/2 lorsque c'est plus lisible.
   */
  function afficherNombre(nombre) {

    if (Math.abs(nombre - 0.5) < 0.001) {
      return "1/2";
    }

    if (Math.abs(nombre - 0.25) < 0.001) {
      return "1/4";
    }

    if (Math.abs(nombre - 0.75) < 0.001) {
      return "3/4";
    }

    if (Math.abs(nombre - 1.5) < 0.001) {
      return "1 1/2";
    }

    if (Math.abs(nombre - 2.5) < 0.001) {
      return "2 1/2";
    }

    if (Number.isInteger(nombre)) {
      return String(nombre);
    }

    return nombre
      .toFixed(2)
      .replace(/0+$/, "")
      .replace(/\.$/, "")
      .replace(".", ",");
  }


  /*
   * Arrondit intelligemment les quantités.
   *
   * Les grammes / ml peuvent rester entiers.
   * Les cuillères peuvent accepter des demi-unités.
   */
  function arrondirQuantite(nombre, unite) {

    const u = normaliserTexte(unite);

    if (
      u.includes("g") ||
      u.includes("ml") ||
      u.includes("kg") ||
      u.includes("cl")
    ) {
      return Math.round(nombre);
    }

    return Math.round(nombre * 4) / 4;
  }


  /* =========================================================
     CALCUL AUTOMATIQUE
  ========================================================= */

  function calculerIngredient(ingredient, facteur) {

    if (!ingredient || facteur === 1) {
      return ingredient;
    }

    const texte = String(ingredient).trim();

    /*
     * On cherche une quantité uniquement au début
     * de l'ingrédient.
     *
     * Exemples pris en charge :
     *
     * 120 g de poulet
     * 2 courgettes
     * 1/2 oignon
     * 1,5 cuillère à soupe d'huile
     * 1 petite courgette
     */

    const match = texte.match(
      /^(\d+(?:[,.]\d+)?|\d+\s*\/\s*\d+|\d+\s+\d+\s*\/\s*\d+)(\s*)(.*)$/i
    );

    if (!match) {
      return ingredient;
    }

    const valeurInitiale = convertirNombre(match[1]);

    if (valeurInitiale === null) {
      return ingredient;
    }

    const reste = match[3] || "";

    /*
     * Pour les quantités alimentaires très petites,
     * on évite de produire 0.
     */
    let nouvelleValeur =
      valeurInitiale * facteur;

    nouvelleValeur =
      arrondirQuantite(
        nouvelleValeur,
        reste
      );

    if (nouvelleValeur <= 0) {
      nouvelleValeur = 0.25;
    }

    return afficherNombre(nouvelleValeur) +
      " " +
      reste;
  }


  /*
   * Calcule le facteur en fonction du nombre de portions
   * de la recette.
   *
   * Petite portion = 1 portion
   * Famille = 2 portions
   * Famille = 4 portions
   */
  function obtenirFacteur(mode) {

    const portionsBase =
      Number(recetteActuelle.portions) || 2;

    let portionsCible = 1;

    if (mode === "famille2") {
      portionsCible = 2;
    }

    if (mode === "famille4") {
      portionsCible = 4;
    }

    return portionsCible / portionsBase;
  }


  /* =========================================================
     QUANTITES PREDEFINIES
  ========================================================= */

  function obtenirQuantitesPredefinies(mode) {

    if (
      !recetteActuelle.quantites ||
      !recetteActuelle.quantites[mode]
    ) {
      return null;
    }

    return recetteActuelle.quantites[mode];
  }


  /*
   * Transforme les quantités explicites du JSON
   * en liste HTML.
   */
  function afficherQuantitesPredefinies(mode) {

    const quantites =
      obtenirQuantitesPredefinies(mode);

    if (!quantites) {
      return null;
    }

    const liste = [];

    Object.entries(quantites).forEach(
      ([nom, quantite]) => {

        liste.push(
          `<li><strong>${nom}</strong> : ${quantite}</li>`
        );

      }
    );

    return liste.join("");
  }


  /* =========================================================
     INGREDIENTS
  ========================================================= */

  function afficherIngredients() {

    const liste =
      document.getElementById("ingredientsList");

    if (!liste) {
      return;
    }

    /*
     * PRIORITE 1 :
     * Les recettes ayant des quantites précises
     * utilisent toujours ces quantités.
     */
    const quantitesPredefinies =
      afficherQuantitesPredefinies(
        modeQuantiteActuel
      );

    if (quantitesPredefinies) {

      liste.innerHTML =
        quantitesPredefinies;

      return;
    }


    /*
     * PRIORITE 2 :
     * Les recettes post-opératoires sans quantités
     * précises ne sont PAS recalculées automatiquement.
     *
     * On conserve leurs ingrédients d'origine.
     */
    if (recetteActuelle.postOperatoire === true) {

      liste.innerHTML =
        recetteActuelle.ingredients
          .map(
            ingredient =>
              `<li>${ingredient}</li>`
          )
          .join("");

      return;
    }


    /*
     * PRIORITE 3 :
     * Toutes les recettes classiques peuvent utiliser
     * le calcul automatique.
     */

    const facteur =
      obtenirFacteur(
        modeQuantiteActuel
      );

    liste.innerHTML =
      recetteActuelle.ingredients
        .map(
          ingredient =>
            `<li>${calculerIngredient(
              ingredient,
              facteur
            )}</li>`
        )
        .join("");
  }


  /* =========================================================
     INFORMATIONS SUR LES QUANTITES
  ========================================================= */

  function afficherInformationQuantites() {

    const zone =
      document.getElementById(
        "quantityInformation"
      );

    if (!zone) {
      return;
    }

    /*
     * Quantités explicites
     */
    if (
      recetteActuelle.quantites &&
      recetteActuelle.quantites[modeQuantiteActuel]
    ) {

      zone.innerHTML =
        "✓ Quantités prévues spécifiquement pour cette recette.";

      return;
    }


    /*
     * Post-opératoire
     */
    if (recetteActuelle.postOperatoire === true) {

      zone.innerHTML =
        "🌸 Les quantités de cette recette ne sont pas recalculées automatiquement. Pour les repas post-opératoires, suivez les quantités et textures indiquées par votre équipe médicale.";

      return;
    }


    /*
     * Recette classique
     */
    zone.innerHTML =
      "ℹ️ Les quantités sont calculées automatiquement à partir de la recette de base. Elles restent indicatives et peuvent être adaptées selon votre appétit.";
  }


  /* =========================================================
     SELECTEUR
  ========================================================= */

  function modeInitial() {

    const modeEnregistre =
      localStorage.getItem(
        "modePortion"
      );

    if (modeEnregistre === "famille") {
      return "famille2";
    }

    if (
      modeEnregistre === "petite" ||
      modeEnregistre === "mixte"
    ) {
      return "petite";
    }

    return "petite";
  }


  function afficherSelecteurQuantites() {

    return `
      <div class="card quantity-card">

        <h2 class="section-title">
          🍽️ Pour combien ?
        </h2>

        <p class="quantity-intro">
          Adaptez les quantités selon votre façon de cuisiner.
        </p>

        <div class="quantity-options">

          <div class="quantity-option">
            <input
              type="radio"
              id="quantitePetite"
              name="quantite"
              value="petite"
              ${modeQuantiteActuel === "petite" ? "checked" : ""}
            >

            <label for="quantitePetite">
              <span>🥄</span>
              Petite portion
            </label>
          </div>


          <div class="quantity-option">
            <input
              type="radio"
              id="quantiteFamille2"
              name="quantite"
              value="famille2"
              ${modeQuantiteActuel === "famille2" ? "checked" : ""}
            >

            <label for="quantiteFamille2">
              <span>👩‍🍳</span>
              2 personnes
            </label>
          </div>


          <div class="quantity-option">
            <input
              type="radio"
              id="quantiteFamille4"
              name="quantite"
              value="famille4"
              ${modeQuantiteActuel === "famille4" ? "checked" : ""}
            >

            <label for="quantiteFamille4">
              <span>👨‍👩‍👧‍👦</span>
              4 personnes
            </label>
          </div>

        </div>

        <div
          class="quantity-info"
          id="quantityInformation"
        ></div>

      </div>
    `;
  }


  function initialiserSelecteur() {

    document
      .querySelectorAll(
        'input[name="quantite"]'
      )
      .forEach(
        input => {

          input.addEventListener(
            "change",
            function () {

              modeQuantiteActuel =
                this.value;

              afficherIngredients();

              afficherInformationQuantites();

              mettreAJourLibellePortion();

            }
          );

        }
      );
  }


  /* =========================================================
     LIBELLE PORTION
  ========================================================= */

  function obtenirLibellePortion() {

    if (modeQuantiteActuel === "petite") {
      return "🥄 Petite portion";
    }

    if (modeQuantiteActuel === "famille2") {
      return "👩‍🍳 2 personnes";
    }

    if (modeQuantiteActuel === "famille4") {
      return "👨‍👩‍👧‍👦 4 personnes";
    }

    return recetteActuelle.portion || "";
  }


  function mettreAJourLibellePortion() {

    const element =
      document.getElementById(
        "portionBadge"
      );

    if (element) {
      element.textContent =
        obtenirLibellePortion();
    }
  }


  /* =========================================================
     FAVORIS
  ========================================================= */

  function estFavori(id) {

    let favoris = [];

    try {
      favoris =
        JSON.parse(
          localStorage.getItem(
            "favoris"
          ) || "[]"
        );
    } catch (e) {
      favoris = [];
    }

    return favoris.includes(id);
  }


  function gererFavori() {

    let favoris = [];

    try {
      favoris =
        JSON.parse(
          localStorage.getItem(
            "favoris"
          ) || "[]"
        );
    } catch (e) {
      favoris = [];
    }

    const index =
      favoris.indexOf(
        recetteActuelle.id
      );

    if (index >= 0) {

      favoris.splice(index, 1);

    } else {

      favoris.push(
        recetteActuelle.id
      );

    }

    localStorage.setItem(
      "favoris",
      JSON.stringify(favoris)
    );

    mettreAJourBoutonFavori();
  }


  function mettreAJourBoutonFavori() {

    const bouton =
      document.getElementById(
        "favoriteButton"
      );

    if (!bouton) {
      return;
    }

    if (
      estFavori(
        recetteActuelle.id
      )
    ) {

      bouton.classList.add(
        "active"
      );

      bouton.innerHTML =
        "❤️ Retirer des favoris";

    } else {

      bouton.classList.remove(
        "active"
      );

      bouton.innerHTML =
        "♡ Ajouter aux favoris";

    }
  }


  /* =========================================================
     AFFICHAGE DE LA RECETTE
  ========================================================= */

  function afficherRecette() {

    const app =
      document.getElementById(
        "app"
      );

    if (!recetteActuelle) {

      app.innerHTML = `
        <div class="empty">

          <div style="font-size:50px;">
            🍽️
          </div>

          <h2>Recette introuvable</h2>

          <p>
            Cette recette n'existe pas ou
            n'est plus disponible.
          </p>

          <a href="Recettes.html">
            Voir toutes les recettes
          </a>

        </div>
      `;

      return;
    }


    modeQuantiteActuel =
      modeInitial();


    const envies =
      Array.isArray(
        recetteActuelle.envies
      )
        ? recetteActuelle.envies
        : [];


    const enviesHTML =
      envies
        .map(
          envie =>
            `<span class="badge">${envie}</span>`
        )
        .join("");


    const textureHTML =
      recetteActuelle.texture
        ? `
          <span class="badge green">
            ${recetteActuelle.texture}
          </span>
        `
        : "";


    const batchHTML =
      recetteActuelle.batchCooking
        ? `
          <span class="badge peach">
            📦 Batch-cooking
          </span>
        `
        : "";


    const ingredientsHTML =
      recetteActuelle.ingredients
        .map(
          ingredient =>
            `<li>${ingredient}</li>`
        )
        .join("");


    const preparationHTML =
      recetteActuelle.preparation
        .map(
          (etape, index) =>
            `<li>${etape}</li>`
        )
        .join("");


    app.innerHTML = `

      <header class="hero">

        <a
          href="Recettes.html"
          class="back"
        >
          ← Retour aux recettes
        </a>

        <div class="logo">
          🍽️
        </div>

        <h1>
          ${recetteActuelle.nom}
        </h1>

        <p>
          ${recetteActuelle.categorie || ""}
        </p>

        <div class="meta">

          <span class="badge">
            ⏱️ ${recetteActuelle.temps || "—"} min
          </span>

          <span class="badge">
            💪 ${recetteActuelle.proteines || "—"} g protéines
          </span>

          <span
            class="badge green"
            id="portionBadge"
          >
            ${obtenirLibellePortion()}
          </span>

        </div>

      </header>


      <main class="content">

        <div class="card">

          <div class="meta">

            ${enviesHTML}

            ${textureHTML}

            ${batchHTML}

          </div>

        </div>


        ${afficherSelecteurQuantites()}


        <div class="card">

          <h2 class="section-title">
            🛒 Ingrédients
          </h2>

          <ul
            class="ingredient-list"
            id="ingredientsList"
          >
            ${ingredientsHTML}
          </ul>

        </div>


        <div class="card">

          <h2 class="section-title">
            👩‍🍳 Préparation
          </h2>

          <ol class="preparation-list">
            ${preparationHTML}
          </ol>

        </div>


        ${
          recetteActuelle.batchCookingDetail
            ? `
              <div class="card">

                <h2 class="section-title">
                  📦 Batch-cooking
                </h2>

                <p>
                  ${recetteActuelle.batchCookingDetail}
                </p>

                ${
                  recetteActuelle.conservation
                    ? `
                      <p>
                        <strong>
                          🧊 Conservation :
                        </strong>
                        ${recetteActuelle.conservation}
                      </p>
                    `
                    : ""
                }

                ${
                  recetteActuelle.congelation
                    ? `
                      <p>
                        <strong>
                          ❄️ Congélation :
                        </strong>
                        ${recetteActuelle.congelation}
                      </p>
                    `
                    : ""
                }

              </div>
            `
            : ""
        }


        ${
          recetteActuelle.postOperatoire
            ? `
              <div class="notice">

                </strong>

                Les textures et quantités après
                une chirurgie bariatrique doivent

                Ma Petite Assiette est un outil

            `

        <button

          class="favorite-button"
          type="button"
        >

        </button>

      </main>
    `;


    initialiserSelecteur();

    afficherIngredients();

    afficherInformationQuantites();

    mettreAJourLibellePortion();

      .getElementById(

      );
  }


  /* =========================================================
     CHARGEMENT DU CATALOGUE
  ========================================================= */

  async function chargerRecette() {

    if (!recetteId) {

      afficherRecette();

      return;
    }

    try {

      const reponse =
        await fetch(
          "../recettes.json"
        );

      if (!reponse.ok) {
        throw new Error(
          "Impossible de charger recettes.json"
        );
      }

      const recettes =
        await reponse.json();

      recetteActuelle =
        recettes.find(
          recette =>
            String(recette.id) ===
            String(recetteId)
        );

      afficherRecette();

    } catch (erreur) {

      console.error(erreur);

      document.getElementById(
        "app"
      ).innerHTML = `

        <div class="empty">

          <div style="font-size:50px;">
            ⚠️
          </div>

          <h2>
            Impossible de charger la recette
          </h2>

          <p>
            Vérifiez que le fichier
            <strong>recettes.json</strong>
            est bien présent dans le dossier
            <strong>src</strong>.
          </p>

          <a href="Recettes.html">
            Retour aux recettes
          </a>

        </div>

      `;
    }
  }


  chargerRecette();

</script>
