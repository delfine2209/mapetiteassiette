<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recette - Ma Petite Assiette</title>

  <link rel="stylesheet" href="../style.css">

  <style>
    .recette-page {
      padding-bottom: 100px;
    }

    .recette-header {
      margin-bottom: 20px;
    }

    .recette-header h1 {
      margin-bottom: 8px;
    }

    .recette-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .meta-badge {
      background: #f4f1ec;
      padding: 7px 10px;
      border-radius: 20px;
      font-size: 14px;
    }

    .recette-section {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .recette-section h2 {
      margin-top: 0;
      margin-bottom: 15px;
    }

    .ingredients-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .ingredients-list li {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .ingredients-list li:last-child {
      border-bottom: none;
    }

    .preparation-list {
      padding-left: 25px;
      margin: 0;
    }

    .preparation-list li {
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .compatibilites {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .compatibilite {
      background: #eef7ee;
      border-radius: 15px;
      padding: 7px 10px;
      font-size: 14px;
    }

    .batch-info {
      background: #fff7e8;
      border-radius: 14px;
      padding: 14px;
      margin-top: 10px;
    }

    .button-favori {
      width: 100%;
      margin-top: 10px;
    }

    .retour {
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
    }

    .erreur {
      text-align: center;
      padding: 30px 15px;
    }
  </style>
</head>

<body>

<div class="screen recette-page">

  <main id="fiche-recette">

    <div class="erreur">
      <p>Chargement de la recette...</p>
    </div>

  </main>

  <nav class="navbar">
    <a href="Accueil.html" class="nav-item">
      🏠
      <span>Accueil</span>
    </a>

    <a href="MesEnvies.html" class="nav-item">
      🔍
      <span>Envies</span>
    </a>

    <a href="Recette.html" class="nav-item active">
      🍽️
      <span>Recettes</span>
    </a>

    <a href="Favoris.html" class="nav-item">
      ⭐
      <span>Favoris</span>
    </a>

    <a href="MonProfil.html" class="nav-item">
      👤
      <span>Profil</span>
    </a>
  </nav>

</div>

<script>

async function afficherRecette() {

  const fiche = document.getElementById("fiche-recette");

  try {

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id) {
      fiche.innerHTML = `
        <div class="erreur">
          <h2>Recette introuvable</h2>
          <p>Aucune recette n'a été sélectionnée.</p>
          <a href="MesEnvies.html" class="button">
            Retour aux envies
          </a>
        </div>
      `;
      return;
    }

    const response = await fetch("../recettes.json");

    if (!response.ok) {
      throw new Error("Impossible de charger recettes.json");
    }

    const recettes = await response.json();

    const recette = recettes.find(
      r => r.id === id
    );

    if (!recette) {

      fiche.innerHTML = `
        <div class="erreur">
          <h2>Recette introuvable</h2>
          <p>La recette ${id} n'existe pas.</p>

          <a href="MesEnvies.html" class="button">
            Retour aux envies
          </a>
        </div>
      `;

      return;
    }

    // -----------------------------
    // COMPATIBILITÉS
    // -----------------------------

    let compatibilites = "";

    if (recette.petitAppetit) {
      compatibilites += `
        <span class="compatibilite">
          ✅ Petite portion
        </span>
      `;
    }

    if (recette.preOperatoire) {
      compatibilites += `
        <span class="compatibilite">
          ✅ Pré-opératoire
        </span>
      `;
    }

    if (recette.postOperatoire) {
      compatibilites += `
        <span class="compatibilite">
          ✅ Post-opératoire
        </span>
      `;
    }

    if (recette.vegetarien) {
      compatibilites += `
        <span class="compatibilite">
          🌱 Végétarien
        </span>
      `;
    }

    if (recette.vegetalien) {
      compatibilites += `
        <span class="compatibilite">
          🌱 Végétalien
        </span>
      `;
    }

    if (recette.sansGluten) {
      compatibilites += `
        <span class="compatibilite">
          🌾 Sans gluten
        </span>
      `;
    }

    if (recette.sansLactose) {
      compatibilites += `
        <span class="compatibilite">
          🥛 Sans lactose
        </span>
      `;
    }

    // -----------------------------
    // INGRÉDIENTS
    // -----------------------------

    let ingredientsHTML = "";

    if (recette.ingredients && recette.ingredients.length > 0) {

      ingredientsHTML = recette.ingredients
        .map(ingredient => `
          <li>🛒 ${ingredient}</li>
        `)
        .join("");

    } else {

      ingredientsHTML = `
        <li>Ingrédients à compléter.</li>
      `;
    }

    // -----------------------------
    // PRÉPARATION
    // -----------------------------

    let preparationHTML = "";

    if (recette.preparation && recette.preparation.length > 0) {

      preparationHTML = recette.preparation
        .map(etape => `
          <li>${etape}</li>
        `)
        .join("");

    } else {

      preparationHTML = `
        <li>Préparation à compléter.</li>
      `;
    }

    // -----------------------------
    // BATCH COOKING
    // -----------------------------

    let batchHTML = "";

    if (recette.batchCooking) {

      batchHTML = `
        <div class="batch-info">
          🥘 <strong>Batch-cooking</strong>
          <br>
          Cette recette peut être préparée à l'avance.
        </div>
      `;

    }

    // -----------------------------
    // AFFICHAGE
    // -----------------------------

    fiche.innerHTML = `

      <a href="javascript:history.back()" class="retour">
        ← Retour
      </a>

      <header class="recette-header">

        <h1>${recette.nom}</h1>

        <p>
          ${recette.categorie}
        </p>

        <div class="recette-meta">

          <span class="meta-badge">
            ⏱️ ${recette.temps} min
          </span>

          <span class="meta-badge">
            💪 ${recette.proteines} g protéines
          </span>

          <span class="meta-badge">
            🍽️ ${recette.portion || "1 portion"}
          </span>

          <span class="meta-badge">
            🥄 ${recette.texture || "Texture adaptée"}
          </span>

        </div>

      </header>


      <section class="recette-section">

        <h2>🛒 Ingrédients</h2>

        <ul class="ingredients-list">
          ${ingredientsHTML}
        </ul>

      </section>


      <section class="recette-section">

        <h2>👩‍🍳 Préparation</h2>

        <ol class="preparation-list">
          ${preparationHTML}
        </ol>

      </section>


      <section class="recette-section">

        <h2>💚 Cette recette vous correspond</h2>

        <div class="compatibilites">

          ${compatibilites || `
            <span class="compatibilite">
              ℹ️ À découvrir
            </span>
          `}

        </div>

        ${batchHTML}

      </section>


      <section class="recette-section">

        <h2>💛 Une recette qui vous plaît ?</h2>

        <button
          class="button button-main button-favori"
          onclick="ajouterFavori('${recette.id}')"
        >
          ❤️ Ajouter aux favoris
        </button>

      </section>

    `;

  }

  catch (error) {

    console.error(error);

    fiche.innerHTML = `

      <div class="erreur">

        <h2>Oups !</h2>

        <p>
          Impossible de charger cette recette.
        </p>

        <p>
          Vérifiez que le fichier
          <strong>recettes.json</strong>
          est bien présent dans le dossier
          <strong>src</strong>.
        </p>

        <a href="MesEnvies.html" class="button">
          Retour aux envies
        </a>

      </div>

    `;
  }
}


// -----------------------------
// FAVORIS
// -----------------------------

function ajouterFavori(id) {

  let favoris =
    JSON.parse(localStorage.getItem("favoris")) || [];

  if (!favoris.includes(id)) {

    favoris.push(id);

    localStorage.setItem(
      "favoris",
      JSON.stringify(favoris)
    );

    alert("Recette ajoutée aux favoris ❤️");

  } else {

    alert("Cette recette est déjà dans vos favoris ⭐");

  }
}


// -----------------------------
// LANCEMENT
// -----------------------------

document.addEventListener(
  "DOMContentLoaded",
  afficherRecette
);

</script>

</body>
</html>
