<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Recette - Ma Petite Assiette</title>

  <link rel="stylesheet" href="../style.css">

  <style>

    .recette-page {
      padding-bottom: 110px;
    }

    .recette-header {
      margin-bottom: 20px;
    }

    .recette-header h1 {
      margin-bottom: 6px;
    }

    .recette-categorie {
      margin-top: 0;
      opacity: 0.75;
    }

    /* =========================
       INFORMATIONS RAPIDES
       ========================= */

    .recette-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    .meta-badge {
      background: #f5f2ed;
      padding: 12px 10px;
      border-radius: 15px;
      text-align: center;
      font-size: 14px;
    }

    .meta-badge strong {
      display: block;
      margin-top: 4px;
      font-size: 15px;
    }

    /* =========================
       BLOCS
       ========================= */

    .recette-section {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .recette-section h2 {
      margin-top: 0;
      margin-bottom: 15px;
    }

    /* =========================
       INGREDIENTS
       ========================= */

    .ingredients-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .ingredients-list li {
      padding: 11px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .ingredients-list li:last-child {
      border-bottom: none;
    }

    /* =========================
       PREPARATION
       ========================= */

    .preparation-list {
      padding-left: 25px;
      margin: 0;
    }

    .preparation-list li {
      margin-bottom: 17px;
      line-height: 1.55;
      padding-left: 4px;
    }

    /* =========================
       COMPATIBILITES
       ========================= */

    .compatibilites {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .compatibilite {
      background: #eef7ee;
      border-radius: 15px;
      padding: 8px 11px;
      font-size: 14px;
    }

    /* =========================
       INFOS PRATIQUES
       ========================= */

    .info-box {
      border-radius: 15px;
      padding: 15px;
      margin-top: 12px;
      line-height: 1.5;
    }

    .conservation {
      background: #eef6ff;
    }

    .congelation {
      background: #f1f0ff;
    }

    .batch-info {
      background: #fff7e8;
    }

    .info-box strong {
      display: block;
      margin-bottom: 5px;
    }

    /* =========================
       FAVORIS
       ========================= */

    .button-favori {
      width: 100%;
      margin-top: 5px;
    }

    /* =========================
       RETOUR
       ========================= */

    .retour {
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
    }

    /* =========================
       ERREUR
       ========================= */

    .erreur {
      text-align: center;
      padding: 35px 15px;
    }

    /* =========================
       PETITE NOTE
       ========================= */

    .note-app {
      font-size: 13px;
      opacity: 0.7;
      line-height: 1.5;
      margin-top: 15px;
    }

  </style>

</head>


<body>

<div class="screen recette-page">

  <main id="fiche-recette">

    <div class="erreur">

      <p>
        Chargement de la recette...
      </p>

    </div>

  </main>


  <!-- =========================
       NAVIGATION
       ========================= -->

  <nav class="navbar">

    <a
      href="Accueil.html"
      class="nav-item"
    >
      🏠
      <span>Accueil</span>
    </a>


    <a
      href="MesEnvies.html"
      class="nav-item"
    >
      🔍
      <span>Envies</span>
    </a>


    <a
      href="Recettes.html"
      class="nav-item active"
    >
      🍽️
      <span>Recettes</span>
    </a>


    <a
      href="Favoris.html"
      class="nav-item"
    >
      ⭐
      <span>Favoris</span>
    </a>


    <a
      href="MonProfil.html"
      class="nav-item"
    >
      👤
      <span>Profil</span>
    </a>

  </nav>

</div>


<script>

/* =====================================================
   CHARGEMENT DE LA RECETTE
   ===================================================== */

async function afficherRecette() {

  const fiche =
    document.getElementById("fiche-recette");


  try {

    /* =========================
       RECUPERATION DE L'ID
       ========================= */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const id =
      params.get("id");


    /* =========================
       PAS D'ID
       ========================= */

    if (!id) {

      fiche.innerHTML = `

        <div class="erreur">

          <h2>
            Recette introuvable
          </h2>

          <p>
            Aucune recette n'a été sélectionnée.
          </p>

          <a
            href="Recettes.html"
            class="button"
          >
            Voir les recettes
          </a>

        </div>

      `;

      return;
    }


    /* =========================
       CHARGEMENT JSON
       ========================= */

    const response =
      await fetch("../recettes.json");


    if (!response.ok) {

      throw new Error(
        "Impossible de charger recettes.json"
      );

    }


    const recettes =
      await response.json();


    /* =========================
       RECHERCHE RECETTE
       ========================= */

    const recette =
      recettes.find(
        r => r.id === id
      );


    if (!recette) {

      fiche.innerHTML = `

        <div class="erreur">

          <h2>
            Recette introuvable
          </h2>

          <p>
            La recette
            <strong>${id}</strong>
            n'existe pas.
          </p>

          <a
            href="Recettes.html"
            class="button"
          >
            Retour aux recettes
          </a>

        </div>

      `;

      return;
    }


    /* =====================================================
       COMPATIBILITES
       ===================================================== */

    let compatibilites = "";


    if (recette.petitAppetit) {

      compatibilites += `
        <span class="compatibilite">
          ✅ Petite portion
        </span>
      `;

    }


    if (recette.preOperatoire) {

      compatibilites += `
        <span class="compatibilite">
          ✅ Pré-opératoire
        </span>
      `;

    }


    if (recette.postOperatoire) {

      compatibilites += `
        <span class="compatibilite">
          ✅ Post-opératoire
        </span>
      `;

    }


    if (recette.vegetarien) {

      compatibilites += `
        <span class="compatibilite">
          🌱 Végétarien
        </span>
      `;

    }


    if (recette.vegetalien) {

      compatibilites += `
        <span class="compatibilite">
          🌱 Végétalien
        </span>
      `;

    }


    if (recette.sansGluten) {

      compatibilites += `
        <span class="compatibilite">
          🌾 Sans gluten
        </span>
      `;

    }


    if (recette.sansLactose) {

      compatibilites += `
        <span class="compatibilite">
          🥛 Sans lactose
        </span>
      `;

    }


    /* =====================================================
       INGREDIENTS
       ===================================================== */

    let ingredientsHTML = "";


    if (
      recette.ingredients &&
      recette.ingredients.length > 0
    ) {

      ingredientsHTML =
        recette.ingredients
          .map(
            ingredient =>
              `<li>🛒 ${ingredient}</li>`
          )
          .join("");

    } else {

      ingredientsHTML = `
        <li>
          Ingrédients à compléter.
        </li>
      `;

    }


    /* =====================================================
       PREPARATION
       ===================================================== */

    let preparationHTML = "";


    if (
      recette.preparation &&
      recette.preparation.length > 0
    ) {

      preparationHTML =
        recette.preparation
          .map(
            etape =>
              `<li>${etape}</li>`
          )
          .join("");

    } else {

      preparationHTML = `
        <li>
          Préparation à compléter.
        </li>
      `;

    }


    /* =====================================================
       INFORMATIONS BATCH-COOKING
       ===================================================== */

    let batchHTML = "";


    if (recette.batchCooking) {

      batchHTML = `

        <div class="info-box batch-info">

          <strong>
            🥘 Préparer à l'avance
          </strong>

          ${
            recette.batchCookingDetail ||
            "Cette recette peut être préparée à l'avance."
          }

        </div>

      `;

    }


    /* =====================================================
       CONSERVATION
       ===================================================== */

    let conservationHTML = "";


    if (recette.conservation) {

      conservationHTML = `

        <div class="info-box conservation">

          <strong>
            🧊 Conservation
          </strong>

          ${recette.conservation}

        </div>

      `;

    }


    /* =====================================================
       CONGELATION
       ===================================================== */

    let congelationHTML = "";


    if (recette.congelation) {

      congelationHTML = `

        <div class="info-box congelation">

          <strong>
            ❄️ Congélation
          </strong>

          ${recette.congelation}

        </div>

      `;

    }


    /* =====================================================
       AFFICHAGE
       ===================================================== */

    fiche.innerHTML = `


      <a
        href="javascript:history.back()"
        class="retour"
      >
        ← Retour
      </a>


      <!-- =========================
           TITRE
           ========================= -->

      <header class="recette-header">

        <h1>
          ${recette.nom}
        </h1>


        <p class="recette-categorie">

          ${recette.categorie || ""}

        </p>


        <!-- =========================
             INFORMATIONS
             ========================= -->

        <div class="recette-meta">


          <div class="meta-badge">

            ⏱️

            <strong>
              ${
                recette.tempsPreparation ||
                recette.temps ||
                "-"
              } min
            </strong>

            préparation

          </div>


          <div class="meta-badge">

            🍳

            <strong>
              ${
                recette.tempsCuisson ||
                0
              } min
            </strong>

            cuisson

          </div>


          <div class="meta-badge">

            🍽️

            <strong>
              ${
                recette.portions ||
                recette.portion ||
                "1"
              }
            </strong>

            portion(s)

          </div>


          <div class="meta-badge">

            💪

            <strong>
              ${
                recette.proteines ||
                "-"
              } g
            </strong>

            protéines

          </div>


        </div>

      </header>


      <!-- =========================
           INGREDIENTS
           ========================= -->

      <section class="recette-section">

        <h2>
          🛒 Ingrédients
        </h2>


        <ul class="ingredients-list">

          ${ingredientsHTML}

        </ul>

      </section>


      <!-- =========================
           PREPARATION
           ========================= -->

      <section class="recette-section">

        <h2>
          👩‍🍳 Préparation
        </h2>


        <ol class="preparation-list">

          ${preparationHTML}

        </ol>

      </section>


      <!-- =========================
           COMPATIBILITES
           ========================= -->

      <section class="recette-section">

        <h2>
          💚 Cette recette vous correspond
        </h2>


        <div class="compatibilites">

          ${
            compatibilites ||
            `
              <span class="compatibilite">
                ℹ️ À découvrir
              </span>
            `
          }

        </div>


        ${batchHTML}

      </section>


      <!-- =========================
           CONSERVATION
           ========================= -->

      ${
        conservationHTML ||
        congelationHTML
          ? `

            <section class="recette-section">

              <h2>
                🧊 Bien conserver
              </h2>

              ${conservationHTML}

              ${congelationHTML}

            </section>

          `
          : ""
      }


      <!-- =========================
           FAVORIS
           ========================= -->

      <section class="recette-section">

        <h2>
          💛 Une recette qui vous plaît ?
        </h2>


        <button
          class="button button-main button-favori"
          onclick="ajouterFavori('${recette.id}')"
        >

          ❤️ Ajouter aux favoris

        </button>


        <p class="note-app">

          Vos recettes favorites seront
          retrouvées dans votre espace
          « Favoris ».

        </p>

      </section>


    `;

  }


  catch (error) {

    console.error(error);


    fiche.innerHTML = `

      <div class="erreur">

        <h2>
          Oups !
        </h2>


        <p>
          Impossible de charger cette recette.
        </p>


        <a
          href="Recettes.html"
          class="button"
        >
          Retour aux recettes
        </a>

      </div>

    `;

  }

}


/* =====================================================
   FAVORIS
   ===================================================== */

function ajouterFavori(id) {


  let favoris =
    JSON.parse(
      localStorage.getItem("favoris")
    ) || [];


  if (!favoris.includes(id)) {


    favoris.push(id);


    localStorage.setItem(
      "favoris",
      JSON.stringify(favoris)
    );


    alert(
      "Recette ajoutée aux favoris ❤️"
    );


  } else {


    alert(
      "Cette recette est déjà dans vos favoris ⭐"
    );

  }

}


/* =====================================================
   LANCEMENT
   ===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  afficherRecette
);

</script>

</body>

</html>
