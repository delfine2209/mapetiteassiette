<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mes Menus - Ma Petite Assiette</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2E73FD8V9V"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2E73FD8V9V');
  </script>
  
  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fffaf5;
      color: #3d4038;
      padding-bottom: 90px;
    }

    .hero {
      background: linear-gradient(135deg, #f7d9c4, #dce8d5);
      padding: 28px 18px 25px;
      text-align: center;
      border-radius: 0 0 28px 28px;
    }

    .hero .emoji {
      font-size: 42px;
      margin-bottom: 7px;
    }

    .hero h1 {
      color: #496044;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 15px;
      line-height: 1.5;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 18px 15px;
    }

    .section {
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }

    .section h2 {
      color: #496044;
      font-size: 19px;
      margin-bottom: 14px;
    }

    .empty {
      text-align: center;
      padding: 25px 10px;
      color: #777;
      line-height: 1.6;
    }

    .menu-card {
      border: 1px solid #e5dfd7;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 13px;
      background: #fff;
    }

    .menu-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .menu-title {
      color: #496044;
      font-weight: bold;
      font-size: 17px;
    }

    .menu-date {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .badge {
      background: #e4f1df;
      color: #52784d;
      border-radius: 20px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    .recipe-item {
      border: 1px solid #e8e1d9;
      border-radius: 15px;
      padding: 12px;
      margin-top: 9px;
      background: #faf8f4;
    }

    .recipe-item:hover {
      border-color: #9db695;
    }

    .recipe-name {
      color: #496044;
      font-weight: bold;
      line-height: 1.35;
      margin-bottom: 9px;
    }

    .recipe-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }

    .btn-recipe {
      background: #6d9565;
      color: white;
    }

    .btn-remove {
      background: #f5e3df;
      color: #a34e49;
    }

    .btn-delete {
      background: #f5e3df;
      color: #a34e49;
      margin-top: 12px;
      width: 100%;
    }

    .btn-primary {
      background: #6d9565;
      color: white;
      width: 100%;
      text-align: center;
      margin-bottom: 10px;
    }

    .btn-secondary {
      background: #f1e9df;
      color: #59604f;
      width: 100%;
      text-align: center;
      margin-bottom: 10px;
    }

    .week-day {
      border: 1px solid #e5dfd7;
      border-radius: 15px;
      padding: 13px;
      margin-bottom: 10px;
      background: #faf8f4;
    }

    .week-day h3 {
      color: #496044;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .week-meal {
      background: white;
      border-radius: 11px;
      padding: 9px 10px;
      margin-top: 6px;
      font-size: 14px;
    }

    .week-meal strong {
      color: #6d7567;
      font-size: 12px;
    }

    .info {
      background: #f7f2ec;
      border-radius: 14px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .message {
      position: fixed;
      left: 15px;
      right: 15px;
      bottom: 82px;
      z-index: 50;
      background: #52784d;
      color: white;
      padding: 14px;
      border-radius: 15px;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 5px 20px rgba(0,0,0,0.18);
    }

    .hidden {
      display: none !important;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      border-top: 1px solid #e6e0d8;
      display: flex;
      justify-content: space-around;
      padding: 9px 5px;
      z-index: 40;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #68705f;
      font-size: 11px;
      text-align: center;
    }

    .bottom-nav span {
      display: block;
      font-size: 22px;
      margin-bottom: 2px;
    }

  </style>
</head>

<body>

<header class="hero">

  <div class="emoji">📋</div>

  <h1>Mes Menus</h1>

  <p>
    Retrouvez vos menus et ouvrez chaque recette
    pour retrouver les ingrédients et la préparation.
  </p>

</header>


<main class="container">


  <!-- ACTIONS -->

  <section class="section">

    <a
      href="menu.html"
      class="btn btn-primary"
    >
      🍽️ Composer un nouveau menu
    </a>

    <a
      href="courses.html"
      class="btn btn-secondary"
    >
      🛒 Voir mes courses
    </a>

  </section>


  <!-- PLANNING SEMAINE -->

  <section class="section">

    <h2>📅 Ma semaine</h2>

    <div id="planning"></div>

  </section>


  <!-- MENUS -->

 
  <!-- MENU SELECTIONNE -->

  <section class="section">

    <h2>🍽️ Mon menu sélectionné</h2>

    <div id="menuEnCours"></div>

    <button
      class="btn btn-secondary"
      onclick="effacerMenuEnCours()"
      id="btnEffacerMenuEnCours"
      style="display:none;"
    >
      🗑️ Vider mon menu sélectionné
    </button>

  </section>


  <!-- MENUS ENREGISTRES -->

  <section class="section">

    <h2>💚 Mes menus enregistrés</h2>

    <div id="menus"></div>

  </section>


  <!-- DETAIL MENU -->

  <section
    class="section hidden"
    id="detailMenu"
  >

    <h2 id="detailTitre">
      Mon menu
    </h2>

    <div
      id="detailRecettes"
    ></div>

    <button
      class="btn btn-secondary"
      onclick="fermerDetail()"
    >
      ← Retour à mes menus
    </button>

  </section>


</main>


<div
  id="message"
  class="message hidden"
></div>


<nav class="bottom-nav">

  <a href="../../index.html">
    <span>🏠</span>
    Accueil
  </a>

  <a href="Recettes.html">
    <span>🍴</span>
    Recettes
  </a>

  <a href="MesMenus.html">
    <span>📋</span>
    Mes Menus
  </a>

  <a href="courses.html">
    <span>🛒</span>
    Mes Courses
  </a>

</nav>


<script>

  let menus = [];

  let planning = {};


  /* =====================================================
     CHARGEMENT
  ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    () => {

      chargerDonnees();

      gererHash();

    }
  );


  window.addEventListener(
    "hashchange",
    gererHash
  );


  function chargerDonnees() {

    menus =
      JSON.parse(
        localStorage.getItem(
          "menusSauvegardes"
        ) || "[]"
      );

    planning =
      JSON.parse(
        localStorage.getItem(
          "planningSemaine"
        ) || "{}"
      );

    afficherPlanning();

    afficherMenus();

  }


  /* =====================================================
     PLANNING
  ===================================================== */

  const jours = [
    ["lundi", "Lundi"],
    ["mardi", "Mardi"],
    ["mercredi", "Mercredi"],
    ["jeudi", "Jeudi"],
    ["vendredi", "Vendredi"],
    ["samedi", "Samedi"],
    ["dimanche", "Dimanche"]
  ];


  function afficherPlanning() {

    const container =
      document.getElementById(
        "planning"
      );

    const aUnPlanning =
      jours.some(
        ([cle]) =>
          planning[cle] &&
          (
            planning[cle].dejeuner ||
            planning[cle].diner
          )
      );

    if (!aUnPlanning) {

      container.innerHTML = `
        <div class="empty">
          📅 Aucun planning enregistré pour le moment.
        </div>
      `;

      return;

    }

    container.innerHTML =
      jours.map(
        ([cle, nom]) => {

          const jour =
            planning[cle] || {};

          if (
            !jour.dejeuner &&
            !jour.diner
          ) {
            return "";
          }

          return `
            <div class="week-day">

              <h3>${nom}</h3>

              ${
                jour.dejeuner
                  ? `
                    <div class="week-meal">
                      <strong>🥗 Déjeuner</strong><br>
                      <a
                        href="Recette.html?id=${encodeURIComponent(jour.dejeuner.id)}"
                        style="color:#496044;font-weight:bold;text-decoration:none;"
                      >
                        ${echapper(jour.dejeuner.nom)}
                      </a>
                    </div>
                  `
                  : ""
              }

              ${
                jour.diner
                  ? `
                    <div class="week-meal">
                      <strong>🍲 Dîner</strong><br>
                      <a
                        href="Recette.html?id=${encodeURIComponent(jour.diner.id)}"
                        style="color:#496044;font-weight:bold;text-decoration:none;"
                      >
                        ${echapper(jour.diner.nom)}
                      </a>
                    </div>
                  `
                  : ""
              }

            </div>
          `;

        }
      ).join("");

  }


  /* =====================================================
     MENUS ENREGISTRES
  ===================================================== */

  function afficherMenus() {

    const container =
      document.getElementById(
        "menus"
      );

    if (!menus.length) {

      container.innerHTML = `
        <div class="empty">

          🍽️ Vous n'avez encore aucun menu enregistré.

          <br><br>

          Composez votre première petite assiette !

        </div>
      `;

      return;

    }


    container.innerHTML =
      menus.map(
        (menu, index) => {

          const recettes =
            Array.isArray(menu.recettes)
              ? menu.recettes
              : [];

          return `

            <article
              class="menu-card"
            >

              <div class="menu-header">

                <div>

                  <div class="menu-title">
                    🍽️ ${traduireRepas(menu.repas)}
                  </div>

                  <div class="menu-date">
                    ${echapper(menu.date || "")}
                  </div>

                </div>

                <div class="badge">
                  ${recettes.length}
                  ${
                    recettes.length > 1
                      ? " recettes"
                      : " recette"
                  }
                </div>

              </div>


              ${
                menu.envies &&
                menu.envies.length
                  ? `
                    <div class="info">
                      ✨ ${menu.envies
                        .map(traduireEnvie)
                        .join(" • ")}
                    </div>
                  `
                  : ""
              }


              ${
                recettes.length
                  ? recettes.map(
                      (recette, recetteIndex) => `

                        <div
                          class="recipe-item"
                        >

                          <div class="recipe-name">
                            🍽️ ${echapper(recette.nom)}
                          </div>

                          <div class="recipe-actions">

                            <!-- VRAI LIEN VERS LA RECETTE -->
                            <a
                              class="btn btn-recipe"
                              href="Recette.html?id=${encodeURIComponent(recette.id)}"
                            >
                              👀 Voir la recette
                            </a>

                            <button
                              class="btn btn-remove"
                              onclick="retirerRecette(
                                ${index},
                                ${recetteIndex}
                              )"
                            >
                              Retirer
                            </button>

                          </div>

                        </div>

                      `
                    ).join("")
                  : `
                    <div class="empty">
                      Ce menu ne contient plus de recette.
                    </div>
                  `
              }


              ${
                recettes.length > 1
                  ? `
                    <button
                      class="btn btn-secondary"
                      onclick="voirMenuComplet(${index})"
                    >
                      📖 Voir toutes les recettes du menu
                    </button>
                  `
                  : ""
              }


              <button
                class="btn btn-delete"
                onclick="supprimerMenu(${index})"
              >
                🗑️ Supprimer ce menu
              </button>

            </article>

          `;

        }
      ).join("");

  }


  /* =====================================================
     VOIR MENU COMPLET
  ===================================================== */

  function voirMenuComplet(index) {

    window.location.hash =
      "menu=" + index;

  }


  function gererHash() {

    const hash =
      window.location.hash;

    if (
      hash.startsWith("#menu=")
    ) {

      const index =
        parseInt(
          hash.replace("#menu=", ""),
          10
        );

      if (
        Number.isInteger(index) &&
        menus[index]
      ) {

        afficherDetail(index);

      }

    } else {

      fermerDetailVisuel();

    }

  }


  function afficherDetail(index) {

    const menu =
      menus[index];

    if (!menu) return;

    document
      .getElementById("detailMenu")
      .classList.remove("hidden");

    document
      .getElementById("detailTitre")
      .textContent =
      "🍽️ " +
      traduireRepas(menu.repas);


    const container =
      document.getElementById(
        "detailRecettes"
      );


    const recettes =
      Array.isArray(menu.recettes)
        ? menu.recettes
        : [];


    container.innerHTML =
      recettes.map(
        (recette, recetteIndex) => `

          <div
            class="recipe-item"
          >

            <div class="recipe-name">
              ${recetteIndex + 1}.
              ${echapper(recette.nom)}
            </div>

            <div class="recipe-actions">

              <a
                class="btn btn-recipe"
                href="Recette.html?id=${encodeURIComponent(recette.id)}"
              >
                👀 Voir la recette et les ingrédients
              </a>

              <button
                class="btn btn-remove"
                onclick="retirerRecetteDetail(
                  ${index},
                  ${recetteIndex}
                )"
              >
                Retirer
              </button>

            </div>

          </div>

        `
      ).join("");

  }


  function fermerDetail() {

    window.location.hash = "";

  }


  function fermerDetailVisuel() {

    document
      .getElementById("detailMenu")
      .classList.add("hidden");

  }


  /* =====================================================
     RETIRER RECETTE
  ===================================================== */

  function retirerRecette(
    menuIndex,
    recetteIndex
  ) {

    if (!menus[menuIndex]) return;

    const confirmation =
      confirm(
        "Retirer cette recette de ce menu ?"
      );

    if (!confirmation) return;

    menus[menuIndex].recettes.splice(
      recetteIndex,
      1
    );

    sauvegarderMenus();

    afficherMenus();

    afficherMessage(
      "Recette retirée du menu."
    );

  }


  function retirerRecetteDetail(
    menuIndex,
    recetteIndex
  ) {

    if (!menus[menuIndex]) return;

    const confirmation =
      confirm(
        "Retirer cette recette de ce menu ?"
      );

    if (!confirmation) return;

    menus[menuIndex].recettes.splice(
      recetteIndex,
      1
    );

    sauvegarderMenus();

    if (
      menus[menuIndex].recettes.length === 0
    ) {

      window.location.hash = "";

      afficherMenus();

      return;

    }

    afficherDetail(menuIndex);

    afficherMenus();

    afficherMessage(
      "Recette retirée du menu."
    );

  }


  /* =====================================================
     SUPPRIMER MENU
  ===================================================== */

  function supprimerMenu(index) {

    if (!menus[index]) return;

    const confirmation =
      confirm(
        "Supprimer définitivement ce menu ?"
      );

    if (!confirmation) return;

    menus.splice(index, 1);

    sauvegarderMenus();

    window.location.hash = "";

    afficherMenus();

    afficherMessage(
      "Menu supprimé."
    );

  }


  function sauvegarderMenus() {

    localStorage.setItem(
      "menusSauvegardes",
      JSON.stringify(menus)
    );

  }


  /* =====================================================
     TRADUCTIONS
  ===================================================== */

  function traduireRepas(repas) {

    const correspondances = {

      "petit-dejeuner":
        "☕ Petit-déjeuner",

      "dejeuner":
        "🥗 Déjeuner",

      "diner":
        "🍲 Dîner",

      "collation":
        "🍎 Collation",

      "petite-douceur":
        "🍰 Petite douceur",

      "peu-importe":
        "✨ Mon menu"

    };

    return (
      correspondances[repas] ||
      "🍽️ Mon menu"
    );

  }


  function traduireEnvie(envie) {

    const correspondances = {

      leger: "🌿 Léger",

      complet: "🍽️ Complet",

      rapide: "⚡ Rapide",

      sucre: "🍰 Sucré",

      vegetarien: "🥕 Végétarien",

      salade: "🥗 Salade",

      proteine: "💪 Protéiné",

      reconfort: "❤️ Réconfortant"

    };

    return (
      correspondances[envie] ||
      envie
    );

  }


  /* =====================================================
     SECURITE
  ===================================================== */

  function echapper(texte) {

    return String(texte || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =====================================================
     MESSAGE
  ===================================================== */

  function afficherMessage(texte) {

    const message =
      document.getElementById(
        "message"
      );

    message.textContent = texte;

    message.classList.remove(
      "hidden"
    );

    setTimeout(() => {

      message.classList.add(
        "hidden"
      );

    }, 1800);

  }

</script>

</body>
</html>
