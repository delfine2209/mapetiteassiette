<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mes menus - Ma Petite Assiette</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2E73FD8V9V"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2E73FD8V9V');
  </script>
  
  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fffaf5;
      color: #4d4038;
      padding-bottom: 90px;
    }

    .hero {
      background:
        linear-gradient(
          135deg,
          #f6d9c8,
          #dce8d5
        );

      padding: 30px 20px;

      border-radius:
        0 0 30px 30px;
    }

    .retour {
      display: inline-block;
      color: #5b7153;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .hero p {
      line-height: 1.5;
      font-size: 15px;
    }

    .contenu {
      max-width: 700px;
      margin: auto;
      padding: 20px 16px;
    }

    .actions-haut {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .action {
      border: none;
      border-radius: 17px;
      padding: 14px 10px;
      background: #eef5e9;
      color: #506448;
      font-weight: bold;
      cursor: pointer;
    }

    .action.courses {
      background: #f8e5d9;
      color: #8b5d49;
    }

    .resume {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;

      margin-bottom: 22px;
    }

    .resume-card {
      background: white;
      border-radius: 17px;
      padding: 14px 8px;
      text-align: center;
      border: 1px solid #eadfd7;
    }

    .resume-card strong {
      display: block;
      font-size: 22px;
      color: #5f7c55;
      margin-bottom: 4px;
    }

    .resume-card span {
      font-size: 12px;
      color: #796e67;
    }

    .section {
      margin-bottom: 25px;
    }

    .section h2 {
      font-size: 20px;
      margin-bottom: 12px;
    }

    .semaine {
      display: grid;
      gap: 11px;
    }

    .jour {
      background: white;
      border-radius: 19px;
      overflow: hidden;
      border: 1px solid #e5dbd3;
    }

    .jour-titre {
      background: #eef5e9;
      padding: 12px 15px;
      font-weight: bold;
    }

    .repas {
      padding: 13px 15px;
      border-top: 1px solid #eee5de;
    }

    .repas-label {
      font-size: 13px;
      color: #7b7069;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .repas-nom {
      font-size: 15px;
      margin-bottom: 7px;
    }

    .repas-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .petit-btn {
      border: none;
      background: transparent;
      color: #5f7c55;
      font-weight: bold;
      padding: 3px 0;
      cursor: pointer;
    }

    .petit-btn.supprimer {
      color: #b45d50;
    }

    .vide {
      background: white;
      border-radius: 20px;
      padding: 28px 18px;
      text-align: center;
      border: 1px solid #e5dbd3;
    }

    .vide .emoji {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .vide p {
      line-height: 1.5;
      margin-bottom: 16px;
      color: #71665f;
    }

    .principal {
      border: none;
      background: #5f7c55;
      color: white;
      border-radius: 17px;
      padding: 13px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .menus {
      display: grid;
      gap: 11px;
    }

    .menu-sauvegarde {
      background: white;
      border: 1px solid #e5dbd3;
      border-radius: 18px;
      padding: 16px;
    }

    .menu-sauvegarde h3 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .menu-date {
      color: #81756d;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .menu-recettes {
      margin-bottom: 12px;
    }

    .menu-recettes div {
      background: #f8f3ef;
      border-radius: 11px;
      padding: 8px 10px;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .menu-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: white;
      border-top: 1px solid #e5ddd7;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    .nav a {
      text-decoration: none;
      color: #6c625c;
      font-size: 12px;
      text-align: center;
    }

    .nav a span {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    @media (max-width: 500px) {

      .actions-haut {
        grid-template-columns: 1fr;
      }

      .resume {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }

  </style>

</head>


<body>


<header class="hero">

  <a
    class="retour"
    href="../../index.html"
  >
    ← Accueil
  </a>

  <h1>📅 Mes menus</h1>

  <p>
    Retrouvez vos menus enregistrés
    et organisez votre semaine simplement.
  </p>

</header>


<main class="contenu">


  <!-- ACTIONS -->

  <div class="actions-haut">

    <button
      class="action"
      onclick="window.location.href='menu.html'"
    >
      ➕ Composer un menu
    </button>

    <button
      class="action courses"
      onclick="allerAuxCourses()"
    >
      🛒 Mes courses
    </button>

  </div>


  <!-- RESUME -->

  <div class="resume">

    <div class="resume-card">

      <strong id="nbRepas">
        0
      </strong>

      <span>
        repas prévus
      </span>

    </div>


    <div class="resume-card">

      <strong id="nbJours">
        0
      </strong>

      <span>
        jours organisés
      </span>

    </div>


    <div class="resume-card">

      <strong id="nbRecettes">
        0
      </strong>

      <span>
        recettes
      </span>

    </div>

  </div>


  <!-- SEMAINE -->

  <section class="section">

    <h2>
      📅 Ma semaine
    </h2>

    <div
      id="planning"
      class="semaine"
    ></div>

  </section>


  <!-- MENUS ENREGISTRES -->

  <section class="section">

    <h2>
      💚 Mes menus enregistrés
    </h2>

    <div
      id="menus"
      class="menus"
    ></div>

  </section>


</main>


<nav class="nav">

  <a href="../../index.html">
    <span>🏠</span>
    Accueil
  </a>

  <a href="Recettes.html">
    <span>🍽️</span>
    Recettes
  </a>

  <a href="MesMenus.html">
    <span>📅</span>
    Mes menus
  </a>

  <a href="Favoris.html">
    <span>❤️</span>
    Favoris
  </a>

</nav>


<script>


let recettes = [];

let planningSemaine = {};

let menusSauvegardes = [];

const jours = [
  "lundi",
  "mardi",
  "mercredi",
  "jeudi",
  "vendredi",
  "samedi",
  "dimanche"
];


const nomsJours = {

  lundi: "Lundi",

  mardi: "Mardi",

  mercredi: "Mercredi",

  jeudi: "Jeudi",

  vendredi: "Vendredi",

  samedi: "Samedi",

  dimanche: "Dimanche"

};


function chargerDonneesLocales() {

  try {

    planningSemaine =
      JSON.parse(
        localStorage.getItem(
          "planningSemaine"
        ) || "{}"
      );

  } catch (e) {

    planningSemaine = {};

  }


  try {

    menusSauvegardes =
      JSON.parse(
        localStorage.getItem(
          "menusSauvegardes"
        ) || "[]"
      );

  } catch (e) {

    menusSauvegardes = [];

  }

}


function recetteParId(id) {

  return recettes.find(
    recette =>
      String(recette.id) === String(id)
  );

}


function obtenirNomRecette(item) {

  if (!item) {
    return "";
  }


  if (item.nom) {
    return item.nom;
  }


  const recette =
    recetteParId(item.id);


  return recette
    ? recette.nom
    : "Recette";
}


function compterSemaine() {

  let nbRepas = 0;

  let joursOrganises = 0;

  const ids = new Set();


  jours.forEach(function(jour) {

    const donnees =
      planningSemaine[jour];


    if (!donnees) {
      return;
    }


    let jourCompte = false;


    ["dejeuner", "diner"]
      .forEach(function(moment) {

        const repas =
          donnees[moment];


        if (repas) {

          nbRepas++;

          jourCompte = true;

          if (repas.id) {
            ids.add(
              String(repas.id)
            );
          }

        }

      });


    if (jourCompte) {
      joursOrganises++;
    }

  });


  document.getElementById(
    "nbRepas"
  ).textContent = nbRepas;


  document.getElementById(
    "nbJours"
  ).textContent = joursOrganises;


  document.getElementById(
    "nbRecettes"
  ).textContent = ids.size;

}


function afficherPlanning() {

  const zone =
    document.getElementById(
      "planning"
    );


  const aUnRepas =
    jours.some(function(jour) {

      const d =
        planningSemaine[jour];


      return (
        d &&
        (
          d.dejeuner ||
          d.diner
        )
      );

    });


  if (!aUnRepas) {

    zone.innerHTML = `

      <div class="vide">

        <div class="emoji">
          🍽️
        </div>

        <p>
          Votre semaine est encore vide.
          Commencez à organiser vos repas.
        </p>

        <button
          class="principal"
          onclick="window.location.href='menu.html'"
        >
          ✨ Organiser ma semaine
        </button>

      </div>

    `;

    return;

  }


  zone.innerHTML =
    jours
      .map(function(jour) {

        const donnees =
          planningSemaine[jour] || {};


        return `

          <div class="jour">

            <div class="jour-titre">
              ${nomsJours[jour]}
            </div>


            ${afficherRepas(
              jour,
              "dejeuner",
              "🥗 Déjeuner",
              donnees.dejeuner
            )}


            ${afficherRepas(
              jour,
              "diner",
              "🍲 Dîner",
              donnees.diner
            )}

          </div>

        `;

      })
      .join("");

}


function afficherRepas(
  jour,
  moment,
  label,
  repas
) {

  if (!repas) {

    return `

      <div class="repas">

        <div class="repas-label">
          ${label}
        </div>

        <div
          style="
            color:#9a8e86;
            font-size:13px;
          "
        >
          Aucun repas prévu
        </div>

      </div>

    `;

  }


  return `

    <div class="repas">

      <div class="repas-label">
        ${label}
      </div>

      <div class="repas-nom">
        ${obtenirNomRecette(repas)}
      </div>

      <div class="repas-actions">

        ${
          repas.id
            ? `
              <button
                class="petit-btn"
                onclick="voirRecette('${repas.id}')"
              >
                Voir la recette
              </button>
            `
            : ""
        }


        <button
          class="petit-btn supprimer"
          onclick="
            retirerRepas(
              '${jour}',
              '${moment}'
            )
          "
        >
          Retirer
        </button>

      </div>

    </div>

  `;

}


function voirRecette(id) {

  window.location.href =
    "Recette.html?id=" +
    encodeURIComponent(id);

}


function retirerRepas(
  jour,
  moment
) {

  if (
    planningSemaine[jour]
  ) {

    delete planningSemaine[jour][moment];

  }


  localStorage.setItem(
    "planningSemaine",
    JSON.stringify(
      planningSemaine
    )
  );


  compterSemaine();

  afficherPlanning();

}


function afficherMenusSauvegardes() {

  const zone =
    document.getElementById(
      "menus"
    );


  if (
    !Array.isArray(
      menusSauvegardes
    ) ||
    menusSauvegardes.length === 0
  ) {

    zone.innerHTML = `

      <div class="vide">

        <div class="emoji">
          💚
        </div>

        <p>
          Vous n'avez pas encore enregistré
          de menu personnalisé.
        </p>

        <button
          class="principal"
          onclick="window.location.href='menu.html'"
        >
          ➕ Composer mon premier menu
        </button>

      </div>

    `;

    return;

  }


  zone.innerHTML =
    menusSauvegardes
      .map(function(menu, index) {

        const liste =
          Array.isArray(menu.recettes)
            ? menu.recettes
            : [];


        const noms =
          liste.map(function(item) {

            return obtenirNomRecette(
              item
            );

          });


        const repas =
          menu.repas
            ? nomRepas(menu.repas)
            : "Menu personnalisé";


        return `

          <article
            class="menu-sauvegarde"
          >

            <h3>
              🍽️ ${repas}
            </h3>


            <div class="menu-date">

              Enregistré le
              ${menu.date || "date inconnue"}

            </div>


            <div class="menu-recettes">

              ${
                noms.length > 0

                  ? noms.map(function(nom) {

                      return `
                        <div>
                          🍴 ${nom}
                        </div>
                      `;

                    }).join("")

                  : `
                    <div>
                      Aucune recette enregistrée
                    </div>
                  `
              }

            </div>


            <div class="menu-actions">

              ${
                liste.length > 0
                  ? `
                    <button
                      class="principal"
                      onclick="
                        voirPremiereRecette(
                          ${index}
                        )
                      "
                    >
                      Voir le menu
                    </button>
                  `
                  : ""
              }


              <button
                class="petit-btn supprimer"
                onclick="
                  supprimerMenu(${index})
                "
              >
                Supprimer
              </button>

            </div>

          </article>

        `;

      })
      .join("");

}


function nomRepas(valeur) {

  const correspondances = {

    "petit-dejeuner":
      "🌅 Petit-déjeuner",

    "dejeuner":
      "🥗 Déjeuner",

    "diner":
      "🍲 Dîner",

    "collation":
      "🍎 Collation",

    "petite-douceur":
      "🍰 Petite douceur",

    "peu-importe":
      "✨ Menu personnalisé"

  };


  return (
    correspondances[valeur] ||
    "🍽️ Menu personnalisé"
  );

}


function voirPremiereRecette(index) {

  const menu =
    menusSauvegardes[index];


  if (
    !menu ||
    !Array.isArray(menu.recettes) ||
    menu.recettes.length === 0
  ) {
    return;
  }


  const premiere =
    menu.recettes[0];


  if (!premiere.id) {
    return;
  }


  voirRecette(
    premiere.id
  );

}


function supprimerMenu(index) {

  const confirmation =
    confirm(
      "Supprimer ce menu enregistré ?"
    );


  if (!confirmation) {
    return;
  }


  menusSauvegardes.splice(
    index,
    1
  );


  localStorage.setItem(
    "menusSauvegardes",
    JSON.stringify(
      menusSauvegardes
    )
  );


  afficherMenusSauvegardes();

}


function allerAuxCourses() {

  const planning =
    JSON.parse(
      localStorage.getItem(
        "planningSemaine"
      ) || "{}"
    );


  const aUnRepas =
    Object.values(
      planning
    ).some(function(jour) {

      return (
        jour &&
        (
          jour.dejeuner ||
          jour.diner
        )
      );

    });


  if (!aUnRepas) {

    alert(
      "Organisez d'abord votre semaine pour préparer votre liste de courses."
    );

    return;

  }


  window.location.href =
    "courses.html";

}


/* ============================= */
/* CHARGEMENT */
/* ============================= */

fetch("../recettes.json")

  .then(function(response) {

    if (!response.ok) {

      throw new Error(
        "Impossible de charger recettes.json"
      );

    }

    return response.json();

  })

  .then(function(data) {

    recettes =
      Array.isArray(data)
        ? data
        : [];


    chargerDonneesLocales();

    compterSemaine();

    afficherPlanning();

    afficherMenusSauvegardes();

  })

  .catch(function(error) {

    console.error(error);

    chargerDonneesLocales();

    compterSemaine();

    afficherPlanning();

    afficherMenusSauvegardes();

  });


</script>

</body>

</html>
