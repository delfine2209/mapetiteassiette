  <script>

    /* =====================================================
       VARIABLES
    ===================================================== */

    let recettes = [];

    let menusSauvegardes = [];

    let planningSemaine = null;


    /* =====================================================
       JOURS
    ===================================================== */

    const jours = [
      "lundi",
      "mardi",
      "mercredi",
      "jeudi",
      "vendredi",
      "samedi",
      "dimanche"
    ];


    const nomsJours = {
      lundi: "Lundi",
      mardi: "Mardi",
      mercredi: "Mercredi",
      jeudi: "Jeudi",
      vendredi: "Vendredi",
      samedi: "Samedi",
      dimanche: "Dimanche"
    };


    /* =====================================================
       CHARGEMENT
    ===================================================== */

    async function chargerDonnees() {

      try {

        const reponse =
          await fetch("../recettes.json");

        if (!reponse.ok) {
          throw new Error("Impossible de charger recettes.json");
        }

        recettes = await reponse.json();

      } catch (erreur) {

        console.error(erreur);

        recettes = [];

      }


      chargerMenus();

      afficherTout();

    }


    /* =====================================================
       CHARGER LES MENUS
    ===================================================== */

    function chargerMenus() {

      try {

        const sauvegarde =
          localStorage.getItem("menusSauvegardes");

        menusSauvegardes =
          sauvegarde
            ? JSON.parse(sauvegarde)
            : [];

        if (!Array.isArray(menusSauvegardes)) {
          menusSauvegardes = [];
        }

      } catch (erreur) {

        console.error(erreur);

        menusSauvegardes = [];

      }


      try {

        const planning =
          localStorage.getItem("planningSemaine");

        planningSemaine =
          planning
            ? JSON.parse(planning)
            : null;

      } catch (erreur) {

        console.error(erreur);

        planningSemaine = null;

      }

    }


    /* =====================================================
       TROUVER UNE RECETTE
    ===================================================== */

    function trouverRecette(id) {

      return recettes.find(
        recette =>
          String(recette.id) === String(id)
      );

    }


    /* =====================================================
       NOM RECETTE
    ===================================================== */

    function nomRecette(id, nomParDefaut = "Recette") {

      const recette =
        trouverRecette(id);

      if (recette) {
        return recette.nom || nomParDefaut;
      }

      return nomParDefaut;

    }


    /* =====================================================
       AFFICHER TOUT
    ===================================================== */

    function afficherTout() {

      afficherSemaine();

      afficherMenusSauvegardes();

      actualiserResume();

    }


    /* =====================================================
       RESUME
    ===================================================== */

    function actualiserResume() {

      let nombreRepas = 0;

      let joursOrganises = 0;

      const idsRecettes = new Set();


      /* -----------------------------------------------------
         PLANNING SEMAINE
      ----------------------------------------------------- */

      if (planningSemaine) {

        jours.forEach(
          jour => {

            const jourPlanning =
              planningSemaine[jour];

            if (!jourPlanning) {
              return;
            }

            let jourAUnRepas = false;


            ["dejeuner", "diner"].forEach(
              moment => {

                const repas =
                  jourPlanning[moment];

                if (
                  repas &&
                  repas.id
                ) {

                  nombreRepas++;

                  jourAUnRepas = true;

                  idsRecettes.add(
                    String(repas.id)
                  );

                }

              }
            );


            if (jourAUnRepas) {
              joursOrganises++;
            }

          }
        );

      }


      /* -----------------------------------------------------
         MENUS SAUVEGARDES
      ----------------------------------------------------- */

      menusSauvegardes.forEach(
        menu => {

          if (
            !menu ||
            !Array.isArray(menu.recettes)
          ) {
            return;
          }

          menu.recettes.forEach(
            recette => {

              if (
                recette &&
                recette.id
              ) {

                idsRecettes.add(
                  String(recette.id)
                );

              }

            }
          );

        }
      );


      document.getElementById(
        "nombreRepas"
      ).textContent = nombreRepas;


      document.getElementById(
        "nombreJours"
      ).textContent = joursOrganises;


      document.getElementById(
        "nombreRecettes"
      ).textContent =
        idsRecettes.size;

    }


    /* =====================================================
       AFFICHER LA SEMAINE
    ===================================================== */

    function afficherSemaine() {

      const container =
        document.getElementById(
          "semaineContainer"
        );

      container.innerHTML = "";


      if (
        !planningSemaine ||
        typeof planningSemaine !== "object"
      ) {

        container.innerHTML = `
          <div class="empty">
            <div style="font-size:32px; margin-bottom:8px;">
              🗓️
            </div>

            <strong>
              Votre semaine n'est pas encore organisée.
            </strong>

            <br><br>

            Composez votre première semaine
            pour retrouver ici vos repas.
          </div>
        `;

        return;

      }


      let auMoinsUnRepas = false;


      jours.forEach(
        jour => {

          const jourPlanning =
            planningSemaine[jour] || {};


          const dejeuner =
            jourPlanning.dejeuner;

          const diner =
            jourPlanning.diner;


          if (
            !dejeuner &&
            !diner
          ) {
            return;
          }


          auMoinsUnRepas = true;


          const carte =
            document.createElement("div");

          carte.className = "day-card";


          let html = `
            <div class="day-title">
              ${nomsJours[jour]}
            </div>
          `;


          /* -------------------------------------------------
             DEJEUNER
          ------------------------------------------------- */

          html += `
            <div class="meal">

              <div class="meal-label">
                ☀️ Déjeuner
              </div>
          `;


          if (
            dejeuner &&
            dejeuner.id
          ) {

            html += `
              <div class="meal-name">
                ${echapperHTML(
                  nomRecette(
                    dejeuner.id,
                    dejeuner.nom || "Recette"
                  )
                )}
              </div>
            `;

          } else {

            html += `
              <div class="empty-meal">
                Pas de repas prévu
              </div>
            `;

          }


          html += `
            </div>
          `;


          /* -------------------------------------------------
             DINER
          ------------------------------------------------- */

          html += `
            <div class="meal">

              <div class="meal-label">
                🌙 Dîner
              </div>
          `;


          if (
            diner &&
            diner.id
          ) {

            html += `
              <div class="meal-name">
                ${echapperHTML(
                  nomRecette(
                    diner.id,
                    diner.nom || "Recette"
                  )
                )}
              </div>
            `;

          } else {

            html += `
              <div class="empty-meal">
                Pas de repas prévu
              </div>
            `;

          }


          html += `
            </div>
          `;


          carte.innerHTML = html;

          container.appendChild(carte);

        }
      );


      if (!auMoinsUnRepas) {

        container.innerHTML = `
          <div class="empty">
            Votre semaine est encore vide.
            <br><br>
            <a
              href="menu.html"
              class="btn btn-primary"
            >
              ➕ Organiser ma semaine
            </a>
          </div>
        `;

      }

    }


    /* =====================================================
       AFFICHER MENUS SAUVEGARDES
    ===================================================== */

    function afficherMenusSauvegardes() {

      const container =
        document.getElementById(
          "menusContainer"
        );

      container.innerHTML = "";


      if (
        !Array.isArray(menusSauvegardes) ||
        menusSauvegardes.length === 0
      ) {

        container.innerHTML = `
          <div class="empty">

            <div style="font-size:34px; margin-bottom:10px;">
              💚
            </div>

            <strong>
              Aucun menu sauvegardé pour le moment.
            </strong>

            <br><br>

            Composez votre première petite assiette
            et enregistrez-la ici.

            <br><br>

            <a
              href="menu.html"
              class="btn btn-primary"
            >
              ➕ Composer mon menu
            </a>

          </div>
        `;

        return;

      }


      menusSauvegardes.forEach(
        (menu, index) => {

          if (!menu) {
            return;
          }


          const recettesMenu =
            Array.isArray(menu.recettes)
              ? menu.recettes
              : [];


          const nombre =
            recettesMenu.length;


          const repas =
            traduireRepas(
              menu.repas
            );


          const carte =
            document.createElement("div");

          carte.className =
            "saved-menu";


          const date =
            menu.date ||
            (
              menu.timestamp
                ? new Date(
                    menu.timestamp
                  ).toLocaleDateString(
                    "fr-FR"
                  )
                : ""
            );


          carte.innerHTML = `

            <div class="saved-menu-header">

              <div class="saved-menu-title">
                🍽️
                ${echapperHTML(
                  repas
                )}
              </div>

              <div class="saved-menu-date">
                ${echapperHTML(
                  date
                )}
              </div>

            </div>


            <div class="saved-menu-info">

              ${nombre === 0
                ? "Aucune recette dans ce menu."
                : `${nombre}
                   ${nombre > 1 ? "recettes sélectionnées" : "recette sélectionnée"}.`
              }

              <br>

              ${
                Array.isArray(menu.envies) &&
                menu.envies.length > 0
                  ? `
                    <span class="recipe-count">
                      ${menu.envies
                        .map(
                          envie =>
                            echapperHTML(
                              traduireEnvie(envie)
                            )
                        )
                        .join(" · ")
                      }
                    </span>
                  `
                  : ""
              }

            </div>


            <div class="saved-menu-actions">

              <button
                type="button"
                class="btn btn-primary"
                onclick="afficherDetailMenu(${index})"
              >
                👀 Voir
                ${
                  nombre > 1
                    ? "les " + nombre + " recettes"
                    : "le menu"
                }
              </button>


              <button
                type="button"
                class="btn btn-danger"
                onclick="supprimerMenu(${index})"
              >
                🗑️ Supprimer
              </button>

            </div>

          `;


          container.appendChild(carte);

        }
      );

    }


    /* =====================================================
       AFFICHER DETAIL MENU
    ===================================================== */

    function afficherDetailMenu(index) {

      const menu =
        menusSauvegardes[index];


      if (!menu) {
        return;
      }


      /*
       * On utilise le hash.
       *
       * Cela permet au bouton "Retour" du navigateur
       * de revenir naturellement à la liste des menus,
       * sans retourner à menu.html.
       */

      location.hash =
        "menu=" + index;


      afficherDetailDepuisIndex(index);

    }


    /* =====================================================
       AFFICHER DETAIL DEPUIS INDEX
    ===================================================== */

    function afficherDetailDepuisIndex(index) {

      const menu =
        menusSauvegardes[index];


      if (!menu) {

        afficherListe();

        return;

      }


      document.getElementById(
        "listeMenus"
      ).style.display = "none";


      document.getElementById(
        "detailMenu"
      ).style.display = "block";


      const container =
        document.getElementById(
          "detailContenu"
        );


      const recettesMenu =
        Array.isArray(menu.recettes)
          ? menu.recettes
          : [];


      const repas =
        traduireRepas(
          menu.repas
        );


      const date =
        menu.date ||
        (
          menu.timestamp
            ? new Date(
                menu.timestamp
              ).toLocaleDateString(
                "fr-FR"
              )
            : ""
        );


      let html = `

        <div class="detail-header">

          <h2>
            🍽️ ${echapperHTML(repas)}
          </h2>

          <p>
            Menu enregistré le
            ${echapperHTML(date)}
          </p>

          <p style="margin-top:7px;">
            ${
              recettesMenu.length
            }
            ${
              recettesMenu.length > 1
                ? "recettes sélectionnées"
                : "recette sélectionnée"
            }
          </p>

        </div>

      `;


      /* -----------------------------------------------------
         AUCUNE RECETTE
      ----------------------------------------------------- */

      if (
        recettesMenu.length === 0
      ) {

        html += `
          <div class="empty">
            Ce menu ne contient aucune recette.
          </div>
        `;

        container.innerHTML = html;

        return;

      }


      /* -----------------------------------------------------
         TOUTES LES RECETTES
      ----------------------------------------------------- */

      recettesMenu.forEach(
        (recetteMenu, recetteIndex) => {

          if (
            !recetteMenu ||
            !recetteMenu.id
          ) {
            return;
          }


          const recette =
            trouverRecette(
              recetteMenu.id
            );


          const nom =
            recette
              ? recette.nom
              : (
                  recetteMenu.nom ||
                  "Recette introuvable"
                );


          const categorie =
            recette &&
            recette.categorie
              ? recette.categorie
              : "";


          const temps =
            recette &&
            recette.temps !== undefined &&
            recette.temps !== null
              ? recette.temps + " min"
              : "";


          const proteines =
            recette &&
            recette.proteines !== undefined &&
            recette.proteines !== null
              ? recette.proteines + " g de protéines"
              : "";


          html += `

            <div class="detail-recipe">

              <h3>
                ${echapperHTML(
                  nom
                )}
              </h3>


              <div class="recipe-meta">

                ${
                  categorie
                    ? `
                      <span class="meta">
                        ${echapperHTML(
                          categorie
                        )}
                      </span>
                    `
                    : ""
                }


                ${
                  temps
                    ? `
                      <span class="meta">
                        ⏱️
                        ${echapperHTML(
                          temps
                        )}
                      </span>
                    `
                    : ""
                }


                ${
                  proteines
                    ? `
                      <span class="meta">
                        💪
                        ${echapperHTML(
                          proteines
                        )}
                      </span>
                    `
                    : ""
                }

              </div>


              <div class="detail-recipe-actions">

                <button
                  type="button"
                  class="btn btn-primary"
                  onclick="voirRecette('${echapperAttribut(
                    recetteMenu.id
                  )}')"
                >
                  🍽️ Voir la recette
                </button>


                <button
                  type="button"
                  class="btn btn-danger"
                  onclick="retirerRecetteDuMenu(
                    ${index},
                    ${recetteIndex}
                  )"
                >
                  ✕ Retirer
                </button>

              </div>

            </div>

          `;

        }
      );


      container.innerHTML = html;

    }


    /* =====================================================
       RETIRER UNE RECETTE DU MENU
    ===================================================== */

    function retirerRecetteDuMenu(
      menuIndex,
      recetteIndex
    ) {

      const menu =
        menusSauvegardes[menuIndex];


      if (!menu) {
        return;
      }


      if (
        !Array.isArray(menu.recettes)
      ) {
        return;
      }


      if (
        recetteIndex < 0 ||
        recetteIndex >= menu.recettes.length
      ) {
        return;
      }


      const recette =
        menu.recettes[
          recetteIndex
        ];


      const nom =
        recette
          ? nomRecette(
              recette.id,
              recette.nom || "cette recette"
            )
          : "cette recette";


      const confirmer =
        confirm(
          "Retirer « " +
          nom +
          " » de ce menu ?"
        );


      if (!confirmer) {
        return;
      }


      menu.recettes.splice(
        recetteIndex,
        1
      );


      sauvegarderMenus();


      actualiserResume();


      afficherDetailDepuisIndex(
        menuIndex
      );


      afficherMessage(
        "Recette retirée du menu."
      );

    }


    /* =====================================================
       SUPPRIMER UN MENU COMPLET
    ===================================================== */

    function supprimerMenu(index) {

      const menu =
        menusSauvegardes[index];


      if (!menu) {
        return;
      }


      const confirmer =
        confirm(
          "Supprimer définitivement ce menu sauvegardé ?"
        );


      if (!confirmer) {
        return;
      }


      menusSauvegardes.splice(
        index,
        1
      );


      sauvegarderMenus();


      /*
       * Si on était dans le détail,
       * on revient à la liste.
       */

      retourListeMenus();


      afficherMessage(
        "Menu supprimé."
      );

    }


    /* =====================================================
       SAUVEGARDER LES MENUS
    ===================================================== */

    function sauvegarderMenus() {

      localStorage.setItem(
        "menusSauvegardes",
        JSON.stringify(
          menusSauvegardes
        )
      );

    }


    /* =====================================================
       VOIR UNE RECETTE
    ===================================================== */

    function voirRecette(id) {

      if (!id) {
        return;
      }


      /*
       * La recette s'ouvre depuis MesMenus.html.
       *
       * Si l'utilisateur utilise ensuite "Retour"
       * dans le navigateur, il revient ici.
       *
       * Le menu reste sauvegardé dans localStorage.
       */

      window.location.href =
        "Recette.html?id=" +
        encodeURIComponent(id);

    }


    /* =====================================================
       RETOUR LISTE
    ===================================================== */

    function retourListeMenus() {

      /*
       * On retire le hash.
       *
       * Le menu sauvegardé n'est absolument pas supprimé.
       */

      if (
        location.hash
      ) {

        history.pushState(
          "",
          document.title,
          window.location.pathname +
          window.location.search
        );

      }


      afficherListe();

    }


    /* =====================================================
       AFFICHER LISTE
    ===================================================== */

    function afficherListe() {

      document.getElementById(
        "detailMenu"
      ).style.display = "none";


      document.getElementById(
        "listeMenus"
      ).style.display = "block";


      /*
       * On recharge les données locales
       * pour être certain d'afficher la
       * dernière version du menu.
       */

      chargerMenus();

      afficherSemaine();

      afficherMenusSauvegardes();

      actualiserResume();

    }


    /* =====================================================
       HASH / BOUTON RETOUR NAVIGATEUR
    ===================================================== */

    function gererHash() {

      const hash =
        window.location.hash;


      if (
        hash.startsWith(
          "#menu="
        )
      ) {

        const index =
          parseInt(
            hash.replace(
              "#menu=",
              ""
            ),
            10
          );


        if (
          Number.isInteger(index)
        ) {

          afficherDetailDepuisIndex(
            index
          );

          return;

        }

      }


      afficherListe();

    }


    window.addEventListener(
      "hashchange",
      gererHash
    );


    /* =====================================================
       ALLER AUX COURSES
    ===================================================== */

    function allerAuxCourses() {

      let aUnRepas = false;


      if (planningSemaine) {

        jours.forEach(
          jour => {

            const planning =
              planningSemaine[jour];


            if (!planning) {
              return;
            }


            if (
              planning.dejeuner &&
              planning.dejeuner.id
            ) {
              aUnRepas = true;
            }


            if (
              planning.diner &&
              planning.diner.id
            ) {
              aUnRepas = true;
            }

          }
        );

      }


      if (!aUnRepas) {

        afficherMessage(
          "Organisez d'abord au moins un repas pour préparer vos courses."
        );

        return;

      }


      window.location.href =
        "courses.html";

    }


    /* =====================================================
       TRADUCTION REPAS
    ===================================================== */

    function traduireRepas(valeur) {

      const texte =
        String(
          valeur || ""
        ).toLowerCase();


      const correspondances = {

        "petit-dejeuner":
          "Petit-déjeuner",

        "petit_dejeuner":
          "Petit-déjeuner",

        "petit déjeuner":
          "Petit-déjeuner",

        "dejeuner":
          "Déjeuner",

        "déjeuner":
          "Déjeuner",

        "diner":
          "Dîner",

        "dîner":
          "Dîner",

        "collation":
          "Collation",

        "petite-douceur":
          "Petite douceur",

        "petite douceur":
          "Petite douceur",

        "peu-importe":
          "Repas",

        "peu importe":
          "Repas"

      };


      return correspondances[texte]
        || valeur
        || "Repas";

    }


    /* =====================================================
       TRADUCTION ENVIE
    ===================================================== */

    function traduireEnvie(valeur) {

      const texte =
        String(
          valeur || ""
        ).toLowerCase();


      const correspondances = {

        leger: "Léger",

        léger: "Léger",

        rapide: "Rapide",

        sucre: "Sucré",

        sucré: "Sucré",

        vegetarien: "Végétarien",

        végétarien: "Végétarien",

        salade: "Salade",

        reconfort: "Réconfortant",

        reconfortant: "Réconfortant",

        complet: "Complet",

        proteine: "Riche en protéines",

        "petit-appetit":
          "Petit appétit"

      };


      return correspondances[texte]
        || valeur
        || "";

    }


    /* =====================================================
       SECURITE HTML
    ===================================================== */

    function echapperHTML(valeur) {

      return String(
        valeur ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       SECURITE ATTRIBUT
    ===================================================== */

    function echapperAttribut(valeur) {

      return String(
        valeur ?? ""
      )
        .replace(
          /\\/g,
          "\\\\"
        )
        .replace(
          /'/g,
          "\\'"
        )
        .replace(
          /"/g,
          "&quot;"
        );

    }


    /* =====================================================
       MESSAGE TEMPORAIRE
    ===================================================== */

    function afficherMessage(texte) {

      const element =
        document.getElementById(
          "message"
        );


      element.textContent =
        texte;


      element.style.display =
        "block";


      clearTimeout(
        window.timerMessage
      );


      window.timerMessage =
        setTimeout(
          () => {

            element.style.display =
              "none";

          },
          2500
        );

    }


    /* =====================================================
       INITIALISATION
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        await chargerDonnees();

        gererHash();

      }
    );

  </script>
