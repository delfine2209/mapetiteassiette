<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Mes suggestions - Ma Petite Assiette</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      font-family: Arial, sans-serif;

      background: #fffaf5;

      color: #4d4038;

      padding-bottom: 85px;

    }


    /* HERO */

    .hero {

      background:
        linear-gradient(
          135deg,
          #f6d9c8,
          #dce8d5
        );

      padding: 25px 20px 30px;

      border-radius:
        0 0 30px 30px;

    }


    .retour {

      display: inline-block;

      color: #5b7153;

      text-decoration: none;

      font-weight: bold;

      margin-bottom: 18px;

    }


    .hero h1 {

      font-size: 27px;

      margin-bottom: 8px;

    }


    .hero p {

      line-height: 1.5;

      font-size: 15px;

    }


    /* CONTENU */

    .contenu {

      max-width: 700px;

      margin: auto;

      padding: 20px 16px;

    }


    /* RESUME DES CHOIX */

    .resume {

      background: white;

      border-radius: 22px;

      padding: 17px;

      box-shadow:
        0 4px 16px
        rgba(91, 70, 55, 0.08);

      margin-bottom: 20px;

    }


    .resume h2 {

      font-size: 18px;

      margin-bottom: 12px;

    }


    .choix {

      display: flex;

      flex-wrap: wrap;

      gap: 7px;

    }


    .choix span {

      background: #eef4ea;

      color: #5d7355;

      border-radius: 15px;

      padding: 7px 10px;

      font-size: 12px;

    }


    .choix span.repas {

      background: #f8e5d9;

      color: #986b54;

    }


    /* RESULTATS */

    .titre-resultats {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 13px;

    }


    .titre-resultats h2 {

      font-size: 20px;

    }


    #compteur {

      font-size: 13px;

      color: #87776d;

    }


    .liste {

      display: grid;

      gap: 14px;

    }


    /* CARTE RECETTE */

    .recette {

      background: white;

      border-radius: 22px;

      padding: 17px;

      box-shadow:
        0 4px 16px
        rgba(91, 70, 55, 0.08);

      border:
        1px solid #f0e5dd;

    }


    .haut-recette {

      display: flex;

      justify-content: space-between;

      gap: 12px;

    }


    .recette h3 {

      font-size: 18px;

      line-height: 1.3;

      margin-bottom: 7px;

    }


    .meta {

      color: #887970;

      font-size: 13px;

      line-height: 1.5;

    }


    .favori {

      width: 38px;

      height: 38px;

      min-width: 38px;

      border: none;

      border-radius: 50%;

      background: #fff3ed;

      font-size: 20px;

      cursor: pointer;

    }


    .favori.active {

      background: #f5d7c7;

    }


    .badges {

      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      margin-top: 12px;

    }


    .badge {

      background: #eef4ea;

      color: #5d7355;

      border-radius: 12px;

      padding: 5px 8px;

      font-size: 11px;

    }


    .badge.douceur {

      background: #f8e2dc;

      color: #a36562;

    }


    .badge.post {

      background: #f6e5ef;

      color: #8c6177;

    }


    .ouvrir {

      width: 100%;

      border: none;

      background: #78936d;

      color: white;

      border-radius: 15px;

      padding: 12px;

      margin-top: 14px;

      font-weight: bold;

      cursor: pointer;

    }


    /* VIDE */

    .vide {

      background: white;

      border-radius: 22px;

      padding: 25px 18px;

      text-align: center;

      box-shadow:
        0 4px 16px
        rgba(91, 70, 55, 0.06);

    }


    .vide .emoji {

      font-size: 40px;

      margin-bottom: 12px;

    }


    .vide h3 {

      margin-bottom: 8px;

    }


    .vide p {

      line-height: 1.5;

      color: #75665d;

      margin-bottom: 17px;

    }


    .bouton {

      display: inline-block;

      border: none;

      background: #78936d;

      color: white;

      text-decoration: none;

      padding: 12px 18px;

      border-radius: 15px;

      font-weight: bold;

      cursor: pointer;

    }


    /* NAVIGATION */

    .bottom-nav {

      position: fixed;

      bottom: 0;

      left: 0;

      right: 0;

      height: 72px;

      background:
        rgba(255,250,245,0.97);

      border-top:
        1px solid #eadfd7;

      display: flex;

      justify-content: space-around;

      align-items: center;

      z-index: 100;

    }


    .bottom-nav a {

      text-decoration: none;

      color: #82736a;

      font-size: 11px;

      text-align: center;

    }


    .bottom-nav a span {

      display: block;

      font-size: 22px;

      margin-bottom: 3px;

    }


    .bottom-nav a.active {

      color: #66805d;

      font-weight: bold;

    }

  </style>

</head>

<body>

  <!-- HERO -->

  <header class="hero">

```
<a
  class="retour"
  href="../../index.html"
>
  ← Accueil
</a>


<h1>
  ✨ Mes petites suggestions
</h1>


<p>
  Des idées choisies selon vos envies
  et votre façon de manger.
</p>
```

  </header>

  <main class="contenu">

```
<!-- RESUME DES CHOIX -->

<section class="resume">

  <h2>
    💚 Vos choix
  </h2>


  <div
    class="choix"
    id="resumeChoix"
  >

    <span>
      Recherche en cours...
    </span>

  </div>

</section>


<!-- RESULTATS -->

<div class="titre-resultats">

  <h2>
    Pour vous aujourd'hui
  </h2>


  <span id="compteur">
    0 recette
  </span>

</div>


<div
  id="liste"
  class="liste"
></div>
```

  </main>

  <!-- NAVIGATION -->

  <nav class="bottom-nav">

```
<a href="../../index.html">

  <span>🏠</span>

  Accueil

</a>


<a href="Recettes.html">

  <span>🍽️</span>

  Recettes

<a href="Favoris.html">

  <span>❤️</span>

  Favoris

<a
  href="MonProfil.html"

  <span>👤</span>

  Profil

  </nav>

  <script>


    /* ==================================================
       DONNEES
    ================================================== */

    let recettes = [];


    const envie =
      localStorage.getItem(
        "envie"
      ) || "";


    const temps =
      localStorage.getItem(
        "temps"
      ) || "";


    const modePortion =
      localStorage.getItem(
        "modePortion"
      ) || "";


    let preferences = [];


    try {

      preferences =
        JSON.parse(
          localStorage.getItem(
            "preferences"
          ) || "[]"
        );

    } catch (e) {

      preferences = [];

    }


    /*
      Nouveau :
      on récupère également le type
      de repas choisi sur l'accueil.
    */

    const typeRepas =
      localStorage.getItem(
        "typeRepas"
      ) || "";


    /* ==================================================
       NORMALISATION
    ================================================== */

    function normaliser(
      texte
    ) {

      return String(
        texte || ""
      )
        .toLowerCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .replace(
          /[-_]/g,
          " "
        )
        .trim();

    }


    /* ==================================================
       CORRESPONDANCE TYPE REPAS
    ================================================== */

    const correspondanceTypeRepas = {

      "petit-dejeuner":
        "Petit-déjeuner",

      "dejeuner":
        "Déjeuner",

      "diner":
        "Dîner",

      "collation":
        "Collation",

      "petite-douceur":
        "Petite douceur"

    };


    /* ==================================================
       CHARGEMENT
    ================================================== */

    fetch("../recettes.json")

      .then(function(response) {

        if (!response.ok) {

          throw new Error(
            "Impossible de charger recettes.json"
          );

        }

        return response.json();

      })

      .then(function(data) {

        recettes =
          Array.isArray(data)
            ? data
            : [];


        afficherResume();

        afficherResultats();

      })

      .catch(function(error) {

        console.error(error);


        document.getElementById(
          "liste"
        ).innerHTML = `

          <div class="vide">

            <div class="emoji">
              ⚠️
            </div>

            <h3>
              Oups...
            </h3>

            <p>
              Impossible de charger les recettes.
            </p>

          </div>

        `;

      });


    /* ==================================================
       RESUME DES CHOIX
    ================================================== */

    function afficherResume() {

      const zone =
        document.getElementById(
          "resumeChoix"
        );


      let html = "";


      /* TYPE REPAS */

      if (
        typeRepas &&
        typeRepas !==
        "peu-importe"
      ) {

        const nomRepas =
          correspondanceTypeRepas[
            typeRepas
          ] ||
          typeRepas;


        let emoji = "🍽️";


        if (
          typeRepas ===
          "petit-dejeuner"
        ) {

          emoji = "🌅";

        }


        if (
          typeRepas ===
          "dejeuner"
        ) {

          emoji = "🥗";

        }


        if (
          typeRepas ===
          "diner"
        ) {

          emoji = "🍽️";

        }


        if (
          typeRepas ===
          "collation"
        ) {

          emoji = "🍎";

        }


        if (
          typeRepas ===
          "petite-douceur"
        ) {

          emoji = "🍰";

        }


        html += `

          <span class="repas">

            ${emoji}
            ${nomRepas}

          </span>

        `;

      }


      /* ENVIE */

      if (envie) {

        const envies = {

          leger:
            "🥗 Léger",

          complet:
            "🍽️ Complet",

          rapide:
            "⚡ Rapide",

          sucre:
            "🍰 Sucré",

          reconfort:
            "💚 Réconfort",

          vegetarien:
            "🥕 Végétarien"

        };


        html += `

          <span>

            ${
              envies[envie]
              || envie
            }

          </span>

        `;

      }


      /* TEMPS */

      if (temps) {

        html += `

          <span>
            ⏱️ ${temps}
          </span>

        `;

      }


      /* MODE PORTION */

      if (
        modePortion ===
        "petite"
      ) {

        html += `

          <span>
            🥄 Petite portion
          </span>

        `;

      }


      if (
        modePortion ===
        "famille"
      ) {

        html += `

          <span>
            👨‍👩‍👧‍👦 Famille
          </span>

        `;

      }


      if (
        modePortion ===
        "mixte"
      ) {

        html += `

          <span>
            🍲 Petite portion + famille
          </span>

        `;

      }


      /* PREFERENCES */

      const labelsPreferences = {

        petite:
          "🥄 Petite assiette",

        ingredients:
          "🧺 Avec mes ingrédients",

        digeste:
          "🌿 Digeste",

        avance:
          "📦 Préparable à l'avance"

      };


      preferences.forEach(
        function(preference) {

          if (
            labelsPreferences[
              preference
            ]
          ) {

            html += `

              <span>

                ${
                  labelsPreferences[
                    preference
                  ]
                }

              </span>

            `;

          }

        }
      );


      if (!html) {

        html = `

          <span>
            ✨ Toutes les recettes
          </span>

        `;

      }


      zone.innerHTML = html;

    }


    /* ==================================================
       FILTRAGE
    ================================================== */

    function filtrerRecettes() {

      return recettes.filter(
        function(recette) {


          /* ------------------------------------------
             TYPE DE REPAS
          ------------------------------------------ */

          if (
            typeRepas &&
            typeRepas !==
            "peu-importe"
          ) {

            const categorieRecette =
              normaliser(
                recette.categorie
              );


            const categorieDemandee =
              normaliser(
                correspondanceTypeRepas[
                  typeRepas
                ] || typeRepas
              );


            if (
              categorieRecette !==
              categorieDemandee
            ) {

              return false;

            }

          }


          /* ------------------------------------------
             ENVIE
          ------------------------------------------ */

          if (envie) {

            const enviesRecette =
              Array.isArray(
                recette.envies
              )
                ? recette.envies.map(
                    normaliser
                  )
                : [];


            if (
              !enviesRecette.includes(
                normaliser(envie)
              )
            ) {

              return false;

            }

          }


          /* ------------------------------------------
             TEMPS
          ------------------------------------------ */

          if (
            temps &&
            temps !== "plus"
          ) {

            const tempsMax =
              parseInt(
                temps,
                10
              );


            const tempsRecette =
              Number(
                recette.temps || 999
              );


            if (
              tempsRecette >
              tempsMax
            ) {

              return false;

            }

          }


          /* ------------------------------------------
             MODE PETITE PORTION
          ------------------------------------------ */

          if (
            modePortion ===
              "petite" ||
            modePortion ===
              "mixte"
          ) {

            if (
              !recette.petitAppetit &&
              !recette.portion &&
              !(
                recette.quantites &&
                recette.quantites.petite
              )
            ) {

              return false;

            }

          }


          /* ------------------------------------------
             PREFERENCES
          ------------------------------------------ */

          if (
            preferences.includes(
              "petite"
            )
          ) {

            if (
              !recette.petitAppetit &&
              !recette.portion &&
              !(
                recette.quantites &&
                recette.quantites.petite
              )
            ) {

              return false;

            }

          }


          /* VEGETARIEN */

          if (
            envie ===
            "vegetarien"
          ) {

            if (
              !recette.vegetarien
            ) {

              return false;

            }

          }


          /* INGREDIENTS */

          if (
            preferences.includes(
              "ingredients"
            )
          ) {

            /*
              On vérifie simplement que
              la recette possède des
              ingrédients renseignés.
            */

            if (
              !Array.isArray(
                recette.ingredients
              ) ||
              recette.ingredients.length ===
              0
            ) {

              return false;

            }

          }


          /* DIGESTE */

          if (
            preferences.includes(
              "digeste"
            )
          ) {

            const texte =
              normaliser(

                (recette.nom || "") +
                " " +
                (recette.texture || "") +
                " " +
                (
                  recette.envies || []
                ).join(" ")

              );


            const digeste =
              recette.digeste === true ||
              texte.includes(
                "digeste"
              ) ||
              texte.includes(
                "leger"
              );


            if (!digeste) {

              return false;

            }

          }


          /* A PREPARER A L'AVANCE */

          if (
            preferences.includes(
              "avance"
            )
          ) {

            if (
              !recette.batchCooking &&
              !recette.preparationAvance
            ) {

              return false;

            }

          }


          return true;

        }
      );

    }


    /* ==================================================
       AFFICHAGE
    ================================================== */

    function afficherResultats() {

      const liste =
        document.getElementById(
          "liste"
        );


      const resultat =
        filtrerRecettes();


      document.getElementById(
        "compteur"
      ).textContent =

        resultat.length +
        (
          resultat.length > 1
            ? " recettes"
            : " recette"
        );


      if (
        resultat.length === 0
      ) {

        liste.innerHTML = `

          <div class="vide">

            <div class="emoji">
              🥄
            </div>

            <h3>
              Pas encore de recette
              exactement adaptée
            </h3>

            <p>
              Aucun résultat ne correspond
              à tous vos choix.
              Vous pouvez élargir votre recherche
              et découvrir toutes les recettes.
            </p>

            <a
              class="bouton"
              href="Recettes.html"
            >
              Voir toutes les recettes
            </a>

          </div>

        `;

        return;

      }


      liste.innerHTML =
        resultat
          .map(
            creerCarte
          )
          .join("");

    }


    /* ==================================================
       CARTE
    ================================================== */

    function creerCarte(
      recette
    ) {

      const favoris =
        JSON.parse(
          localStorage.getItem(
            "favoris"
          ) || "[]"
        );


      const estFavori =
        favoris.includes(
          recette.id
        );


      let badges = "";


      if (
        recette.petitAppetit
      ) {

        badges += `
          <span class="badge">
            🥄 Petite assiette
          </span>
        `;

      }


      if (
        recette.batchCooking
      ) {

        badges += `
          <span class="badge">
            📦 Batch-cooking
          </span>
        `;

      }


      if (
        recette.vegetarien
      ) {

        badges += `
          <span class="badge">
            🥕 Végétarien
          </span>
        `;

      }


      if (
        recette.categorie ===
        "Petite douceur"
      ) {

        badges += `
          <span class="badge douceur">
            🍰 Petite douceur
          </span>
        `;

      }


      if (
        recette.postOperatoire
      ) {

        badges += `
          <span class="badge post">
            🌸 Post-opératoire
          </span>
        `;

      }


      return `

        <article class="recette">

          <div class="haut-recette">

            <div>

              <h3>
                ${
                  recette.nom ||
                  "Recette"
                }
              </h3>


              <div class="meta">

                ${
                  recette.categorie ||
                  ""
                }


                ${
                  recette.temps
                    ? " · ⏱️ " +
                      recette.temps +
                      " min"
                    : ""
                }


                ${
                  recette.proteines
                    ? " · 💪 " +
                      recette.proteines +
                      " g protéines"
                    : ""
                }

              </div>

            </div>


            <button
              class="favori ${
                estFavori
                  ? "active"
                  : ""
              }"
              onclick="
                toggleFavori(
                  '${recette.id}',
                  event
                )
              "
            >

              ${
                estFavori
                  ? "❤️"
                  : "♡"
              }

            </button>

          </div>


          <div class="badges">

            ${badges}

          </div>


          <button
            class="ouvrir"
            onclick="
              ouvrirRecette(
                '${recette.id}'
              )
            "
          >

            Voir la recette →

          </button>

        </article>

      `;

    }


    /* ==================================================
       OUVRIR
    ================================================== */

    function ouvrirRecette(
      id
    ) {

      window.location.href =
        "Recette.html?id=" +
        encodeURIComponent(id);

    }


    /* ==================================================
       FAVORIS
    ================================================== */

    function toggleFavori(
      id,
      event
    ) {

      event.stopPropagation();


      let favoris =
        JSON.parse(
          localStorage.getItem(
            "favoris"
          ) || "[]"
        );


      if (
        favoris.includes(id)
      ) {

        favoris =
          favoris.filter(
            function(item) {

              return item !== id;

            }
          );

      } else {

        favoris.push(id);

      }


      localStorage.setItem(
        "favoris",
        JSON.stringify(
          favoris
        )
      );


      afficherResultats();

    }

  </script>

</body>

</html>
