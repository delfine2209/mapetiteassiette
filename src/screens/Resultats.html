  <script>

    /* =====================================================
       VARIABLES
    ===================================================== */

    let recettes = [];

    let enviesSelectionnees = [];

    let tempsSelectionne = "";

    let preferencesSelectionnees = [];

    let typeRepas = "";

    let recherche = "";


    /* =====================================================
       NORMALISATION GENERALE
    ===================================================== */

    function nettoyerTexte(valeur) {

      return String(valeur || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[’']/g, "")
        .replace(/[-_/]/g, " ")
        .replace(/\s+/g, " ")
        .trim();

    }


    /* =====================================================
       NORMALISATION DES ENVIES
       
       C'est ici que nous centralisons
       les différentes façons d'écrire
       une même envie.
    ===================================================== */

    function normaliserEnvie(valeur) {

      const texte =
        nettoyerTexte(valeur);


      if (!texte) {
        return "";
      }


      /* =========================
         RECONFORT
      ========================= */

      if (
        texte === "reconfort" ||
        texte === "reconfortant" ||
        texte === "reconfortante" ||
        texte === "plat reconfortant" ||
        texte === "plats reconfortants"
      ) {

        return "reconfort";

      }


      /* =========================
         SALADE
      ========================= */

      if (
        texte === "salade" ||
        texte === "salades"
      ) {

        return "salade";

      }


      /* =========================
         SUCRE
      ========================= */

      if (
        texte === "sucre" ||
        texte === "sucree" ||
        texte === "sucre" ||
        texte === "dessert" ||
        texte === "petite douceur" ||
        texte === "douceur" ||
        texte === "douceurs"
      ) {

        return "sucre";

      }


      /* =========================
         VEGETARIEN
      ========================= */

      if (
        texte === "vegetarien" ||
        texte === "vegetarienne" ||
        texte === "vegetariens" ||
        texte === "vegetariennes"
      ) {

        return "vegetarien";

      }


      /* =========================
         LEGER
      ========================= */

      if (
        texte === "leger" ||
        texte === "legere" ||
        texte === "legers" ||
        texte === "legeres" ||
        texte === "frais" ||
        texte === "fraiche" ||
        texte === "fraiches" ||
        texte === "frais et leger"
      ) {

        return "leger";

      }


      /* =========================
         RAPIDE
      ========================= */

      if (
        texte === "rapide" ||
        texte === "rapides" ||
        texte === "express"
      ) {

        return "rapide";

      }


      /* =========================
         COMPLET
      ========================= */

      if (
        texte === "complet" ||
        texte === "complete" ||
        texte === "complets" ||
        texte === "completes"
      ) {

        return "complet";

      }


      /* =========================
         PROTEINE
      ========================= */

      if (
        texte === "proteine" ||
        texte === "proteines" ||
        texte === "riche en proteines"
      ) {

        return "proteine";

      }


      /* =========================
         PETIT APPETIT
      ========================= */

      if (
        texte === "petit appetit" ||
        texte === "petite portion" ||
        texte === "petites portions"
      ) {

        return "petit-appetit";

      }


      /*
       Si aucun cas particulier,
       on conserve le terme nettoyé.
      */

      return texte;

    }


    /* =====================================================
       EXTRAIRE LES ENVIES D'UNE RECETTE
    ===================================================== */

    function obtenirEnviesRecette(recette) {

      const resultat = [];


      /*
       Champ envies
      */

      if (
        Array.isArray(recette.envies)
      ) {

        recette.envies.forEach(
          envie => {

            const valeur =
              normaliserEnvie(envie);

            if (
              valeur &&
              !resultat.includes(valeur)
            ) {

              resultat.push(valeur);

            }

          }
        );

      }


      /*
       Compatibilité si envies
       est une chaîne.
      */

      else if (
        typeof recette.envies === "string"
      ) {

        recette.envies
          .split(",")
          .forEach(
            envie => {

              const valeur =
                normaliserEnvie(envie);

              if (
                valeur &&
                !resultat.includes(valeur)
              ) {

                resultat.push(valeur);

              }

            }
          );

      }


      /*
       Le nom, la catégorie et le type
       peuvent également apporter
       une information utile.
      */

      const categorie =
        normaliserEnvie(
          recette.categorie
        );


      const type =
        normaliserEnvie(
          recette.type
        );


      const nom =
        nettoyerTexte(
          recette.nom
        );


      /*
       Végétarien
      */

      if (
        recette.vegetarien === true ||
        nettoyerTexte(
          recette.vegetarien
        ) === "true" ||
        type === "vegetarien" ||
        categorie === "vegetarien"
      ) {

        if (
          !resultat.includes(
            "vegetarien"
          )
        ) {

          resultat.push(
            "vegetarien"
          );

        }

      }


      /*
       Salade
      */

      if (
        nom.includes("salade") ||
        nettoyerTexte(
          recette.categorie
        ).includes("salade") ||
        nettoyerTexte(
          recette.type
        ).includes("salade")
      ) {

        if (
          !resultat.includes("salade")
        ) {

          resultat.push("salade");

        }

      }


      /*
       Petite douceur
      */

      if (
        nettoyerTexte(
          recette.categorie
        ).includes(
          "petite douceur"
        ) ||
        nettoyerTexte(
          recette.type
        ).includes("dessert")
      ) {

        if (
          !resultat.includes("sucre")
        ) {

          resultat.push("sucre");

        }

      }


      /*
       Réconfort
      */

      if (
        nom.includes("raclette") ||
        nom.includes("tartiflette") ||
        nom.includes("gratin") ||
        nom.includes("fajitas") ||
        nom.includes("couscous")
      ) {

        if (
          !resultat.includes(
            "reconfort"
          )
        ) {

          resultat.push(
            "reconfort"
          );

        }

      }


      return resultat;

    }


    /* =====================================================
       VERIFIER UNE ENVIE
    ===================================================== */

    function recetteCorrespondEnvie(
      recette,
      envieSelectionnee
    ) {

      const envie =
        normaliserEnvie(
          envieSelectionnee
        );


      if (!envie) {
        return true;
      }


      const enviesRecette =
        obtenirEnviesRecette(
          recette
        );


      /*
       Correspondance directe
      */

      if (
        enviesRecette.includes(envie)
      ) {

        return true;

      }


      /*
       RAPIDE
       
       Une recette de 20 minutes
       ou moins est considérée rapide.
      */

      if (
        envie === "rapide"
      ) {

        const temps =
          Number(
            recette.temps
          );


        if (
          Number.isFinite(temps) &&
          temps <= 20
        ) {

          return true;

        }

      }


      /*
       LEGER
      */

      if (
        envie === "leger"
      ) {

        const nom =
          nettoyerTexte(
            recette.nom
          );


        const envies =
          obtenirEnviesRecette(
            recette
          );


        if (
          envies.includes("leger") ||
          nom.includes("salade") ||
          nom.includes("poisson")
        ) {

          return true;

        }

      }


      /*
       PROTEINE
      */

      if (
        envie === "proteine"
      ) {

        const proteines =
          parseFloat(
            String(
              recette.proteines || ""
            ).replace(",", ".")
          );


        if (
          Number.isFinite(proteines) &&
          proteines >= 10
        ) {

          return true;

        }

      }


      /*
       PETIT APPETIT
      */

      if (
        envie === "petit-appetit"
      ) {

        if (
          recette.petitAppetit === true ||
          recette.portion ||
          recette.quantites?.petite
        ) {

          return true;

        }

      }


      return false;

    }


    /* =====================================================
       VERIFIER LA RECETTE
    ===================================================== */

    function verifierRecette(recette) {

      /*
       ==========================================
       1. RECHERCHE
       ==========================================
      */

      if (recherche) {

        const texteRecherche =
          [
            recette.nom,
            recette.categorie,
            recette.type,

            Array.isArray(
              recette.envies
            )
              ? recette.envies.join(" ")
              : recette.envies || ""
          ]
          .map(
            nettoyerTexte
          )
          .join(" ");


        if (
          !texteRecherche.includes(
            nettoyerTexte(
              recherche
            )
          )
        ) {

          return false;

        }

      }


      /*
       ==========================================
       2. TYPE DE REPAS
       ==========================================
      */

      if (
        typeRepas &&
        typeRepas !== "peu-importe"
      ) {

        const type =
          normaliserEnvie(
            typeRepas
          );


        const categorie =
          nettoyerTexte(
            recette.categorie
          );


        let correspond = false;


        if (
          type === "petit-dejeuner"
        ) {

          correspond =
            categorie.includes(
              "petit dejeuner"
            );

        }


        else if (
          type === "dejeuner"
        ) {

          correspond =
            categorie.includes(
              "dejeuner"
            );

        }


        else if (
          type === "diner"
        ) {

          correspond =
            categorie.includes(
              "diner"
            );

        }


        else if (
          type === "collation"
        ) {

          correspond =
            categorie.includes(
              "collation"
            );

        }


        else if (
          type === "petite douceur"
        ) {

          correspond =
            categorie.includes(
              "petite douceur"
            ) ||
            nettoyerTexte(
              recette.type
            ).includes(
              "dessert"
            );

        }


        else {

          correspond =
            categorie.includes(
              type
            );

        }


        if (!correspond) {

          return false;

        }

      }


      /*
       ==========================================
       3. ENVIES
       ==========================================
      */

      if (
        enviesSelectionnees.length > 0
      ) {

        /*
         Une seule envie :
         la recette doit correspondre.
        */

        if (
          enviesSelectionnees.length === 1
        ) {

          if (
            !recetteCorrespondEnvie(
              recette,
              enviesSelectionnees[0]
            )
          ) {

            return false;

          }

        }


        /*
         Plusieurs envies :
         
         On accepte une recette qui
         correspond à au moins une des
         envies sélectionnées.

         C'est plus naturel pour une recherche
         "selon mes envies".
        */

        else {

          const correspond =
            enviesSelectionnees.some(
              envie =>
                recetteCorrespondEnvie(
                  recette,
                  envie
                )
            );


          if (!correspond) {

            return false;

          }

        }

      }


      /*
       ==========================================
       4. TEMPS
       ==========================================
      */

      if (
        tempsSelectionne
      ) {

        const temps =
          Number(
            recette.temps
          );


        if (
          tempsSelectionne === "15" &&
          temps > 15
        ) {

          return false;

        }


        if (
          tempsSelectionne === "30" &&
          temps > 30
        ) {

          return false;

        }


        if (
          tempsSelectionne === "45" &&
          temps > 45
        ) {

          return false;

        }

      }


      /*
       ==========================================
       5. PREFERENCES
       ==========================================
      */

      if (
        preferencesSelectionnees.length > 0
      ) {

        for (
          const preference
          of preferencesSelectionnees
        ) {

          const pref =
            nettoyerTexte(
              preference
            );


          /*
           Végétarien
          */

          if (
            pref === "vegetarien" ||
            pref === "vegetarienne"
          ) {

            const vegetarien =
              recette.vegetarien === true ||
              nettoyerTexte(
                recette.vegetarien
              ) === "true" ||
              nettoyerTexte(
                recette.type
              ).includes(
                "vegetarien"
              );


            if (!vegetarien) {

              return false;

            }

          }


          /*
           Sans gluten
          */

          if (
            pref === "sans gluten"
          ) {

            if (
              recette.sansGluten !== true &&
              nettoyerTexte(
                recette.sansGluten
              ) !== "true"
            ) {

              return false;

            }

          }


          /*
           Sans lactose
          */

          if (
            pref === "sans lactose"
          ) {

            if (
              recette.sansLactose !== true &&
              nettoyerTexte(
                recette.sansLactose
              ) !== "true"
            ) {

              return false;

            }

          }

        }

      }


      /*
       ==========================================
       6. SI ON ARRIVE ICI :
       LA RECETTE CORRESPOND
       ==========================================
      */

      return true;

    }


    /* =====================================================
       FILTRER
    ===================================================== */

    function filtrerRecettes() {

      return recettes.filter(
        recette =>
          verifierRecette(
            recette
          )
      );

    }


    /* =====================================================
       CONTEXTE
    ===================================================== */

    function afficherContexte() {

      const element =
        document.getElementById(
          "contexte"
        );


      const aucunChoix =
        enviesSelectionnees.length === 0 &&
        !tempsSelectionne &&
        preferencesSelectionnees.length === 0 &&
        !typeRepas;


      if (aucunChoix) {

        element.innerHTML = `
          <p>
            🍽️ <strong>Toutes nos recettes sont là pour vous.</strong>
          </p>

          <p>
            Vous n'avez encore rien sélectionné.
            Parcourez librement les recettes ou
            revenez choisir une envie.
          </p>
        `;

        return;

      }


      const morceaux = [];


      if (
        typeRepas &&
        typeRepas !== "peu-importe"
      ) {

        morceaux.push(
          typeRepas
        );

      }


      if (
        enviesSelectionnees.length > 0
      ) {

        morceaux.push(
          enviesSelectionnees
            .map(
              normaliserEnvie
            )
            .join(" • ")
        );

      }


      if (tempsSelectionne) {

        morceaux.push(
          `⏱️ ${tempsSelectionne} min maximum`
        );

      }


      if (
        preferencesSelectionnees.length > 0
      ) {

        morceaux.push(
          preferencesSelectionnees.join(
            " • "
          )
        );

      }


      element.innerHTML = `
        <p>
          ✨ <strong>Votre sélection</strong>
        </p>

        <p>
          ${morceaux.join(" • ")}
        </p>
      `;

    }


    /* =====================================================
       AFFICHER LES RECETTES
    ===================================================== */

    function afficherRecettes() {

      const liste =
        document.getElementById(
          "listeRecettes"
        );


      const compteur =
        document.getElementById(
          "nombreRecettes"
        );


      const resultat =
        filtrerRecettes();


      compteur.textContent =
        resultat.length +
        (
          resultat.length > 1
            ? " recettes"
            : " recette"
        );


      if (
        resultat.length === 0
      ) {

        liste.innerHTML = `
          <div class="vide">

            <div class="emoji">
              🍽️
            </div>

            <h3>
              Aucune recette ne correspond
            </h3>

            <p>
              Essayez une autre envie ou
              retirez un critère pour découvrir
              davantage de petites assiettes.
            </p>

            <button
              class="reset"
              onclick="reinitialiser()"
            >
              Voir toutes les recettes
            </button>

          </div>
        `;

        return;

      }


      liste.innerHTML =
        resultat
          .map(
            creerCarteRecette
          )
          .join("");

    }


    /* =====================================================
       CARTE RECETTE
    ===================================================== */

    function creerCarteRecette(
      recette
    ) {

      const temps =
        recette.temps
          ? `⏱️ ${recette.temps} min`
          : "";


      const proteines =
        recette.proteines !== undefined &&
        recette.proteines !== null &&
        recette.proteines !== ""
          ? `💪 ${recette.proteines} g protéines`
          : "";


      const badges = [];


      if (
        recette.petitAppetit === true
      ) {

        badges.push(
          `<span class="badge">
            Petite portion
          </span>`
        );

      }


      if (
        recette.vegetarien === true ||
        nettoyerTexte(
          recette.type
        ).includes(
          "vegetarien"
        )
      ) {

        badges.push(
          `<span class="badge">
            🌱 Végétarien
          </span>`
        );

      }


      if (
        recette.sansGluten === true
      ) {

        badges.push(
          `<span class="badge">
            Sans gluten
          </span>`
        );

      }


      if (
        recette.batchCooking === true
      ) {

        badges.push(
          `<span class="badge">
            Batch cooking
          </span>`
        );

      }


      if (
        recette.categorie &&
        nettoyerTexte(
          recette.categorie
        ).includes(
          "petite douceur"
        )
      ) {

        badges.push(
          `<span class="badge douceur">
            🍰 Petite douceur
          </span>`
        );

      }


      if (proteines) {

        badges.push(
          `<span class="badge proteine">
            ${proteines}
          </span>`
        );

      }


      return `
        <article class="recette-card">

          <button
            class="favori"
            onclick="toggleFavori('${recette.id}')"
            aria-label="Ajouter aux favoris"
          >
            ♡
          </button>


          <h3>
            ${recette.nom || "Recette"}
          </h3>


          ${
            recette.categorie
              ? `
                <div class="categorie">
                  ${recette.categorie}
                </div>
              `
              : ""
          }


          <div class="meta">

            ${
              temps
                ? `<span>${temps}</span>`
                : ""
            }

            ${
              proteines
                ? `<span>${proteines}</span>`
                : ""
            }

          </div>


          ${
            badges.length
              ? `
                <div class="badges">
                  ${badges.join("")}
                </div>
              `
              : ""
          }


          <a
            class="ouvrir"
            href="Recette.html?id=${encodeURIComponent(
              recette.id
            )}"
          >
            Voir la recette →
          </a>

        </article>
      `;

    }


    /* =====================================================
       FAVORIS
    ===================================================== */

    function toggleFavori(id) {

      let favoris = [];


      try {

        favoris =
          JSON.parse(
            localStorage.getItem(
              "favoris"
            ) || "[]"
          );

      } catch (erreur) {

        favoris = [];

      }


      if (
        favoris.includes(id)
      ) {

        favoris =
          favoris.filter(
            favori =>
              favori !== id
          );

      } else {

        favoris.push(id);

      }


      localStorage.setItem(
        "favoris",
        JSON.stringify(
          favoris
        )
      );

    }


    /* =====================================================
       REINITIALISER
    ===================================================== */

    function reinitialiser() {

      localStorage.removeItem(
        "envies"
      );

      localStorage.removeItem(
        "envie"
      );

      localStorage.removeItem(
        "temps"
      );

      localStorage.removeItem(
        "preferences"
      );

      localStorage.removeItem(
        "typeRepas"
      );


      enviesSelectionnees = [];

      tempsSelectionne = "";

      preferencesSelectionnees = [];

      typeRepas = "";

      recherche = "";


      document.getElementById(
        "recherche"
      ).value = "";


      afficherContexte();

      afficherRecettes();

    }


    /* =====================================================
       RECHERCHE
    ===================================================== */

    document
      .getElementById(
        "recherche"
      )
      .addEventListener(
        "input",
        function () {

          recherche =
            this.value.trim();

          afficherRecettes();

        }
      );


    /* =====================================================
       RECUPERER LES DONNEES
    ===================================================== */

    function recupererDonneesUtilisateur() {

      /*
       ==========================================
       ENVIES
       ==========================================
      */

      enviesSelectionnees = [];


      const envies =
        localStorage.getItem(
          "envies"
        );


      if (envies) {

        try {

          const tableau =
            JSON.parse(
              envies
            );


          if (
            Array.isArray(
              tableau
            )
          ) {

            enviesSelectionnees =
              tableau.filter(
                Boolean
              );

          }

        } catch (erreur) {

          console.warn(
            "Erreur lecture envies",
            erreur
          );

        }

      }


      /*
       Ancien système
      */

      if (
        enviesSelectionnees.length === 0
      ) {

        const ancienneEnvie =
          localStorage.getItem(
            "envie"
          );


        if (ancienneEnvie) {

          enviesSelectionnees = [
            ancienneEnvie
          ];

        }

      }


      /*
       ==========================================
       TEMPS
       ==========================================
      */

      tempsSelectionne =
        localStorage.getItem(
          "temps"
        ) || "";


      /*
       ==========================================
       TYPE DE REPAS
       ==========================================
      */

      typeRepas =
        localStorage.getItem(
          "typeRepas"
        ) || "";


      /*
       ==========================================
       PREFERENCES
       ==========================================
      */

      preferencesSelectionnees = [];


      const preferences =
        localStorage.getItem(
          "preferences"
        );


      if (preferences) {

        try {

          const tableau =
            JSON.parse(
              preferences
            );


          if (
            Array.isArray(
              tableau
            )
          ) {

            preferencesSelectionnees =
              tableau.filter(
                Boolean
              );

          }

          else {

            preferencesSelectionnees = [
              preferences
            ];

          }

        } catch (erreur) {

          preferencesSelectionnees = [
            preferences
          ];

        }

      }

    }


    /* =====================================================
       CHARGEMENT JSON
    ===================================================== */

    fetch("../recettes.json")

      .then(
        response => {

          if (!response.ok) {

            throw new Error(
              "Erreur de chargement de recettes.json"
            );

          }


          return response.json();

        }
      )


      .then(
        data => {

          if (
            Array.isArray(data)
          ) {

            recettes = data;

          }

          else if (
            data &&
            Array.isArray(
              data.recettes
            )
          ) {

            recettes =
              data.recettes;

          }

          else {

            throw new Error(
              "Le fichier recettes.json ne contient pas de tableau de recettes."
            );

          }


          recupererDonneesUtilisateur();

          afficherContexte();

          afficherRecettes();

        }
      )


      .catch(
        erreur => {

          console.error(
            erreur
          );


          document.getElementById(
            "listeRecettes"
          ).innerHTML = `
            <div class="vide">

              <div class="emoji">
                ⚠️
              </div>

              <h3>
                Impossible de charger les recettes
              </h3>

              <p>
                Vérifiez que le fichier
                <strong>recettes.json</strong>
                est bien présent dans
                <strong>src</strong>.
              </p>

            </div>
          `;

        }
      );

  </script>

</body>

</html>
