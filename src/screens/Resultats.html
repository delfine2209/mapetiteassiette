  function verifierRecette(recette) {


    /* ==================================================
       1. TYPE DE REPAS
       
       IMPORTANT :
       Le type de repas est dans "categorie"
       et non dans "type".
    ================================================== */

    if (
      typeRepas &&
      typeRepas !== "peu-importe"
    ) {

      const categorie =
        normaliser(
          recette.categorie
        );

      const recherche =
        normaliser(
          correspondanceTypeRepas[typeRepas]
            || typeRepas
        );


      /*
        Comparaison souple.
        Exemple :
        "Petit-déjeuner"
        devient
        "petit dejeuner"
      */

      if (
        !categorie.includes(recherche) &&
        !recherche.includes(categorie)
      ) {

        return false;

      }

    }


    /* ==================================================
       2. ENVIE
       
       IMPORTANT :
       Tes recettes utilisent "envies".
       Exemple :
       "envies": ["complet","leger","rapide"]
    ================================================== */

    if (envie) {

      const enviesRecette =
        enTableau(
          recette.envies
        ).map(function(item) {

          return normaliser(item);

        });


      const envieRecherche =
        normaliser(envie);


      /*
        Cas spécial végétarien :
        on utilise directement le champ
        vegetarien de la recette.
      */

      if (
        envieRecherche ===
        "vegetarien"
      ) {

        if (
          recette.vegetarien !== true
        ) {

          return false;

        }

      } else {

        if (
          !enviesRecette.some(
            function(item) {

              return (
                item === envieRecherche ||
                item.includes(envieRecherche) ||
                envieRecherche.includes(item)
              );

            }
          )
        ) {

          return false;

        }

      }

    }


    /* ==================================================
       3. TEMPS
    ================================================== */

    if (
      temps &&
      temps !== "plus"
    ) {

      const tempsRecherche =
        parseInt(temps);


      const tempsRecette =
        parseInt(recette.temps) || 0;


      if (
        tempsRecherche &&
        tempsRecette >
          tempsRecherche
      ) {

        return false;

      }

    }


    /* ==================================================
       4. PRÉFÉRENCES
       
       On utilise les VRAIS champs de tes recettes.
    ================================================== */

    if (
      preferences.length > 0
    ) {

      for (
        let i = 0;
        i < preferences.length;
        i++
      ) {

        const pref =
          preferences[i];


        /* Petite portion */

        if (
          pref === "petite"
        ) {

          if (
            recette.petitAppetit !== true &&
            !normaliser(
              recette.portion
            ).includes("petite")
          ) {

            return false;

          }

        }


        /* Peu d'ingrédients */

        if (
          pref === "ingredients"
        ) {

          const nombreIngredients =
            Array.isArray(
              recette.ingredients
            )
              ? recette.ingredients.length
              : 0;


          /*
            Une recette avec 6 ingrédients
            ou moins est considérée comme simple.
          */

          if (
            nombreIngredients > 6
          ) {

            return false;

          }

        }


        /* Facile à digérer */

        if (
          pref === "digeste"
        ) {

          const texture =
            normaliser(
              recette.texture
            );


          const motsDigestes = [
            "tendre",
            "fondant",
            "moelleux",
            "mou",
            "lisse",
            "mixé",
            "mouline",
            "cremeux"
          ];


          /*
            Si aucune texture n'est renseignée,
            on ne bloque pas la recette.
          */

          if (
            texture &&
            !motsDigestes.some(
              function(mot) {

                return texture.includes(mot);

              }
            )
          ) {

            return false;

          }

        }


        /* Préparable à l'avance */

        if (
          pref === "avance"
        ) {

          if (
            recette.batchCooking !== true &&
            !recette.conservation &&
            !recette.batchCookingDetail
          ) {

            return false;

          }

        }

      }

    }


    /*
      Le mode de portion ne doit PAS éliminer
      une recette.

      Les quantités sont gérées dans Recette.html.
    */

    return true;

  }

  function estFavori(

  ) {

    let favoris = [];

    try {

      favoris =
        JSON.parse(
          localStorage.getItem(
            "favoris"
          ) || "[]"
        );

    } catch (e) {

      favoris = [];

    }


    return favoris.some(
      function(fav) {

        return (
          fav.id &&
          recette.id &&
          fav.id === recette.id
        );

      }
    );

  }


  function basculerFavori(
    recette
  ) {

    let favoris = [];

    try {

      favoris =
        JSON.parse(
          localStorage.getItem(
            "favoris"
          ) || "[]"
        );

    } catch (e) {

      favoris = [];

    }


    const index =
      favoris.findIndex(
        function(fav) {

          return (
            fav.id &&
            recette.id &&
            fav.id === recette.id
          );

        }
      );


    if (
      index > -1
    ) {

      favoris.splice(
        index,
        1
      );

    } else {

      favoris.push(
        recette
      );

    }


    localStorage.setItem(
      "favoris",
      JSON.stringify(
        favoris
      )
    );


    afficherResultats();

  }
