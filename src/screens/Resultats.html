<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mes suggestions - Ma Petite Assiette</title>

  <link rel="stylesheet" href="../style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f8f4ef;
      color: #3f4038;
    }

    button,
    input {
      font-family: inherit;
    }

    .page {
      max-width: 700px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 95px;
    }

    /* HERO */

    .hero {
      padding: 25px 20px 28px;
      border-radius: 0 0 32px 32px;
      background:
        linear-gradient(
          145deg,
          #f4dfd0 0%,
          #f5e9dc 45%,
          #dfe8d8 100%
        );
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #66675f;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 17px;
      background: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      margin-bottom: 16px;
    }

    .hero h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 800;
    }

    .hero p {
      margin: 9px 0 0;
      color: #686960;
      font-size: 15px;
      line-height: 1.5;
    }

    /* CONTENU */

    .content {
      padding: 20px;
    }

    .selection {
      background: white;
      border: 1px solid #eee7df;
      border-radius: 20px;
      padding: 15px 17px;
      margin-bottom: 22px;
      box-shadow: 0 5px 16px rgba(70,60,50,0.06);
    }

    .selection-label {
      font-size: 12px;
      color: #85857d;
      margin-bottom: 6px;
    }

    .selection-value {
      font-size: 17px;
      font-weight: 800;
      color: #617858;
    }

    .section-title {
      margin: 8px 0 14px;
      font-size: 21px;
      font-weight: 800;
    }

    /* CARTES RECETTES */

    .recipes {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .recipe-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: white;
      border-radius: 23px;
      padding: 18px;
      border: 1px solid #eee7df;
      box-shadow: 0 6px 18px rgba(70,60,50,0.07);
      transition: transform 0.15s ease;
    }

    .recipe-card:active {
      transform: scale(0.98);
    }

    .recipe-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .recipe-icon {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border-radius: 16px;
      background: #edf3e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .recipe-info {
      flex: 1;
    }

    .recipe-category {
      font-size: 11px;
      color: #78906e;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 5px;
    }

    .recipe-name {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 800;
      color: #3f4038;
    }

    .arrow {
      font-size: 22px;
      color: #9a9b93;
      padding-top: 4px;
    }

    .recipe-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 15px;
    }

    .meta {
      background: #f5f2ed;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 11px;
      color: #696a62;
    }

    .meta.green {
      background: #e5efe1;
      color: #5e7655;
    }

    .meta.peach {
      background: #f7e5d9;
      color: #8a6755;
    }

    /* AUCUN RESULTAT */

    .empty {
      background: white;
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      border: 1px solid #eee7df;
      box-shadow: 0 6px 18px rgba(70,60,50,0.06);
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .empty h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .empty p {
      margin: 0;
      color: #77786f;
      line-height: 1.5;
      font-size: 14px;
    }

    .empty-button {
      margin-top: 20px;
      display: inline-block;
      padding: 13px 20px;
      border-radius: 16px;
      background: #78956d;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    /* NAVIGATION */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, 100%);
      height: 72px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid #e9e2da;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 100;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #77786f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
    }

    .bottom-nav a:nth-child(2) {
      color: #6f8b65;
      font-weight: 700;
    }

    .bottom-nav .nav-icon {
      font-size: 22px;
    }
  </style>
</head>

<body>

<div class="page">

  <!-- HERO -->

  <header class="hero">

    <a href="../../index.html" class="back">
      ← Retour
    </a>

    <div class="logo">
      🍽️
    </div>

    <h1>
      Mes petites<br>
      suggestions
    </h1>

    <p>
      Des idées choisies selon vos envies
      et vos préférences.
    </p>

  </header>


  <main class="content">

    <!-- CHOIX -->

    <div class="selection">

      <div class="selection-label">
        VOTRE ENVIE
      </div>

      <div class="selection-value" id="envieTexte">
        —
      </div>

    </div>


    <h2 class="section-title" id="titreResultats">
      Voici mes suggestions
    </h2>


    <!-- RESULTATS -->

    <div id="resultats" class="recipes"></div>

  </main>

</div>


<!-- NAVIGATION -->

<nav class="bottom-nav">

  <a href="../../index.html">
    <span class="nav-icon">⌂</span>
    <span>Accueil</span>
  </a>

  <a href="Recettes.html">
    <span class="nav-icon">🍴</span>
    <span>Recettes</span>
  </a>

  <a href="Favoris.html">
    <span class="nav-icon">❤️</span>
    <span>Favoris</span>
  </a>

  <a href="MonProfil.html">
    <span class="nav-icon">👤</span>
    <span>Profil</span>
  </a>

</nav>


<script>

let toutesLesRecettes = [];


/* --------------------------------------------------
   TEXTE DES ENVIES
-------------------------------------------------- */

const nomsEnvies = {
  leger: "🥗 Léger",
  complet: "🍽️ Un plat complet",
  rapide: "⚡ Rapide",
  sucre: "🍰 Petite douceur sucrée",
  reconfort: "❤️ Réconfortant",
  vegetarien: "🌱 Végétarien"
};


/* --------------------------------------------------
   CHARGEMENT
-------------------------------------------------- */

async function chargerRecettes() {

  try {

    const response = await fetch("../recettes.json");

    if (!response.ok) {
      throw new Error("Impossible de charger les recettes");
    }

    toutesLesRecettes = await response.json();

    afficherResultats();

  } catch (error) {

    console.error(error);

    document.getElementById("resultats").innerHTML = `
      <div class="empty">
        <div class="empty-icon">😕</div>
        <h2>Oups…</h2>
        <p>
          Je n'arrive pas à charger les recettes pour le moment.
        </p>
      </div>
    `;
  }
}


/* --------------------------------------------------
   FILTRE ENVIE
-------------------------------------------------- */

function correspondAEnvie(recette, envie) {

  const envies = recette.envies || [];

  const texte = (
    (recette.nom || "") + " " +
    (recette.categorie || "") + " " +
    (recette.type || "")
  ).toLowerCase();


  if (envie === "sucre") {

    return (
      envies.includes("sucre") ||
      /dessert|douceur|pancake|porridge|compote|yaourt|mousse|cheesecake/.test(texte) ||
      recette.categorie === "collation" ||
      recette.categorie === "petit-dejeuner"
    );

  }


  if (envie === "vegetarien") {

    return recette.vegetarien === true;

  }


  if (envie === "leger") {

    return (
      envies.includes("leger") ||
      texte.includes("léger") ||
      texte.includes("legere") ||
      texte.includes("legère")
    );

  }


  if (envie === "rapide") {

    return (
      envies.includes("rapide") ||
      Number(recette.temps || 999) <= 20
    );

  }


  if (envie === "reconfort") {

    return (
      envies.includes("reconfortant") ||
      /gratin|parmentier|raclette/.test(texte)
    );

  }


  if (envie === "complet") {

    return (
      envies.includes("proteine") ||
      Number(recette.proteines || 0) >= 15
    );

  }


  return true;
}


/* --------------------------------------------------
   AFFICHAGE
-------------------------------------------------- */

function afficherResultats() {

  const envie = localStorage.getItem("envie") || "";

  const temps = localStorage.getItem("temps") || "plus";

  let preferences = [];

  try {
    preferences =
      JSON.parse(
        localStorage.getItem("preferences") || "[]"
      );
  } catch {
    preferences = [];
  }


  document.getElementById("envieTexte").textContent =
    nomsEnvies[envie] || "Selon mes envies";


  let recettes = toutesLesRecettes.filter(
    recette => correspondAEnvie(recette, envie)
  );


  /* TEMPS */

  if (temps !== "plus") {

    const maximum = Number(temps);

    recettes = recettes.filter(
      recette =>
        Number(recette.temps || 999) <= maximum
    );
  }


  /* PREFERENCES */

  if (preferences.includes("petite")) {

    recettes = recettes.filter(
      recette => recette.petitAppetit === true
    );
  }


  if (preferences.includes("ingredients")) {

    recettes = recettes.filter(
      recette =>
        Array.isArray(recette.ingredients) &&
        recette.ingredients.length <= 7
    );
  }


  if (preferences.includes("digeste")) {

    recettes = recettes.filter(recette => {

      const texture =
        (recette.texture || "").toLowerCase();

      return (
        texture.includes("fondant") ||
        texture.includes("mou") ||
        texture.includes("tendre") ||
        texture.includes("mix")
      );
    });
  }


  if (preferences.includes("avance")) {

    recettes = recettes.filter(
      recette => recette.batchCooking === true
    );
  }


  /* PRIORITE AUX RECETTES SUCREES */

  if (envie === "sucre") {

    recettes.sort((a, b) => {

      function scoreSucre(recette) {

        let score = 0;

        const envies = recette.envies || [];

        const texte = (
          recette.nom || ""
        ).toLowerCase();

        if (envies.includes("sucre")) score += 10;

        if (
          /dessert|douceur|pancake|porridge|compote|yaourt|mousse|cheesecake/
            .test(texte)
        ) {
          score += 5;
        }

        if (
          recette.categorie === "collation" ||
          recette.categorie === "petit-dejeuner"
        ) {
          score += 4;
        }

        return score;
      }

      return scoreSucre(b) - scoreSucre(a);

    });
  }


  afficherCartes(recettes, envie);
}


/* --------------------------------------------------
   CARTES
-------------------------------------------------- */

function afficherCartes(recettes, envie) {

  const container =
    document.getElementById("resultats");

  const titre =
    document.getElementById("titreResultats");


  if (recettes.length === 0) {

    titre.textContent =
      "Aucune suggestion exacte";


    container.innerHTML = `
      <div class="empty">

        <div class="empty-icon">🥣</div>

        <h2>
          On adapte la recherche ?
        </h2>

        <p>
          Je n'ai pas trouvé de recette correspondant
          exactement à tous vos critères.
        </p>

        <a
          href="MesEnvies.html"
          class="empty-button"
        >
          Modifier mes envies
        </a>

      </div>
    `;

    return;
  }


  titre.textContent =
    recettes.length === 1
      ? "1 petite assiette pour vous"
      : `${recettes.length} petites assiettes pour vous`;


  container.innerHTML = "";


  recettes.forEach(recette => {

    const carte =
      document.createElement("a");

    carte.className = "recipe-card";

    carte.href =
      `Recette.html?id=${encodeURIComponent(recette.id)}`;


    let icon = "🍽️";

    const categorie =
      (recette.categorie || "").toLowerCase();


    if (
      categorie.includes("dessert") ||
      categorie.includes("collation") ||
      categorie.includes("petit")
    ) {
      icon = "🍰";
    } else if (
      recette.vegetarien === true
    ) {
      icon = "🌱";
    } else if (
      categorie.includes("salade")
    ) {
      icon = "🥗";
    } else if (
      categorie.includes("poisson")
    ) {
      icon = "🐟";
    }


    carte.innerHTML = `

      <div class="recipe-top">

        <div class="recipe-icon">
          ${icon}
        </div>

        <div class="recipe-info">

          <div class="recipe-category">
            ${recette.categorie || "Recette"}
          </div>

          <h3 class="recipe-name">
            ${recette.nom}
          </h3>

        </div>

        <div class="arrow">
          ›
        </div>

      </div>


      <div class="recipe-meta">

        <span class="meta">
          ⏱️ ${recette.temps || "—"} min
        </span>

        <span class="meta green">
          🥄 ${recette.portion || "Petite portion"}
        </span>

        ${
          recette.proteines
            ? `<span class="meta peach">
                 💪 ${recette.proteines} g protéines
               </span>`
            : ""
        }

      </div>

    `;


    container.appendChild(carte);

  });

}


chargerRecettes();

</script>

</body>
</html>
