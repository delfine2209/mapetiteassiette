  <script>


    /* ==================================================
       DONNEES
    ================================================== */

    let recettes = [];


    /*
      NOUVEAU SYSTEME :
      plusieurs envies peuvent maintenant
      être enregistrées.
    */

    let enviesSelectionnees = [];

    try {

      enviesSelectionnees =
        JSON.parse(
          localStorage.getItem("envies") || "[]"
        );

      if (
        !Array.isArray(enviesSelectionnees)
      ) {

        enviesSelectionnees = [];

      }

    } catch (e) {

      enviesSelectionnees = [];

    }


    /*
      Compatibilité avec l'ancien système.
    */

    if (
      enviesSelectionnees.length === 0
    ) {

      const ancienneEnvie =
        localStorage.getItem("envie") || "";

      if (ancienneEnvie) {

        enviesSelectionnees = [
          ancienneEnvie
        ];

      }

    }



    const temps =
      localStorage.getItem(
        "temps"
      ) || "";



    const modePortion =
      localStorage.getItem(
        "modePortion"
      ) || "";



    let preferences = [];

    try {

      preferences =
        JSON.parse(
          localStorage.getItem(
            "preferences"
          ) || "[]"
        );

      if (
        !Array.isArray(preferences)
      ) {

        preferences = [];

      }

    } catch (e) {

      preferences = [];

    }



    /*
      Type de repas choisi sur l'écran
      "Quel repas ?"
    */

    let typeRepas =
      localStorage.getItem(
        "typeRepas"
      ) || "";



    /* ==================================================
       NORMALISATION
    ================================================== */

    function normaliser(
      texte
    ) {

      return String(
        texte || ""
      )
        .toLowerCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .replace(
          /[-_]/g,
          " "
        )
        .replace(
          /\s+/g,
          " "
        )
        .trim();

    }



    /* ==================================================
       NOMS DES TYPES DE REPAS
    ================================================== */

    const correspondanceTypeRepas = {

      "petit-dejeuner":
        "Petit-déjeuner",

      "dejeuner":
        "Déjeuner",

      "diner":
        "Dîner",

      "collation":
        "Collation",

      "petite-douceur":
        "Petite douceur",

      "salade":
        "Salades",

      "salades":
        "Salades"

    };



    /* ==================================================
       ALIAS POUR LES TYPES
    ================================================== */

    const aliasTypes = {

      "salade": [
        "salade"
      ],

      "salades": [
        "salade"
      ],

      "petit-dejeuner": [
        "petit dejeuner",
        "petit dejeuner"
      ],

      "dejeuner": [
        "dejeuner"
      ],

      "diner": [
        "diner"
      ],

      "collation": [
        "collation"
      ],

      "petite-douceur": [
        "petite douceur",
        "douceur"
      ]

    };



    /* ==================================================
       VERIFICATION DU TYPE DE REPAS
    ================================================== */

    function correspondAuTypeRepas(
      recette
    ) {

      if (
        !typeRepas ||
        typeRepas === "peu-importe" ||
        typeRepas === "peu importe"
      ) {

        return true;

      }


      const typeChoisi =
        normaliser(
          typeRepas
        );


      /*
        CAS SPECIAL : SALADES

        Une salade peut avoir :
        categorie = Salade complète

        mais type =
        poisson / végétarien / etc.

        On regarde donc les trois champs.
      */

      if (
        typeChoisi === "salade" ||
        typeChoisi === "salades"
      ) {

        const nom =
          normaliser(
            recette.nom
          );

        const categorie =
          normaliser(
            recette.categorie
          );

        const type =
          normaliser(
            recette.type
          );


        return (
          nom.includes("salade") ||
          categorie.includes("salade") ||
          type.includes("salade")
        );

      }



      /*
        Petit-déjeuner
      */

      if (
        typeChoisi ===
        "petit dejeuner"
      ) {

        const nom =
          normaliser(
            recette.nom
          );

        const categorie =
          normaliser(
            recette.categorie
          );

        const type =
          normaliser(
            recette.type
          );


        return (
          categorie.includes(
            "petit dejeuner"
          ) ||
          type.includes(
            "petit dejeuner"
          ) ||
          nom.includes(
            "petit dejeuner"
          )
        );

      }



      /*
        Collation
      */

      if (
        typeChoisi ===
        "collation"
      ) {

        const categorie =
          normaliser(
            recette.categorie
          );

        const type =
          normaliser(
            recette.type
          );


        return (
          categorie.includes(
            "collation"
          ) ||
          type.includes(
            "collation"
          )
        );

      }



      /*
        Petite douceur
      */

      if (
        typeChoisi ===
        "petite douceur"
      ) {

        const nom =
          normaliser(
            recette.nom
          );

        const categorie =
          normaliser(
            recette.categorie
          );

        const type =
          normaliser(
            recette.type
          );


        return (
          categorie.includes(
            "petite douceur"
          ) ||
          type.includes(
            "petite douceur"
          ) ||
          nom.includes(
            "gateau"
          ) ||
          nom.includes(
            "muffin"
          )
        );

      }



      /*
        Autres types :
        on regarde type + catégorie.
      */

      const typeRecette =
        normaliser(
          recette.type
        );

      const categorieRecette =
        normaliser(
          recette.categorie
        );


      return (
        typeRecette.includes(
          typeChoisi
        ) ||
        typeChoisi.includes(
          typeRecette
        ) ||
        categorieRecette.includes(
          typeChoisi
        ) ||
        typeChoisi.includes(
          categorieRecette
        )
      );

    }



    /* ==================================================
       VERIFICATION D'UNE ENVIE
    ================================================== */

   function correspondAUneEnvie(
  recette,
  envie
) {

  const enviesRecette =
    Array.isArray(recette.envies)
      ? recette.envies.map(item =>
          normaliser(item)
        )
      : [];

  const envieNorm =
    normaliser(envie);

  const correspondances = {

    leger: [
      "leger",
      "light",
      "léger"
    ],

    reconfort: [
      "reconfort",
      "reconfortant"
    ],

    sucre: [
      "sucre",
      "gourmand"
    ],

    vegetarien: [
      "vegetarien"
    ],

    rapide: [
      "rapide"
    ],

    complet: [
      "complet",
      "equilibre",
      "equilibré"
    ]

  };

  const equivalents =
    correspondances[envieNorm] ||
    [envieNorm];

  return equivalents.some(
    valeur =>
      enviesRecette.includes(valeur)
  );

}


      /*
        Réconfort :
        le JSON peut contenir
        "reconfort" OU
        "reconfortant".
      */

      if (
        envieNorm ===
        "reconfort"
      ) {

        return (
          enviesRecette.includes(
            "reconfort"
          ) ||
          enviesRecette.includes(
            "reconfortant"
          )
        );

      }



      /*
        Sucré
      */

      if (
        envieNorm ===
        "sucre"
      ) {

        return (
          enviesRecette.includes(
            "sucre"
          ) ||
          enviesRecette.includes(
            "sucre"
          )
        );

      }



      /*
        Toutes les autres envies.
      */

      return enviesRecette.includes(
        envieNorm
      );

    }



    /* ==================================================
       VERIFICATION COMPLETE
    ================================================== */

    function verifierRecette(
      recette
    ) {


      /*
        TYPE REPAS
      */

      if (
        !correspondAuTypeRepas(
          recette
        )
      ) {

        return false;

      }



      /*
        ENVIES MULTIPLES

        On utilise ici un fonctionnement
        "ET".

        Exemple :
        Léger + Végétarien

        => la recette doit être
        à la fois légère ET végétarienne.
      */

      if (
        enviesSelectionnees.length > 0
      ) {

        const toutesLesEnvies =
          enviesSelectionnees.every(
            function(envie) {

              return correspondAUneEnvie(
                recette,
                envie
              );

            }
          );


        if (
          !toutesLesEnvies
        ) {

          return false;

        }

      }



      /*
        TEMPS
      */

      if (
        temps
      ) {

        const tempsRecette =
          Number(
            recette.temps
          ) || 999;


        if (
          temps === "10" &&
          tempsRecette > 10
        ) {

          return false;

        }


        if (
          temps === "20" &&
          tempsRecette > 20
        ) {

          return false;

        }


        if (
          temps === "30" &&
          tempsRecette > 30
        ) {

          return false;

        }


        if (
          temps === "plus" &&
          tempsRecette <= 30
        ) {

          return false;

        }

      }



      /*
        PETITE PORTION
      */

      if (
        preferences.includes(
          "petite"
        )
      ) {

        if (
          recette.petitAppetit !== true &&
          recette.portion !== "Petite portion"
        ) {

          return false;

        }

      }



      /*
        PEU D'INGREDIENTS
      */

      if (
        preferences.includes(
          "ingredients"
        )
      ) {

        const nombreIngredients =
          Array.isArray(
            recette.ingredients
          )
            ? recette.ingredients.length
            : 99;


        if (
          nombreIngredients > 7
        ) {

          return false;

        }

      }



      /*
        FACILE A DIGERER

        On utilise principalement
        les informations déjà présentes
        dans le JSON.
      */

      if (
        preferences.includes(
          "digeste"
        )
      ) {

        const texture =
          normaliser(
            recette.texture
          );

        const categorie =
          normaliser(
            recette.categorie
          );


        const texteDigeste =
          texture +
          " " +
          categorie;


        if (
          texteDigeste.includes(
            "mouline"
          ) === false &&
          texteDigeste.includes(
            "mixee"
          ) === false &&
          texteDigeste.includes(
            "tendre"
          ) === false &&
          recette.postOperatoire !== true
        ) {

          return false;

        }

      }



      /*
        PREPARABLE A L'AVANCE
      */

      if (
        preferences.includes(
          "avance"
        )
      ) {

        if (
          recette.batchCooking !== true
        ) {

          return false;

        }

      }



      return true;

    }



    /* ==================================================
       RESUME DES CHOIX
    ================================================== */

    function afficherResume() {

      const zone =
        document.getElementById(
          "resumeChoix"
        );


      let html = "";



      /*
        TYPE REPAS
      */

      if (
        typeRepas &&
        typeRepas !== "peu-importe"
      ) {

        const nomRepas =
          correspondanceTypeRepas[
            typeRepas
          ] ||
          typeRepas;


        html +=
          "<span>🍽️ " +
          nomRepas +
          "</span>";

      }



      /*
        ENVIES
      */

      const noms = {

        leger: "🥗 Léger",

        complet: "🍽️ Complet",

        rapide: "⚡ Rapide",

        sucre: "🍰 Sucré",

        reconfort: "💚 Réconfort",

        vegetarien: "🥕 Végétarien"

      };


      enviesSelectionnees.forEach(
        function(envie) {

          html +=
            "<span>" +
            (
              noms[envie] ||
              envie
            ) +
            "</span>";

        }
      );



      /*
        TEMPS
      */

      if (
        temps
      ) {

        let texteTemps =
          temps;


        if (
          temps === "10"
        ) {

          texteTemps =
            "≤ 10 min";

        }


        if (
          temps === "20"
        ) {

          texteTemps =
            "≤ 20 min";

        }


        if (
          temps === "30"
        ) {

          texteTemps =
            "≤ 30 min";

        }


        if (
          temps === "plus"
        ) {

          texteTemps =
            "+ de 30 min";

        }


        html +=
          "<span>⏱️ " +
          texteTemps +
          "</span>";

      }



      if (
        preferences.length > 0
      ) {

        html +=
          "<span>⚙️ " +
          preferences.length +
          " préférence(s)</span>";

      }



      if (
        html === ""
      ) {

        html =
          "<span>Aucun filtre sélectionné</span>";

      }


      zone.innerHTML =
        html;

    }



    /* ==================================================
       CHARGEMENT DES RECETTES
    ================================================== */

    fetch(
      "../recettes.json"
    )

      .then(
        function(response) {

          if (
            !response.ok
          ) {

            throw new Error(
              "Impossible de charger recettes.json"
            );

          }


          return response.json();

        }
      )

      .then(
        function(data) {

          recettes =
            Array.isArray(data)
              ? data
              : [];


          afficherResume();

          afficherResultats();

        }
      )

      .catch(
        function(error) {

          console.error(
            error
          );


          document.getElementById(
            "liste"
          ).innerHTML =

            "<div class=\"vide\">" +

              "<div class=\"emoji\">⚠️</div>" +

              "<h3>Oups...</h3>" +

              "<p>" +
                "Impossible de charger les recettes. " +
                "Vérifiez que le fichier recettes.json " +
                "est bien présent au bon endroit." +
              "</p>" +

              "</div>";

        }
      );



    /* ==================================================
       AFFICHAGE DES RESULTATS
    ================================================== */

    function afficherResultats() {

      const liste =
        document.getElementById(
          "liste"
        );


      const compteur =
        document.getElementById(
          "compteur"
        );


      const resultats =
        recettes.filter(
          verifierRecette
        );


      if (
        resultats.length === 0
      ) {

        compteur.textContent =
          "0 recette";


        liste.innerHTML =

          "<div class=\"vide\">" +

            "<div class=\"emoji\">🍽️</div>" +

            "<h3>Aucune recette ne correspond</h3>" +

            "<p>" +
              "Aucune recette ne correspond exactement " +
              "à cette combinaison de critères. " +
              "Vous pouvez modifier vos envies pour élargir la sélection." +
            "</p>" +

            "<a " +
              "class=\"bouton\" " +
              "href=\"MesEnvies.html\"" +
            ">" +
              "Modifier mes envies" +
            "</a>" +

          "</div>";

        return;

      }



      compteur.textContent =
        resultats.length +
        (
          resultats.length > 1
            ? " recettes"
            : " recette"
        );


      let html = "";


      resultats.forEach(
        function(recette) {

          html += construireCarteRecette(
            recette
          );

        }
      );


      liste.innerHTML =
        html;


      /*
        Boutons "Voir la recette"
      */

      document
        .querySelectorAll(
          ".ouvrir"
        )
        .forEach(
          function(bouton) {

            bouton.addEventListener(
              "click",
              function() {

                const id =
                  bouton.getAttribute(
                    "data-id"
                  );


                window.location.href =
                  "Recette.html?id=" +
                  encodeURIComponent(
                    id
                  );

              }
            );

          }
        );


      /*
        Boutons favoris
      */

      document
        .querySelectorAll(
          ".favori"
        )
        .forEach(
          function(bouton) {

            bouton.addEventListener(
              "click",
              function() {

                const id =
                  bouton.getAttribute(
                    "data-id"
                  );


                const recette =
                  recettes.find(
                    function(item) {

                      return (
                        String(
                          item.id
                        ) ===
                        String(
                          id
                        )
                      );

                    }
                  );


                if (
                  recette
                ) {

                  basculerFavori(
                    recette
                  );

                }

              }
            );

          }
        );

    }



    /* ==================================================
       CARTE RECETTE
    ================================================== */

    function construireCarteRecette(
      recette
    ) {

      const favori =
        estFavori(
          recette
        );


      const tempsRecette =
        recette.temps !== undefined
          ? recette.temps + " min"
          : "Temps non précisé";


      const proteines =
        recette.proteines !== undefined
          ? recette.proteines + " g protéines"
          : "";


      let enviesHtml =
        "";


      if (
        Array.isArray(
          recette.envies
        )
      ) {

        recette.envies.forEach(
          function(envie) {

            let nom =
              envie;


            if (
              envie === "leger"
            ) {

              nom = "Léger";

            }

            if (
              envie === "complet"
            ) {

              nom = "Complet";

            }

            if (
              envie === "rapide"
            ) {

              nom = "Rapide";

            }

            if (
              envie === "sucre"
            ) {

              nom = "Sucré";

            }

            if (
              envie === "reconfort" ||
              envie === "reconfortant"
            ) {

              nom = "Réconfort";

            }

            if (
              envie === "vegetarien"
            ) {

              nom = "Végétarien";

            }


            enviesHtml +=
              "<span class=\"badge-envie\">" +
              nom +
              "</span>";

          }
        );

      }



      return (

        "<article class=\"carte\">" +

          "<h3>" +
            (recette.nom || "Recette") +
          "</h3>" +

          "<div class=\"categorie\">" +
            (recette.categorie || "") +
          "</div>" +

          "<div class=\"infos\">" +

            "<span class=\"badge\">" +
              "⏱️ " +
              tempsRecette +
            "</span>" +

            (
              proteines
                ? (
                    "<span class=\"badge\">" +
                      "💪 " +
                      proteines +
                    "</span>"
                  )
                : ""
            ) +

            (
              recette.portion
                ? (
                    "<span class=\"badge\">" +
                      "🥄 " +
                      recette.portion +
                    "</span>"
                  )
                : ""
            ) +

          "</div>" +

          (
            enviesHtml
              ? (
                  "<div class=\"badges-envies\">" +
                    enviesHtml +
                  "</div>"
                )
              : ""
          ) +

          "<div class=\"actions\">" +

            "<button " +
              "type=\"button\" " +
              "class=\"ouvrir\" " +
              "data-id=\"" +
                String(
                  recette.id || ""
                ) +
              "\"" +
            ">" +
              "Voir la recette" +
            "</button>" +

            "<button " +
              "type=\"button\" " +
              "class=\"favori " +
                (
                  favori
                    ? "actif"
                    : ""
                ) +
              "\"" +
              "data-id=\"" +
                String(
                  recette.id || ""
                ) +
              "\"" +
              "title=\"Ajouter aux favoris\"" +
            ">" +
              (
                favori
                  ? "❤️"
                  : "♡"
              ) +
            "</button>" +

          "</div>" +

        "</article>"

      );

    }



    /* ==================================================
       FAVORIS
    ================================================== */

    function estFavori(
      recette
    ) {

      let favoris = [];


      try {

        favoris =
          JSON.parse(
            localStorage.getItem(
              "favoris"
            ) || "[]"
          );

        if (
          !Array.isArray(
            favoris
          )
        ) {

          favoris = [];

        }

      } catch (e) {

        favoris = [];

      }


      return favoris.some(
        function(fav) {

          return (
            String(
              fav.id || fav.nom
            ) ===
            String(
              recette.id ||
              recette.nom
            )
          );

        }
      );

    }



    function basculerFavori(
      recette
    ) {

      let favoris = [];


      try {

        favoris =
          JSON.parse(
            localStorage.getItem(
              "favoris"
            ) || "[]"
          );

        if (
          !Array.isArray(
            favoris
          )
        ) {

          favoris = [];

        }

      } catch (e) {

        favoris = [];

      }


      const identifiant =
        String(
          recette.id ||
          recette.nom
        );


      const index =
        favoris.findIndex(
          function(fav) {

            return (
              String(
                fav.id ||
                fav.nom
              ) ===
              identifiant
            );

          }
        );


      if (
        index >= 0
      ) {

        favoris.splice(
          index,
          1
        );

      } else {

        favoris.push(
          recette
        );

      }


      localStorage.setItem(
        "favoris",
        JSON.stringify(
          favoris
        )
      );


      afficherResultats();

    }

  </script>
