<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Mes suggestions - Ma Petite Assiette</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      font-family: Arial, sans-serif;

      background: #fffaf5;

      color: #4d4038;

      padding-bottom: 85px;

    }


    /* HERO */

    .hero {

      background:
        linear-gradient(
          135deg,
          #f6d9c8,
          #dce8d5
        );

      padding: 25px 20px 30px;

      border-radius:
        0 0 30px 30px;

    }


    .retour {

      display: inline-block;

      color: #5b7153;

      text-decoration: none;

      font-weight: bold;

      margin-bottom: 18px;

    }


    .hero h1 {

      font-size: 27px;

      margin-bottom: 8px;

    }


    .hero p {

      line-height: 1.5;

      font-size: 15px;

    }


    /* CONTENU */

    .contenu {

      max-width: 700px;

      margin: auto;

      padding: 20px 16px;

    }


    /* RESUME DES CHOIX */

    .resume {

      background: white;

      border-radius: 22px;

      padding: 17px;

      box-shadow:
        0 4px 16px
        rgba(91, 70, 55, 0.08);

      margin-bottom: 20px;

    }


    .resume h2 {

      font-size: 18px;

      margin-bottom: 12px;

    }


    .choix {

      display: flex;

      flex-wrap: wrap;

      gap: 7px;

    }


    .choix span {

      background: #eef4ea;

      color: #5d7355;

      border-radius: 15px;

      padding: 7px 10px;

      font-size: 12px;

    }


    .choix span.repas {

      background: #f8e5d9;

      color: #986b54;

    }


    /* RESULTATS */

    .titre-resultats {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 13px;

    }


    .titre-resultats h2 {

      font-size: 20px;

    }


    #compteur {

      font-size: 13px;

      color: #87776d;

    }


    .liste {

      display: grid;

      gap: 14px;

    }


    /* CARTE RECETTE */

    .recette {

      background: white;

      border-radius: 22px;

      padding: 17px;

      box-shadow:
        0 4px 16px
        rgba(91, 70, 55, 0.08);

      border:
        1px solid #f0e5dd;

    }


    .haut-recette {

      display: flex;

      justify-content: space-between;

      gap: 12px;

    }


    .recette h3 {

      font-size: 18px;

      line-height: 1.3;

      margin-bottom: 7px;

    }


    .meta {

      color: #887970;

      font-size: 13px;

      line-height: 1.5;

    }


    .favori {

      width: 38px;

      height: 38px;

      min-width: 38px;

      border: none;

      border-radius: 50%;

      background: #fff3ed;

      font-size: 20px;

      cursor: pointer;

    }


    .favori.active {

      background: #f5d7c7;

    }


    .badges {

      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      margin-top: 12px;

    }


    .badge {

      background: #eef4ea;

      color: #5d7355;

      border-radius: 12px;

      padding: 5px 8px;

      font-size: 11px;

    }


    .badge.douceur {

      background: #f8e2dc;

      color: #a36562;

    }


    .badge.post {

      background: #f6e5ef;

      color: #8c6177;

    }


    .ouvrir {

      width: 100%;

      border: none;

      background: #78936d;

      color: white;

      border-radius: 15px;

      padding: 12px;

      margin-top: 14px;

      font-weight: bold;

      cursor: pointer;

    }


    /* VIDE */

    .vide {

      background: white;

      border-radius: 22px;

      padding: 25px 18px;

      text-align: center;

      box-shadow:
        0 4px 16px
        rgba(91, 70, 55, 0.06);

    }


    .vide .emoji {

      font-size: 40px;

      margin-bottom: 12px;

    }


    .vide h3 {

      margin-bottom: 8px;

    }


    .vide p {

      line-height: 1.5;

      color: #75665d;

      margin-bottom: 17px;

    }


    .bouton {

      display: inline-block;

      border: none;

      background: #78936d;

      color: white;

      text-decoration: none;

      padding: 12px 18px;

      border-radius: 15px;

      font-weight: bold;

      cursor: pointer;

    }


    /* NAVIGATION */

    .bottom-nav {

      position: fixed;

      bottom: 0;

      left: 0;

      right: 0;

      height: 72px;

      background:
        rgba(255,250,245,0.97);

      border-top:
        1px solid #eadfd7;

      display: flex;

      justify-content: space-around;

      align-items: center;

      z-index: 100;

    }


    .bottom-nav a {

      text-decoration: none;

      color: #82736a;

      font-size: 11px;

      text-align: center;

    }


    .bottom-nav a span {

      display: block;

      font-size: 22px;

      margin-bottom: 3px;

    }


    .bottom-nav a.active {

      color: #66805d;

      font-weight: bold;

    }

  </style>

</head>

<body>

  <!-- HERO -->

  <header class="hero">

    <a
      class="retour"
      href="../../index.html"
    >
      ← Accueil
    </a>

    <h1>
      ✨ Mes petites suggestions
    </h1>

    <p>
      Des idées choisies selon vos envies
      et votre façon de manger.
    </p>

  </header>

  <main class="contenu">

    <!-- RESUME DES CHOIX -->

    <section class="resume">

      <h2>
        💚 Vos choix
      </h2>

      <div
        class="choix"
        id="resumeChoix"
      >

        <span>
          Recherche en cours...
        </span>

      </div>

    </section>

    <!-- RESULTATS -->

    <div class="titre-resultats">

      <h2>
        Pour vous aujourd'hui
      </h2>

      <span id="compteur">
        0 recette
      </span>

    </div>

    <div
      id="liste"
      class="liste"
    ></div>

  </main>

  <!-- NAVIGATION -->

  <nav class="bottom-nav">

    <a href="../../index.html">

      <span>🏠</span>

      Accueil

    </a>

    <a href="Recettes.html">

      <span>🍽️</span>

      Recettes

    </a>

    <a href="Favoris.html">

      <span>❤️</span>

      Favoris

    </a>

    <a
      href="MonProfil.html"
      class="active"
    >

      <span>👤</span>

      Profil

    </a>

  </nav>

  <script>


    /* ==================================================
       DONNEES
    ================================================== */

    let recettes = [];


    const envie =
      localStorage.getItem(
        "envie"
      ) || "";


    const temps =
      localStorage.getItem(
        "temps"
      ) || "";


    const modePortion =
      localStorage.getItem(
        "modePortion"
      ) || "";


    let preferences = [];


    try {

      preferences =
        JSON.parse(
          localStorage.getItem(
            "preferences"
          ) || "[]"
        );

    } catch (e) {

      preferences = [];

    }


    /*
      Nouveau :
      on récupère également le type
      de repas choisi sur l'accueil.
    */

    const typeRepas =
      localStorage.getItem(
        "typeRepas"
      ) || "";


    /* ==================================================
       NORMALISATION
    ================================================== */

    function normaliser(
      texte
    ) {

      return String(
        texte || ""
      )
        .toLowerCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .replace(
          /[-_]/g,
          " "
        )
        .trim();

    }


    /* ==================================================
       CORRESPONDANCE TYPE REPAS
    ================================================== */

    const correspondanceTypeRepas = {

      "petit-dejeuner":
        "Petit-déjeuner",

      "dejeuner":
        "Déjeuner",

      "diner":
        "Dîner",

      "collation":
        "Collation",

      "petite-douceur":
        "Petite douceur"

    };


    /* ==================================================
       CHARGEMENT
    ================================================== */

    fetch("../recettes.json")

      .then(function(response) {

        if (!response.ok) {

          throw new Error(
            "Impossible de charger recettes.json"
          );

        }

        return response.json();

      })

      .then(function(data) {

        recettes =
          Array.isArray(data)
            ? data
            : [];


        afficherResume();

        afficherResultats();

      })

      .catch(function(error) {

        console.error(error);


        document.getElementById(
          "liste"
        ).innerHTML = `

          <div class="vide">

            <div class="emoji">
              ⚠️
            </div>

            <h3>
              Oups...
            </h3>

            <p>
              Impossible de charger les recettes.
            </p>

          </div>

        `;

      });


    /* ==================================================
       RESUME DES CHOIX
    ================================================== */

    function afficherResume() {

      const zone =
        document.getElementById(
          "resumeChoix"
        );


      let html = "";


      /* TYPE REPAS */

      if (
        typeRepas &&
        typeRepas !==
        "peu-importe"
      ) {

        const nomRepas =
          correspondanceTypeRepas[
            typeRepas
          ] ||
          typeRepas;


        let emoji = "🍽️";


        if (
          typeRepas ===
          "petit-dejeuner"
        ) {

          emoji = "🌅";

        }


        if (
          typeRepas ===
          "dejeuner"
        ) {

          emoji = "🥗";

        }


        if (
          typeRepas ===
          "diner"
        ) {

          emoji = "🍽️";

        }


        if (
          typeRepas ===
          "collation"
        ) {

          emoji = "🍎";

        }


        if (
          typeRepas ===
          "petite-douceur"
        ) {

          emoji = "🍰";

        }


        html += `

          <span class="repas">

            ${emoji}
            ${nomRepas}

          </span>

        `;

      }


      /* ENVIE */

      if (envie) {

        const envies = {

          leger:
            "🥗 Léger",

          complet:
            "🍽️ Complet",

          rapide:
            "⚡ Rapide",

          sucre:
            "🍰 Sucré",

          reconfort:
            "💚 Réconfort",

          vegetarien:
            "🥕 Végétarien"

        };


        html += `

          <span>

            ${
              envies[envie]
              || envie
            }

          </span>

        `;

      }


      /* TEMPS */

      if (temps) {

        html += `

          <span>
            ⏱️ ${temps}
          </span>

        `;

      }


      /* MODE PORTION */

      if (
        modePortion ===
        "petite"
      ) {

        html += `

          <span>
            🥄 Petite portion
          </span>

        `;

      }


      if (
        modePortion ===
        "famille"
      ) {

        html += `

          <span>
            👨‍👩‍👧‍👦 Famille
          </span>

        `;

      }


      if (
        modePortion ===
        "mixte"
      ) {

        html += `

          <span>
            🍲 Petite portion + famille
          </span>

        `;

      }


      /* PREFERENCES */

      const labelsPreferences = {

        petite:
          "🥄 Petite assiette",

        ingredients:
          "🛒 Peu d'ingrédients",

        digeste:
          "🌿 Facile à digérer",

        avance:
          "🥘 À préparer à l'avance"

      };


      preferences.forEach(function(pref) {

        const label =
          labelsPreferences[pref];

        if (label) {

          html += `

            <span>
              ${label}
            </span>

          `;

        }

      });


      zone.innerHTML = html;

    }


    /* ==================================================
       AFFICHAGE RESULTATS
    ================================================== */

    function afficherResultats() {

      const liste =
        document.getElementById(
          "liste"
        );

      const compteur =
        document.getElementById(
          "compteur"
        );


      /* FILTRER */

      let resultats =
        recettes.filter(function(recette) {

          return verifierRecette(
            recette
          );

        });


      /* AFFICHER COMPTEUR */

      const nbResultats =
        resultats.length;

      const textCompteur =
        nbResultats === 1
          ? "1 recette"
          : nbResultats + " recettes";

      compteur.textContent =
        textCompteur;


      /* AFFICHER RESULTATS */

      if (
        nbResultats === 0
      ) {

        liste.innerHTML = `

          <div class="vide">

            <div class="emoji">
              🤔
            </div>

            <h3>
              Pas de match pour l'instant
            </h3>

            <p>
              Essayez d'ajuster vos préférences
              pour découvrir plus de recettes.
            </p>

            <button
              class="bouton"
              onclick="
                window.location.href =
                  'MesEnvies.html'
              "
            >
              Modifier mes envies
            </button>

          </div>

        `;

        return;

      }


      liste.innerHTML =
        resultats
          .map(function(recette, index) {

            return construireCartRecette(
              recette,
              index
            );

          })
          .join("");


      /* EVENT LISTENERS */

      document
        .querySelectorAll(
          ".favori"
        )
        .forEach(function(btn) {

          btn.addEventListener(
            "click",
            function(e) {

              e.preventDefault();

              const index =
                parseInt(
                  btn.getAttribute(
                    "data-index"
                  )
                );

              const recette =
                resultats[index];

              if (recette) {

                basculerFavori(
                  recette
                );

              }

            }
          );

        });

      document
        .querySelectorAll(
          ".ouvrir"
        )
        .forEach(function(btn) {

          btn.addEventListener(
            "click",
            function() {

              const index =
                parseInt(
                  btn.getAttribute(
                    "data-index"
                  )
                );

              const recette =
                resultats[index];

              if (recette) {

                localStorage.setItem(
                  "recetteSelectionnee",
                  JSON.stringify(
                    recette
                  )
                );

                window.location.href =
                  "Recette.html";

              }

            }
          );

        });

    }


    /* ==================================================
       VERIFIER RECETTE
    ================================================== */

    function verifierRecette(
      recette
    ) {

      /* TYPE REPAS */

      if (
        typeRepas &&
        typeRepas !==
        "peu-importe"
      ) {

        const typeNorm =
          normaliser(
            typeRepas
          );

        const typesRecetteNorm =
          (recette.type || "")
            .split(",")
            .map(function(t) {

              return normaliser(
                t
              );

            });

        if (
          !typesRecetteNorm
            .some(function(t) {

              return (
                t.includes(
                  typeNorm
                ) ||
                typeNorm.includes(
                  t
                )
              );

            })
        ) {

          return false;

        }

      }


      /* ENVIE */

      if (envie) {

        const envieNorm =
          normaliser(
            envie
          );

        const tagsNorm =
          (recette.tags || "")
            .split(",")
            .map(function(tag) {

              return normaliser(
                tag
              );

            });

        if (
          !tagsNorm
            .some(function(tag) {

              return (
                tag.includes(
                  envieNorm
                ) ||
                envieNorm.includes(
                  tag
                )
              );

            })
        ) {

          return false;

        }

      }


      /* TEMPS */

      if (temps) {

        const tempsNorm =
          normaliser(
            temps
          );

        const recetteTempNorm =
          normaliser(
            recette.temps || ""
          );

        let tempsMinutes = 0;

        if (
          tempsNorm.includes(
            "10"
          )
        ) {

          tempsMinutes = 10;

        } else if (
          tempsNorm.includes(
            "20"
          )
        ) {

          tempsMinutes = 20;

        } else if (
          tempsNorm.includes(
            "30"
          )
        ) {

          tempsMinutes = 30;

        }

        if (
          tempsMinutes > 0 &&
          recetteTempNorm !==
          "plus"
        ) {

          const recetteMinutes =
            parseInt(
              recetteTempNorm
            ) || 0;

          if (
            recetteMinutes >
            tempsMinutes + 5
          ) {

            return false;

          }

        }

      }


      /* MODE PORTION */

      if (
        modePortion &&
        modePortion !==
        "peu-importe"
      ) {

        const modeNorm =
          normaliser(
            modePortion
          );

        const portionNorm =
          normaliser(
            recette.portion || ""
          );

        if (
          modeNorm ===
          "petite"
        ) {

          if (
            !portionNorm.includes(
              "petite"
            ) &&
            !portionNorm.includes(
              "une"
            )
          ) {

            return false;

          }

        } else if (
          modeNorm ===
          "famille"
        ) {

          if (
            !portionNorm.includes(
              "famille"
            ) &&
            !portionNorm.includes(
              "quatre"
            )
          ) {

            return false;

          }

        }

      }


      /* PREFERENCES */

      if (
        preferences.length > 0
      ) {

        const prefsNorm =
          preferences
            .map(function(pref) {

              return normaliser(
                pref
              );

            });

        const recettePrefsNorm =
          (recette.preferences || "")
            .split(",")
            .map(function(pref) {

              return normaliser(
                pref
              );

            });

        const toutesPreferences =
          prefsNorm.every(
            function(pref) {

              return (
                recettePrefsNorm
                  .some(function(rp) {

                    return (
                      rp.includes(
                        pref
                      ) ||
                      pref.includes(
                        rp
                      )
                    );

                  })
              );

            }
          );

        if (
          !toutesPreferences
        ) {

          return false;

        }

      }


      return true;

    }


    /* ==================================================
       CONSTRUIRE CARTE
    ================================================== */

    function construireCartRecette(
      recette,
      index
    ) {

      const favoriActif =
        estFavori(
          recette
        );

      let html = `

        <div class="recette">

          <div class="haut-recette">

            <div>

              <h3>
                ${recette.nom}
              </h3>

              <p class="meta">
                ⏱️ ${recette.temps || "?"} min
                <br>
                🍽️ ${recette.portion || "1 part"}
              </p>

            </div>

            <button
              class="favori ${
                favoriActif
                  ? "active"
                  : ""
              }"
              data-index="${index}"
              title="Ajouter aux favoris"
            >
              ${
                favoriActif
                  ? "❤️"
                  : "🤍"
              }
            </button>

          </div>

      `;

      if (
        recette.description
      ) {

        html += `

          <p
            style="
              margin-top: 10px;
              color: #75665d;
              font-size: 13px;
              line-height: 1.5;
            "
          >
            ${recette.description}
          </p>

        `;

      }

      if (
        recette.tags ||
        recette.preferences
      ) {

        html += `

          <div class="badges">

        `;

        if (recette.tags) {

          const tags =
            recette.tags
              .split(",");

          tags.forEach(
            function(tag) {

              tag = tag.trim();

              let classe = "";

              if (
                tag.toLowerCase()
                  .includes("sucr")
              ) {

                classe = "douceur";

              }

              html += `

                <span
                  class="badge ${classe}"
                >
                  ${tag}
                </span>

              `;

            }
          );

        }

        if (
          recette.preferences
        ) {

          const prefs =
            recette.preferences
              .split(",");

          prefs.forEach(
            function(pref) {

              pref = pref.trim();

              let classe = "";

              if (
                pref.toLowerCase()
                  .includes("sucr")
              ) {

                classe = "douceur";

              } else if (
                pref.toLowerCase()
                  .includes(
                    "post"
                  )
              ) {

                classe = "post";

              }

              html += `

                <span
                  class="badge ${classe}"
                >
                  ${pref}
                </span>

              `;

            }
          );

        }

        html += `

          </div>

        `;

      }

      html += `

        <button
          class="ouvrir"
          data-index="${index}"
        >
          Voir la recette
        </button>

        </div>

      `;

      return html;

    }


    /* ==================================================
       FAVORIS
    ================================================== */

    function estFavori(
      recette
    ) {

      let favoris = [];

      try {

        favoris =
          JSON.parse(
            localStorage
              .getItem(
                "favoris"
              ) || "[]"
          );

      } catch (e) {

        favoris = [];

      }

      return favoris.some(
        function(fav) {

          return (
            fav.nom ===
            recette.nom
          );

        }
      );

    }


    function basculerFavori(
      recette
    ) {

      let favoris = [];

      try {

        favoris =
          JSON.parse(
            localStorage
              .getItem(
                "favoris"
              ) || "[]"
          );

      } catch (e) {

        favoris = [];

      }

      const index =
        favoris.findIndex(
          function(fav) {

            return (
              fav.nom ===
              recette.nom
            );

          }
        );

      if (index > -1) {

        favoris.splice(
          index,
          1
        );

      } else {

        favoris.push(
          recette
        );

      }

      localStorage.setItem(
        "favoris",
        JSON.stringify(
          favoris
        )
      );

      afficherResultats();

    }

  </script>

</body>

</html>
