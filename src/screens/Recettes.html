<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes recettes - Ma Petite Assiette</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffaf5;
      color: #4b4039;
      padding-bottom: 90px;
    }

    .hero {
      background: linear-gradient(135deg, #f5d8c8, #dce8d4);
      padding: 28px 20px 24px;
      border-radius: 0 0 30px 30px;
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: rgba(255,255,255,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      color: #51453d;
    }

    .intro {
      margin: 8px 0 0;
      font-size: 15px;
      line-height: 1.5;
      color: #6b5b51;
    }

    .content {
      padding: 20px 16px;
    }

    .search {
      width: 100%;
      border: none;
      background: white;
      border-radius: 18px;
      padding: 15px 17px;
      font-size: 15px;
      box-shadow: 0 4px 14px rgba(80,60,40,0.07);
      margin-bottom: 16px;
      outline: none;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
      margin-bottom: 18px;
    }

    .category {
      flex: 0 0 auto;
      border: none;
      border-radius: 20px;
      padding: 10px 15px;
      background: #f0e5dc;
      color: #5d5149;
      cursor: pointer;
      font-size: 13px;
    }

    .category.active {
      background: #7e9b72;
      color: white;
    }

    .filters {
      background: white;
      border-radius: 22px;
      padding: 17px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(80,60,40,0.07);
    }

    .filters-title {
      font-weight: bold;
      margin-bottom: 12px;
      color: #55483f;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .filter {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #665950;
    }

    .filter input {
      accent-color: #7e9b72;
    }

    .texture-banner {
      background: #edf3e9;
      border-radius: 18px;
      padding: 13px 15px;
      margin-bottom: 18px;
      color: #5d7455;
      font-size: 13px;
      line-height: 1.4;
      display: none;
    }

    .texture-banner strong {
      display: block;
      font-size: 15px;
      margin-bottom: 3px;
    }

    .count {
      font-size: 14px;
      color: #7b6d64;
      margin: 10px 3px 14px;
    }

    .recipe-card {
      background: white;
      border-radius: 22px;
      padding: 17px;
      margin-bottom: 13px;
      box-shadow: 0 4px 14px rgba(80,60,40,0.07);
      cursor: pointer;
      position: relative;
    }

    .recipe-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .recipe-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #f4e8df;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .recipe-category {
      font-size: 12px;
      color: #7d9a70;
      font-weight: bold;
      text-transform: uppercase;
    }

    .recipe-name {
      font-size: 18px;
      font-weight: bold;
      margin: 5px 0;
      padding-right: 30px;
      color: #4e433b;
    }

    .recipe-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .badge {
      background: #f5eee9;
      border-radius: 12px;
      padding: 6px 9px;
      font-size: 11px;
      color: #685b52;
    }

    .badge.batch {
      background: #e2ecde;
      color: #5c7952;
    }

    .badge.texture {
      background: #e8efe3;
      color: #5f7757;
    }

    .favorite {
      position: absolute;
      right: 15px;
      top: 15px;
      border: none;
      background: transparent;
      font-size: 23px;
      cursor: pointer;
      z-index: 2;
    }

    .empty {
      text-align: center;
      background: white;
      border-radius: 22px;
      padding: 28px 18px;
      color: #75675d;
      box-shadow: 0 4px 14px rgba(80,60,40,0.06);
    }

    .reset {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 13px;
      margin-top: 14px;
      background: #f0e4da;
      color: #5c5048;
      cursor: pointer;
      font-weight: bold;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 72px;
      background: rgba(255,255,255,0.96);
      border-top: 1px solid #eee2d8;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #81736a;
      font-size: 12px;
      text-align: center;
    }

    .bottom-nav a.active {
      color: #718b66;
      font-weight: bold;
    }

    .nav-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

  <header class="hero">

    <div class="logo">🍽️</div>

    <h1>Mes recettes</h1>

    <p class="intro">
      Des idées adaptées à vos envies, votre appétit,
      votre organisation et votre parcours.
    </p>

  </header>


  <main class="content">

    <input
      type="search"
      id="search"
      class="search"
      placeholder="🔎 Rechercher une recette..."
    >


    <div class="categories">

      <button class="category active" data-category="Toutes">
        Toutes
      </button>

      <button class="category" data-category="Petit-déjeuner">
        Petit-déjeuner
      </button>

      <button class="category" data-category="Déjeuner">
        Déjeuner
      </button>

      <button class="category" data-category="Dîner">
        Dîner
      </button>

      <button class="category" data-category="Collation">
        Collation
      </button>

      <button class="category" data-category="Végétarien">
        Végétarien
      </button>

      <button class="category" data-category="Salades">
        Salades
      </button>

    </div>


    <div
      id="textureBanner"
      class="texture-banner"
    ></div>


    <section class="filters">

      <div class="filters-title">
        Affiner mes recettes
      </div>

      <div class="filter-grid">

        <label class="filter">
          <input type="checkbox" id="petite">
          Petite portion
        </label>

        <label class="filter">
          <input type="checkbox" id="vegetarien">
          Végétarien
        </label>

        <label class="filter">
          <input type="checkbox" id="batch">
          Batch-cooking
        </label>

        <label class="filter">
          <input type="checkbox" id="preop">
          Pré-opératoire
        </label>

        <label class="filter">
          <input type="checkbox" id="postop">
          Post-opératoire
        </label>

        <label class="filter">
          <input type="checkbox" id="gluten">
          Sans gluten
        </label>

      </div>


      <button
        class="reset"
        onclick="resetFilters()"
      >
        Réinitialiser les filtres
      </button>

    </section>


    <div
      id="count"
      class="count"
    ></div>


    <div id="recipes"></div>

  </main>


  <nav class="bottom-nav">

    <a href="../../index.html">
      <span class="nav-icon">🏠</span>
      Accueil
    </a>

    <a
      href="Recettes.html"
      class="active"
    >
      <span class="nav-icon">🍴</span>
      Recettes
    </a>

    <a href="Favoris.html">
      <span class="nav-icon">❤️</span>
      Favoris
    </a>

    <a href="MonProfil.html">
      <span class="nav-icon">👤</span>
      Profil
    </a>

  </nav>


  <script>

    let recettes = [];

    let categorieActive = "Toutes";


    /*
      Lecture des paramètres envoyés par les autres écrans.
    */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const modePetite =
      params.get("petite") === "true";


    const modeBatch =
      params.get("batch") === "true";


    const textureDemandee =
      params.get("texture");


    /*
      Correspondance entre le nom utilisé dans l'URL
      et le nom affiché à l'utilisateur.
    */

    const nomsTextures = {

      liquide: "🥤 Texture liquide",

      mixee: "🥣 Texture mixée",

      mouline: "🍲 Texture moulinée",

      tendre: "🍽️ Texture tendre",

      petite: "🥄 Petite assiette"

    };


    /*
      Préactivation des filtres provenant
      des autres écrans.
    */

    document.getElementById("petite").checked =
      modePetite;


    document.getElementById("batch").checked =
      modeBatch;


    /*
      Affichage du bandeau de contexte.
    */

    function afficherContexteTexture() {

      const banner =
        document.getElementById(
          "textureBanner"
        );


      if (!textureDemandee) {

        banner.style.display = "none";

        return;

      }


      const texte =
        nomsTextures[textureDemandee];


      if (!texte) {

        banner.style.display = "none";

        return;

      }


      banner.innerHTML = `

        <strong>${texte}</strong>

        Les recettes affichées correspondent
        à cette texture lorsqu'elle est renseignée
        dans le catalogue.

      `;


      banner.style.display = "block";

    }


    afficherContexteTexture();


    /*
      Chargement du catalogue.
    */

    fetch("../recettes.json")

      .then(response => {

        if (!response.ok) {
          throw new Error(
            "Impossible de charger recettes.json"
          );
        }

        return response.json();

      })

      .then(data => {

        recettes = data;

        afficherRecettes();

      })

      .catch(error => {

        console.error(error);

        document.getElementById(
          "recipes"
        ).innerHTML = `

          <div class="empty">

            <div style="font-size:38px;">
              ⚠️
            </div>

            <strong>
              Oups...
            </strong>

            <p>
              Impossible de charger les recettes
              pour le moment.
            </p>

          </div>

        `;

      });


    /*
      Normalisation d'un texte.
      Permet de comparer :
      mixée / mixee
      moulinée / moulinee
      etc.
    */

    function normaliserTexte(texte) {

      return String(texte || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(
          /[\u0300-\u036f]/g,
          ""
        )
        .replace(
          /[\s-]/g,
          ""
        );

    }


    /*
      Vérification de la texture.
    */

    function correspondTexture(
      recette,
      textureRecherchee
    ) {

      if (!textureRecherchee) {
        return true;
      }


      /*
        "petite" correspond à l'idée
        de petite assiette / petit appétit.
      */

      if (
        textureRecherchee === "petite"
      ) {

        return (
          recette.petitAppetit === true
        );

      }


      const textureRecette =
        normaliserTexte(
          recette.texture
        );


      const textureRechercheeNormalisee =
        normaliserTexte(
          textureRecherchee
        );


      /*
        Pour le moment, une recette n'est
        proposée que si sa texture est
        explicitement renseignée.
      */

      return (
        textureRecette ===
        textureRechercheeNormalisee
      );

    }


    function afficherRecettes() {

      const recherche =
        document.getElementById(
          "search"
        ).value
          .toLowerCase()
          .trim();


      const petite =
        document.getElementById(
          "petite"
        ).checked;


      const vegetarien =
        document.getElementById(
          "vegetarien"
        ).checked;


      const batch =
        document.getElementById(
          "batch"
        ).checked;


      const preop =
        document.getElementById(
          "preop"
        ).checked;


      const postop =
        document.getElementById(
          "postop"
        ).checked;


      const gluten =
        document.getElementById(
          "gluten"
        ).checked;


      let resultat =
        recettes.filter(recette => {


          /*
            Recherche
          */

          if (recherche) {

            const texte = [

              recette.nom,

              recette.categorie,

              recette.type,

              ...(recette.ingredients || [])

            ]
              .join(" ")
              .toLowerCase();


            if (
              !texte.includes(
                recherche
              )
            ) {

              return false;

            }

          }


          /*
            Catégorie
          */

          if (
            categorieActive !==
            "Toutes"
          ) {

            if (
              categorieActive ===
              "Végétarien"
            ) {

              if (
                recette.vegetarien !== true
              ) {

                return false;

              }

            }

            else if (
              categorieActive ===
              "Salades"
            ) {

              const texte = `

                ${recette.nom || ""}

                ${recette.categorie || ""}

                ${recette.type || ""}

              `.toLowerCase();


              if (
                !texte.includes(
                  "salade"
                )
              ) {

                return false;

              }

            }

            else {

              const categorie =
                (
                  recette.categorie ||
                  ""
                ).toLowerCase();


              if (
                !categorie.includes(
                  categorieActive.toLowerCase()
                )
              ) {

                return false;

              }

            }

          }


          /*
            TEXTURE POST-OPÉRATOIRE
          */

          if (
            !correspondTexture(
              recette,
              textureDemandee
            )
          ) {

            return false;

          }


          /*
            Petite portion
          */

          if (
            petite &&
            recette.petitAppetit !== true
          ) {

            return false;

          }


          /*
            Végétarien
          */

          if (
            vegetarien &&
            recette.vegetarien !== true
          ) {

            return false;

          }


          /*
            Batch-cooking
          */

          if (
            batch &&
            recette.batchCooking !== true
          ) {

            return false;

          }


          /*
            Pré-opératoire
          */

          if (
            preop &&
            recette.preOperatoire !== true
          ) {

            return false;

          }


          /*
            Post-opératoire
          */

          if (
            postop &&
            recette.postOperatoire !== true
          ) {

            return false;

          }


          /*
            Sans gluten
          */

          if (
            gluten &&
            recette.sansGluten !== true
          ) {

            return false;

          }


          return true;

        });


      /*
        Compteur
      */

      document.getElementById(
        "count"
      ).textContent =

        resultat.length +
        (
          resultat.length > 1
            ? " recettes trouvées"
            : " recette trouvée"
        );


      const container =
        document.getElementById(
          "recipes"
        );


      /*
        Aucune recette
      */

      if (
        resultat.length === 0
      ) {

        container.innerHTML = `

          <div class="empty">

            <div style="font-size:38px;">
              🥄
            </div>

            <strong>
              Aucune recette trouvée
            </strong>

            <p>
              Cette texture n'a pas encore
              de recette dans notre catalogue.
            </p>

            <p>
              Nous allons progressivement
              enrichir cette rubrique.
            </p>

          </div>

        `;

        return;

      }


      /*
        Affichage des recettes
      */

      container.innerHTML =

        resultat
          .map(recette => {


            const favoris =
              JSON.parse(
                localStorage.getItem(
                  "favoris"
                ) || "[]"
              );


            const estFavori =
              favoris.includes(
                recette.id
              );


            return `

              <article
                class="recipe-card"
                onclick="
                  ouvrirRecette(
                    '${recette.id}'
                  )
                "
              >

                <button
                  class="favorite"
                  onclick="
                    toggleFavori(
                      event,
                      '${recette.id}'
                    )
                  "
                  aria-label="
                    Ajouter aux favoris
                  "
                >

                  ${
                    estFavori
                      ? "❤️"
                      : "♡"
                  }

                </button>


                <div class="recipe-top">

                  <div class="recipe-icon">

                    ${iconeRecette(recette)}

                  </div>


                  <div class="recipe-category">

                    ${
                      recette.categorie ||
                      "Recette"
                    }

                  </div>

                </div>


                <div class="recipe-name">

                  ${recette.nom}

                </div>


                <div class="recipe-meta">

                  <span class="badge">

                    ⏱️
                    ${recette.temps || "-"}
                    min

                  </span>


                  <span class="badge">

                    🥄
                    ${recette.portion || "-"}

                  </span>


                  <span class="badge">

                    💪
                    ${recette.proteines || 0}
                    g protéines

                  </span>


                  ${
                    recette.texture
                      ? `
                        <span class="badge texture">

                          🥣
                          ${recette.texture}

                        </span>
                      `
                      : ""
                  }


                  ${
                    recette.batchCooking
                      ? `
                        <span class="badge batch">

                          📦 Batch-cooking

                        </span>
                      `
                      : ""
                  }

                </div>

              </article>

            `;

          })
          .join("");

    }


    /*
      Icône selon le type de recette.
    */

    function iconeRecette(
      recette
    ) {

      const categorie = `

        ${recette.categorie || ""}

        ${recette.type || ""}

      `.toLowerCase();


      if (
        categorie.includes("petit") ||
        categorie.includes("matin")
      ) {

        return "🥣";

      }


      if (
        categorie.includes("collation")
      ) {

        return "🍎";

      }


      if (
        recette.vegetarien === true
      ) {

        return "🥕";

      }


      if (
        categorie.includes("salade")
      ) {

        return "🥗";

      }


      if (
        categorie.includes("poisson") ||
        categorie.includes("saumon") ||
        categorie.includes("thon")
      ) {

        return "🐟";

      }


      return "🍽️";

    }


    /*
      Ouverture d'une fiche recette.
    */

    function ouvrirRecette(
      id
    ) {

      window.location.href =
        `Recette.html?id=${encodeURIComponent(id)}`;

    }


    /*
      Gestion des favoris.
    */

    function toggleFavori(
      event,
      id
    ) {

      event.stopPropagation();


      let favoris =
        JSON.parse(
          localStorage.getItem(
            "favoris"
          ) || "[]"
        );


      if (
        favoris.includes(id)
      ) {

        favoris =
          favoris.filter(
            favori =>
              favori !== id
          );

      }

      else {

        favoris.push(id);

      }


      localStorage.setItem(
        "favoris",
        JSON.stringify(
          favoris
        )
      );


      afficherRecettes();

    }


    /*
      Réinitialisation.
    */

    function resetFilters() {

      document.getElementById(
        "search"
      ).value = "";


      document.getElementById(
        "petite"
      ).checked = false;


      document.getElementById(
        "vegetarien"
      ).checked = false;


      document.getElementById(
        "batch"
      ).checked = false;


      document.getElementById(
        "preop"
      ).checked = false;


      document.getElementById(
        "postop"
      ).checked = false;


      document.getElementById(
        "gluten"
      ).checked = false;


      categorieActive =
        "Toutes";


      document
        .querySelectorAll(
          ".category"
        )
        .forEach(button => {

          button.classList.remove(
            "active"
          );

        });


      document
        .querySelector(
          '.category[data-category="Toutes"]'
        )
        .classList.add(
          "active"
        );


      /*
        Le paramètre texture reste volontairement
        actif lorsqu'on vient du parcours
        post-opératoire.
      */

      afficherRecettes();

    }


    /*
      Catégories.
    */

    document
      .querySelectorAll(
        ".category"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            categorieActive =
              button.dataset.category;


            document
              .querySelectorAll(
                ".category"
              )
              .forEach(btn => {

                btn.classList.remove(
                  "active"
                );

              });


            button.classList.add(
              "active"
            );


            afficherRecettes();

          }
        );

      });


    /*
      Recherche.
    */

    document
      .getElementById(
        "search"
      )
      .addEventListener(
        "input",
        afficherRecettes
      );


    /*
      Filtres.
    */

    document
      .querySelectorAll(
        "#petite, #vegetarien, #batch, #preop, #postop, #gluten"
      )
      .forEach(
        checkbox => {

          checkbox.addEventListener(
            "change",
            afficherRecettes
          );

        }
      );

  </script>

</body>
</html>
