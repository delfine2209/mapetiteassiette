  <style>
    * {
      box-sizing: border-box;
      margin: 0;

    body {
      font-family: Arial, sans-serif;

    .liste-recettes {

    .recette-card {

      padding: 17px;
      box-shadow: 0 4px 16px rgba(91, 70, 55, 0.08);

    .recette-card-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .recette-card h3 {
      color: #4d4038;
      font-size: 18px;

    }

    .recette-meta {

      line-height: 1.5;
    }

    .favori {
      border: none;
      background: #fff3ed;
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    .favori.active {
      background: #f5d7c7;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .badge {
      background: #eef4ea;
      color: #5d7355;
      border-radius: 12px;
      padding: 5px 8px;
      font-size: 11px;
    }

    .badge.peche {
      background: #f8e7dc;
      color: #9a6a51;
    }

    .ouvrir {
      display: block;
      width: 100%;
      border: none;
      background: #78936d;
      color: white;
      border-radius: 15px;
      padding: 12px;
      margin-top: 14px;

    }

    /* VIDE */

    .vide {
      background: white;
      border-radius: 22px;
      padding: 25px 18px;

    /* NAVIGATION */

    }

    .bottom-nav a.active {
      color: #66805d;

    }
  </style>

  <script>

    let recettes = [];

    let categorieActive = "Toutes";

    let recherche = "";


    const filtresActifs = {

      petite: false,

      vegetarien: false,

      batch: false,

      pre: false,

      post: false,

      gluten: false

    };


    /* --------------------------------------------------
       NORMALISATION
    -------------------------------------------------- */

    function normaliser(texte) {

      return String(texte || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[-_]/g, " ")
        .trim();

    }


    /* --------------------------------------------------
       PARAMETRES URL
    -------------------------------------------------- */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const typeRepas =
      params.get("type");

    const filtrePetite =
      params.get("petite");

    const filtreBatch =
      params.get("batch");

    const filtreTexture =
      params.get("texture");


    /* --------------------------------------------------
       CORRESPONDANCE TYPE REPAS
    -------------------------------------------------- */

    const correspondanceTypeRepas = {

      "petit-dejeuner":
        "Petit-déjeuner",

      "dejeuner":
        "Déjeuner",

      "diner":
        "Dîner",

      "collation":
        "Collation",

      "petite-douceur":
        "Petite douceur"

    };


    /* --------------------------------------------------
       INITIALISATION TYPE REPAS
    -------------------------------------------------- */

    if (
      typeRepas &&
      typeRepas !== "peu-importe" &&
      correspondanceTypeRepas[typeRepas]
    ) {

      categorieActive =
        correspondanceTypeRepas[typeRepas];

      afficherContexte(
        correspondanceTypeRepas[typeRepas]
      );

    }


    /* --------------------------------------------------
       PARAMETRE PETITE PORTION
    -------------------------------------------------- */

    if (
      filtrePetite === "true"
    ) {

      filtresActifs.petite = true;

      document
        .querySelector(
          '[data-filtre="petite"]'
        )
        .classList.add("active");

    }


    /* --------------------------------------------------
       PARAMETRE BATCH
    -------------------------------------------------- */

    if (
      filtreBatch === "true"
    ) {

      filtresActifs.batch = true;

      document
        .querySelector(
          '[data-filtre="batch"]'
        )
        .classList.add("active");

    }


    /* --------------------------------------------------
       CONTEXTE
    -------------------------------------------------- */

    function afficherContexte(type) {

      const bloc =
        document.getElementById(
          "contexte"
        );

      const titre =
        document.getElementById(
          "contexteTitre"
        );

      const texte =
        document.getElementById(
          "contexteTexte"
        );


      bloc.style.display = "block";


      titre.textContent =
        "✨ Vous recherchez des recettes pour : " +
        type;


      texte.textContent =
        "Les recettes affichées correspondent à votre choix.";

    }


    /* --------------------------------------------------
       ACTIVER LA CATEGORIE
    -------------------------------------------------- */

    document
      .querySelectorAll(
        ".categorie-btn"
      )
      .forEach(function(button) {

        if (
          normaliser(
            button.dataset.categorie
          ) ===
          normaliser(
            categorieActive
          )
        ) {

          document
            .querySelectorAll(
              ".categorie-btn"
            )
            .forEach(function(btn) {

              btn.classList.remove(
                "active"
              );

            });


          button.classList.add(
            "active"
          );

        }

      });


    /* --------------------------------------------------
       CHARGEMENT RECETTES
    -------------------------------------------------- */

    fetch("../recettes.json")

      .then(function(response) {

        if (!response.ok) {

          throw new Error(
            "Impossible de charger recettes.json"
          );

        }

        return response.json();

      })

      .then(function(data) {

        recettes =
          Array.isArray(data)
            ? data
            : [];


        afficherRecettes();

      })

      .catch(function(error) {

        console.error(error);


        document.getElementById(
          "listeRecettes"
        ).innerHTML = `

          <div class="vide">

            <div class="emoji">
              ⚠️
            </div>

            <p>
              Impossible de charger les recettes.
              Vérifiez que le fichier
              <strong>recettes.json</strong>
              est bien présent dans le dossier
              <strong>src</strong>.
            </p>

          </div>

        `;

      });


    /* --------------------------------------------------
       CATEGORIES
    -------------------------------------------------- */

    document
      .querySelectorAll(
        ".categorie-btn"
      )
      .forEach(function(button) {

        button.addEventListener(
          "click",
          function() {

            categorieActive =
              button.dataset.categorie;


            document
              .querySelectorAll(
                ".categorie-btn"
              )
              .forEach(function(btn) {

                btn.classList.remove(
                  "active"
                );

              });


            button.classList.add(
              "active"
            );


            afficherRecettes();

          }
        );

      });


    /* --------------------------------------------------
       FILTRES
    -------------------------------------------------- */

    document
      .querySelectorAll(
        ".filtre"
      )
      .forEach(function(button) {

        button.addEventListener(
          "click",
          function() {

            const filtre =
              button.dataset.filtre;


            filtresActifs[filtre] =
              !filtresActifs[filtre];


            button.classList.toggle(
              "active",
              filtresActifs[filtre]
            );


            afficherRecettes();

          }
        );

      });


    /* --------------------------------------------------
       RECHERCHE
    -------------------------------------------------- */

    document
      .getElementById("recherche")
      .addEventListener(
        "input",
        function(event) {

          recherche =
            normaliser(
              event.target.value
            );


          afficherRecettes();

        }
      );


    /* --------------------------------------------------
       FILTRAGE
    -------------------------------------------------- */

    function filtrerRecettes() {

      return recettes.filter(
        function(recette) {


          /* CATEGORIE */

          if (
            categorieActive !== "Toutes"
          ) {

            const categorieRecette =
              normaliser(
                recette.categorie
              );


            const categorieChoisie =
              normaliser(
                categorieActive
              );


            if (
              categorieRecette !==
              categorieChoisie
            ) {

              return false;

            }

          }


          /* RECHERCHE */

          if (recherche) {

            const texteRecherche =
              normaliser(

                (recette.nom || "") +
                " " +
                (recette.categorie || "") +
                " " +
                (recette.type || "") +
                " " +
                (
                  Array.isArray(
                    recette.envies
                  )
                    ? recette.envies.join(" ")
                    : ""
                )

              );


            if (
              !texteRecherche.includes(
                recherche
              )
            ) {

              return false;

            }

          }


          /* PETITE PORTION */

          if (
            filtresActifs.petite
          ) {

            if (
              !recette.petitAppetit &&
              !recette.portion &&
              !(
                recette.quantites &&
                recette.quantites.petite
              )
            ) {

              return false;

            }

          }


          /* VEGETARIEN */

          if (
            filtresActifs.vegetarien
          ) {

            if (
              !recette.vegetarien
            ) {

              return false;

            }

          }


          /* BATCH */

          if (
            filtresActifs.batch
          ) {

            if (
              !recette.batchCooking
            ) {

              return false;

            }

          }


          /* PRE-OPERATOIRE */

          if (
            filtresActifs.pre
          ) {

            if (
              !recette.preOperatoire
            ) {

              return false;

            }

          }


          /* POST-OPERATOIRE */

          if (
            filtresActifs.post
          ) {

            if (
              !recette.postOperatoire
            ) {

              return false;

            }

          }


          /* SANS GLUTEN */

          if (
            filtresActifs.gluten
          ) {

            if (
              !recette.sansGluten
            ) {

              return false;

            }

          }


          /* TEXTURE */

          if (filtreTexture) {

            const textureRecette =
              normaliser(
                recette.texture
              );


            const textureDemandee =
              normaliser(
                filtreTexture
              );


            if (
              textureRecette !==
              textureDemandee
            ) {

              return false;

            }

          }


          return true;

        }
      );

    }


    /* --------------------------------------------------
       AFFICHAGE
    -------------------------------------------------- */

    function afficherRecettes() {

      const liste =
        document.getElementById(
          "listeRecettes"
        );


      const resultat =
        filtrerRecettes();


      document.getElementById(
        "compteur"
      ).textContent =
        resultat.length +
        (
          resultat.length > 1
            ? " recettes"
            : " recette"
        );


      if (
        resultat.length === 0
      ) {

        liste.innerHTML = `

          <div class="vide">

            <div class="emoji">
              🥄
            </div>

            <p>
              Aucune recette ne correspond
              à vos critères pour le moment.
            </p>

            <button
              class="reset"
              onclick="reinitialiser()"
            >
              Voir toutes les recettes
            </button>

          </div>

        `;

        return;

      }


      liste.innerHTML =
        resultat
          .map(
            creerCarteRecette
          )
          .join("");

    }


    /* --------------------------------------------------
       CARTE RECETTE
    -------------------------------------------------- */

    function creerCarteRecette(
      recette
    ) {

      const favoris =
        JSON.parse(
          localStorage.getItem(
            "favoris"
          ) || "[]"
        );


      const estFavori =
        favoris.includes(
          recette.id
        );


      let badges = "";


      if (
        recette.petitAppetit
      ) {

        badges +=
          '<span class="badge">🥄 Petite assiette</span>';

      }


      if (
        recette.batchCooking
      ) {

        badges +=
          '<span class="badge">📦 Batch-cooking</span>';

      }


      if (
        recette.vegetarien
      ) {

        badges +=
          '<span class="badge">🥕 Végétarien</span>';

      }


      if (
        recette.preOperatoire
      ) {

        badges +=
          '<span class="badge">🌿 Pré-op</span>';

      }


      if (
        recette.postOperatoire
      ) {

        badges +=
          '<span class="badge peche">🌸 Post-op</span>';

      }


      if (
        recette.categorie ===
        "Petite douceur"
      ) {

        badges +=
          '<span class="badge">🍰 Petite douceur</span>';

      }


      return `

        <article class="recette-card">

          <div class="recette-card-top">

            <div>

              <h3>
                ${recette.nom || "Recette"}
              </h3>

              <div class="recette-meta">

                ${recette.categorie || ""}

                ${
                  recette.temps
                    ? " · ⏱️ " +
                      recette.temps +
                      " min"
                    : ""
                }

                ${
                  recette.proteines
                    ? " · 💪 " +
                      recette.proteines +
                      " g protéines"
                    : ""
                }

              </div>

            </div>


            <button
              class="favori ${
                estFavori
                  ? "active"
                  : ""
              }"
              onclick="toggleFavori('${recette.id}', event)"
              aria-label="Ajouter aux favoris"
            >

              ${
                estFavori
                  ? "❤️"
                  : "♡"
              }

            </button>

          </div>


          <div class="badges">

            ${badges}

          </div>


          <button
            class="ouvrir"
            onclick="ouvrirRecette('${recette.id}')"
          >

            Voir la recette →

          </button>

        </article>

      `;

    }


    /* --------------------------------------------------
       OUVRIR RECETTE
    -------------------------------------------------- */

    function ouvrirRecette(id) {

      window.location.href =
        "Recette.html?id=" +
        encodeURIComponent(id);

    }


    /* --------------------------------------------------
       FAVORIS
    -------------------------------------------------- */

    function toggleFavori(
      id,
      event
    ) {

      event.stopPropagation();


      let favoris =
        JSON.parse(
          localStorage.getItem(
            "favoris"
          ) || "[]"
        );


      if (
        favoris.includes(id)
      ) {

        favoris =
          favoris.filter(
            function(item) {

              return item !== id;

            }
          );

      } else {

        favoris.push(id);

      }


      localStorage.setItem(
        "favoris",
        JSON.stringify(favoris)
      );


      afficherRecettes();

    }


    /* --------------------------------------------------
       REINITIALISER
    -------------------------------------------------- */

    function reinitialiser() {

      categorieActive =
        "Toutes";


      recherche = "";


      document.getElementById(
        "recherche"
      ).value = "";


      Object.keys(
        filtresActifs
      ).forEach(
        function(cle) {

          filtresActifs[cle] =
            false;

        }
      );


      document
        .querySelectorAll(
          ".filtre"
        )
        .forEach(
          function(button) {

            button.classList.remove(
              "active"
            );

          }
        );


      document
        .querySelectorAll(
          ".categorie-btn"
        )
        .forEach(
          function(button) {

            button.classList.remove(
              "active"
            );

          }
        );


      document
        .querySelector(
          '[data-categorie="Toutes"]'
        )
        .classList.add(
          "active"
        );


      afficherRecettes();

    }

  </script>

</body>
</html>
