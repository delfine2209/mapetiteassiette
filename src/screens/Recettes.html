<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mes recettes - Ma Petite Assiette</title>

  <link rel="stylesheet" href="../style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f8f4ef;
      color: #3f4038;
    }

    button,
    input {
      font-family: inherit;
    }

    .page {
      max-width: 700px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    /* HERO */

    .hero {
      padding: 25px 20px 28px;
      border-radius: 0 0 32px 32px;
      background:
        linear-gradient(
          145deg,
          #f4dfd0 0%,
          #f5e9dc 45%,
          #dfe8d8 100%
        );
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #66675f;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 17px;
      background: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      margin-bottom: 16px;
    }

    .hero h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      font-weight: 800;
    }

    .hero p {
      margin: 9px 0 0;
      color: #686960;
      font-size: 15px;
      line-height: 1.5;
    }

    /* CONTENU */

    .content {
      padding: 20px;
    }

    /* RECHERCHE */

    .search-box {
      position: relative;
      margin-bottom: 18px;
    }

    .search-box span {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
    }

    .search-box input {
      width: 100%;
      height: 54px;
      border: 1px solid #e8e0d8;
      border-radius: 18px;
      background: white;
      padding: 0 16px 0 48px;
      font-size: 15px;
      outline: none;
      color: #3f4038;
      box-shadow: 0 5px 15px rgba(70,60,50,0.05);
    }

    .search-box input:focus {
      border-color: #a5b69d;
    }

    /* CATEGORIES */

    .section-title {
      margin: 10px 0 12px;
      font-size: 19px;
      font-weight: 800;
    }

    .categories {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 1px 12px;
      margin-bottom: 12px;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex: 0 0 auto;
      border: none;
      border-radius: 999px;
      background: white;
      color: #66675f;
      padding: 10px 15px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(70,60,50,0.05);
    }

    .category.active {
      background: #78956d;
      color: white;
    }

    /* FILTRES */

    .filters-box {
      background: white;
      border-radius: 22px;
      padding: 17px;
      border: 1px solid #eee7df;
      margin: 8px 0 22px;
      box-shadow: 0 5px 15px rgba(70,60,50,0.05);
    }

    .filters-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .filter {
      position: relative;
    }

    .filter input {
      position: absolute;
      opacity: 0;
    }

    .filter label {
      display: block;
      background: #f7f4ef;
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 11px 10px;
      font-size: 11px;
      line-height: 1.25;
      cursor: pointer;
    }

    .filter input:checked + label {
      background: #e5efe1;
      border-color: #b7c9af;
      color: #5d7654;
      font-weight: 700;
    }

    .reset {
      margin-top: 13px;
      width: 100%;
      border: none;
      background: transparent;
      color: #7b7c74;
      padding: 7px;
      font-size: 12px;
      cursor: pointer;
    }

    /* COMPTEUR */

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .results-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .count {
      background: #e5efe1;
      color: #5e7655;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* RECETTES */

    .recipes {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .recipe-card {
      position: relative;
      display: block;
      text-decoration: none;
      color: inherit;
      background: white;
      border-radius: 23px;
      padding: 17px;
      border: 1px solid #eee7df;
      box-shadow: 0 6px 18px rgba(70,60,50,0.07);
      transition: transform 0.15s ease;
    }

    .recipe-card:active {
      transform: scale(0.98);
    }

    .recipe-main {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .recipe-icon {
      width: 49px;
      height: 49px;
      flex: 0 0 49px;
      border-radius: 16px;
      background: #edf3e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .recipe-info {
      flex: 1;
      min-width: 0;
    }

    .recipe-category {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #78906e;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .recipe-name {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 800;
    }

    .arrow {
      color: #a0a098;
      font-size: 21px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 13px;
    }

    .badge {
      border-radius: 999px;
      padding: 6px 9px;
      background: #f5f2ed;
      color: #696a62;
      font-size: 10px;
    }

    .badge.green {
      background: #e5efe1;
      color: #5e7655;
    }

    .badge.peach {
      background: #f7e5d9;
      color: #8a6755;
    }

    .favorite {
      position: absolute;
      right: 14px;
      bottom: 13px;
      font-size: 19px;
      color: #b5b5ad;
    }

    /* VIDE */

    .empty {
      background: white;
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      border: 1px solid #eee7df;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .empty h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .empty p {
      margin: 0;
      color: #77786f;
      font-size: 14px;
      line-height: 1.5;
    }

    /* NAVIGATION */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, 100%);
      height: 72px;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid #e9e2da;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 100;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #77786f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
    }

    .bottom-nav a:nth-child(2) {
      color: #6f8b65;
      font-weight: 700;
    }

    .bottom-nav .nav-icon {
      font-size: 22px;
    }
  </style>
</head>

<body>

<div class="page">

  <!-- HERO -->

  <header class="hero">

    <a href="../../index.html" class="back">
      ← Accueil
    </a>

    <div class="logo">
      🍽️
    </div>

    <h1>
      Mes recettes
    </h1>

    <p>
      Toutes mes petites assiettes,
      à découvrir selon mes envies.
    </p>

  </header>


  <main class="content">

    <!-- RECHERCHE -->

    <div class="search-box">

      <span>🔎</span>

      <input
        type="search"
        id="search"
        placeholder="Rechercher une recette ou un ingrédient..."
        autocomplete="off"
      >

    </div>


    <!-- CATEGORIES -->

    <h2 class="section-title">
      Je cherche par catégorie
    </h2>

    <div class="categories">

      <button class="category active" data-category="Toutes">
        Toutes
      </button>

      <button class="category" data-category="Petit-déjeuner">
        Petit-déjeuner
      </button>

      <button class="category" data-category="Déjeuner">
        Déjeuner
      </button>

      <button class="category" data-category="Dîner">
        Dîner
      </button>

      <button class="category" data-category="Collation">
        Collation
      </button>

      <button class="category" data-category="Végétarien">
        Végétarien
      </button>

      <button class="category" data-category="Salades">
        Salades
      </button>

    </div>


    <!-- FILTRES -->

    <div class="filters-box">

      <div class="filters-title">
        Affiner ma recherche
      </div>

      <div class="filters">

        <div class="filter">
          <input type="checkbox" id="petite" value="petite">
          <label for="petite">
            🥄 Petite portion
          </label>
        </div>

        <div class="filter">
          <input type="checkbox" id="vegetarien" value="vegetarien">
          <label for="vegetarien">
            🌱 Végétarien
          </label>
        </div>

        <div class="filter">
          <input type="checkbox" id="batch" value="batch">
          <label for="batch">
            🍱 Batch-cooking
          </label>
        </div>

        <div class="filter">
          <input type="checkbox" id="preop" value="preop">
          <label for="preop">
            🌿 Pré-opératoire
          </label>
        </div>

        <div class="filter">
          <input type="checkbox" id="postop" value="postop">
          <label for="postop">
            🍽️ Post-opératoire
          </label>
        </div>

        <div class="filter">
          <input type="checkbox" id="gluten" value="gluten">
          <label for="gluten">
            🌾 Sans gluten
          </label>
        </div>

      </div>

      <button
        type="button"
        class="reset"
        onclick="reinitialiser()"
      >
        Réinitialiser les filtres
      </button>

    </div>


    <!-- COMPTEUR -->

    <div class="results-header">

      <h2>
        Mes recettes
      </h2>

      <span
        class="count"
        id="count"
      >
        0 recette
      </span>

    </div>


    <!-- LISTE -->

    <div
      id="recipes"
      class="recipes"
    ></div>

  </main>

</div>


<!-- NAVIGATION -->

<nav class="bottom-nav">

  <a href="../../index.html">
    <span class="nav-icon">⌂</span>
    <span>Accueil</span>
  </a>

  <a href="Recettes.html">
    <span class="nav-icon">🍴</span>
    <span>Recettes</span>
  </a>

  <a href="Favoris.html">
    <span class="nav-icon">❤️</span>
    <span>Favoris</span>
  </a>

  <a href="MonProfil.html">
    <span class="nav-icon">👤</span>
    <span>Profil</span>
  </a>

</nav>


<script>

let recettes = [];

let categorieActive = "Toutes";


/* --------------------------------------------------
   CHARGEMENT
-------------------------------------------------- */

async function chargerRecettes() {

  try {

    const response =
      await fetch("../recettes.json");

    if (!response.ok) {
      throw new Error(
        "Impossible de charger les recettes"
      );
    }

    recettes = await response.json();

    afficherRecettes();

  } catch (error) {

    console.error(error);

    document.getElementById("recipes").innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          😕
        </div>

        <h2>
          Oups…
        </h2>

        <p>
          Impossible de charger les recettes
          pour le moment.
        </p>

      </div>

    `;
  }
}


/* --------------------------------------------------
   CATEGORIE
-------------------------------------------------- */

document
  .querySelectorAll(".category")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".category")
          .forEach(btn =>
            btn.classList.remove("active")
          );

        button.classList.add("active");

        categorieActive =
          button.dataset.category;

        afficherRecettes();
      }
    );

  });


/* --------------------------------------------------
   RECHERCHE + FILTRES
-------------------------------------------------- */

document
  .getElementById("search")
  .addEventListener(
    "input",
    afficherRecettes
  );


document
  .querySelectorAll(
    '.filter input[type="checkbox"]'
  )
  .forEach(input => {

    input.addEventListener(
      "change",
      afficherRecettes
    );

  });


/* --------------------------------------------------
   FILTRAGE
-------------------------------------------------- */

function filtrerRecettes() {

  const recherche =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  let resultat = [...recettes];


  /* RECHERCHE */

  if (recherche) {

    resultat =
      resultat.filter(recette => {

        const texte = (

          (recette.nom || "") +
          " " +
          (recette.categorie || "") +
          " " +
          (recette.type || "") +
          " " +
          JSON.stringify(
            recette.ingredients || []
          )

        ).toLowerCase();

        return texte.includes(recherche);
      });

  }


  /* CATEGORIE */

  if (categorieActive !== "Toutes") {

    resultat =
      resultat.filter(recette => {

        const categorie =
          (recette.categorie || "")
            .toLowerCase();

        if (
          categorieActive ===
          "Végétarien"
        ) {
          return recette.vegetarien === true;
        }

        if (
          categorieActive ===
          "Salades"
        ) {
          return (
            categorie.includes("salade") ||
            categorie.includes("bowl")
          );
        }

        return categorie
          .includes(
            categorieActive.toLowerCase()
          );

      });

  }


  /* PETITE PORTION */

  if (
    document.getElementById("petite").checked
  ) {

    resultat =
      resultat.filter(
        recette =>
          recette.petitAppetit === true
      );

  }


  /* VEGETARIEN */

  if (
    document.getElementById("vegetarien").checked
  ) {

    resultat =
      resultat.filter(
        recette =>
          recette.vegetarien === true
      );

  }


  /* BATCH COOKING */

  if (
    document.getElementById("batch").checked
  ) {

    resultat =
      resultat.filter(
        recette =>
          recette.batchCooking === true
      );

  }


  /* PRE OPERATOIRE */

  if (
    document.getElementById("preop").checked
  ) {

    resultat =
      resultat.filter(
        recette =>
          recette.preOperatoire === true
      );

  }


  /* POST OPERATOIRE */

  if (
    document.getElementById("postop").checked
  ) {

    resultat =
      resultat.filter(
        recette =>
          recette.postOperatoire === true
      );

  }


  /* SANS GLUTEN */

  if (
    document.getElementById("gluten").checked
  ) {

    resultat =
      resultat.filter(
        recette =>
          recette.sansGluten === true
      );

  }


  return resultat;
}


/* --------------------------------------------------
   AFFICHAGE
-------------------------------------------------- */

function afficherRecettes() {

  const resultat =
    filtrerRecettes();

  const container =
    document.getElementById("recipes");

  const count =
    document.getElementById("count");


  count.textContent =
    resultat.length === 1
      ? "1 recette"
      : `${resultat.length} recettes`;


  if (resultat.length === 0) {

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🥣
        </div>

        <h2>
          Aucune recette trouvée
        </h2>

        <p>
          Essayez de modifier votre recherche
          ou de retirer un filtre.
        </p>

      </div>

    `;

    return;
  }


  container.innerHTML = "";


  resultat.forEach(recette => {

    const carte =
      document.createElement("a");

    carte.className =
      "recipe-card";

    carte.href =
      `Recette.html?id=${encodeURIComponent(
        recette.id
      )}`;


    /* ICONE */

    let icon = "🍽️";

    const categorie =
      (recette.categorie || "")
        .toLowerCase();

    if (
      categorie.includes("dessert") ||
      categorie.includes("collation") ||
      categorie.includes("petit")
    ) {
      icon = "🍰";
    }

    else if (
      recette.vegetarien === true
    ) {
      icon = "🌱";
    }

    else if (
      categorie.includes("salade") ||
      categorie.includes("bowl")
    ) {
      icon = "🥗";
    }

    else if (
      categorie.includes("poisson")
    ) {
      icon = "🐟";
    }


    /* FAVORI */

    let favoris = [];

    try {

      favoris =
        JSON.parse(
          localStorage.getItem(
            "favoris"
          ) || "[]"
        );

    } catch {

      favoris = [];

    }


    const estFavori =
      favoris.includes(recette.id);


    carte.innerHTML = `

      <div class="recipe-main">

        <div class="recipe-icon">
          ${icon}
        </div>

        <div class="recipe-info">

          <div class="recipe-category">
            ${recette.categorie || "Recette"}
          </div>

          <h3 class="recipe-name">
            ${recette.nom}
          </h3>

        </div>

        <div class="arrow">
          ›
        </div>

      </div>


      <div class="meta">

        <span class="badge">
          ⏱️ ${recette.temps || "—"} min
        </span>

        <span class="badge green">
          🥄 ${recette.portion || "Petite portion"}
        </span>

        ${
          recette.proteines
            ? `
              <span class="badge peach">
                💪 ${recette.proteines} g
              </span>
            `
            : ""
        }

        ${
          recette.batchCooking
            ? `
              <span class="badge green">
                🍱 Batch
              </span>
            `
            : ""
        }

      </div>


      <div class="favorite">
        ${estFavori ? "❤️" : "♡"}
      </div>

    `;


    container.appendChild(carte);

  });

}


/* --------------------------------------------------
   RESET
-------------------------------------------------- */

function reinitialiser() {

  document.getElementById("search").value = "";

  categorieActive = "Toutes";


  document
    .querySelectorAll(".category")
    .forEach(button => {

      button.classList.remove("active");

      if (
        button.dataset.category ===
        "Toutes"
      ) {
        button.classList.add("active");
      }

    });


  document
    .querySelectorAll(
      '.filter input[type="checkbox"]'
    )
    .forEach(input => {

      input.checked = false;

    });


  afficherRecettes();
}


/* --------------------------------------------------
   DEMARRAGE
-------------------------------------------------- */

chargerRecettes();

</script>

</body>
</html>
