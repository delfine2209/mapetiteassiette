<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recettes - Ma Petite Assiette</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fffaf5;
      color: #4d4038;
      padding-bottom: 85px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      background: linear-gradient(135deg, #f6d9c8, #dce8d5);
      padding: 28px 20px 30px;
      border-radius: 0 0 30px 30px;
    }

    .retour {
      display: inline-block;
      color: #5b7153;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: 28px;
      color: #4d4038;
      margin-bottom: 8px;
    }

    .hero p {
      line-height: 1.5;
      font-size: 15px;
    }

    .contenu {
      padding: 20px 16px;
      max-width: 700px;
      margin: auto;
    }

    /* =========================
       CONTEXTE
    ========================= */

    .contexte {
      display: none;
      background: #eef5e9;
      border: 1px solid #d5e4cc;
      color: #506448;
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 18px;
      line-height: 1.4;
      font-size: 14px;
    }

    .contexte strong {
      display: block;
      margin-bottom: 3px;
      font-size: 15px;
    }

    /* =========================
       RECHERCHE
    ========================= */

    .recherche {
      margin-bottom: 18px;
    }

    .recherche input {
      width: 100%;
      border: 1px solid #e2d6cd;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 15px;
      background: white;
      outline: none;
    }

    .recherche input:focus {
      border-color: #9db58f;
    }

    /* =========================
       TITRES
    ========================= */

    .titre-section {
      font-size: 19px;
      margin: 20px 0 12px;
      color: #4d4038;
    }

    /* =========================
       CATEGORIES
    ========================= */

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .categorie-btn {
      border: none;
      background: #f2e8df;
      color: #65574e;
      border-radius: 22px;
      padding: 10px 14px;
      white-space: nowrap;
      cursor: pointer;
      font-size: 14px;
    }

    .categorie-btn.active {
      background: #78936d;
      color: white;
    }

    /* =========================
       FILTRES
    ========================= */

    .filtres {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .filtre {
      border: 1px solid #dfd1c6;
      background: white;
      color: #65574e;
      border-radius: 18px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .filtre.active {
      background: #f0d8c9;
      border-color: #e1bda8;
    }

    /* =========================
       TRI
    ========================= */

    .tri {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .tri-btn {
      border: 1px solid #dfd1c6;
      background: white;
      color: #65574e;
      border-radius: 18px;
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .tri-btn.active {
      background: #dce8d5;
      border-color: #9db58f;
      color: #506448;
      font-weight: bold;
    }

    /* =========================
       RESULTATS
    ========================= */

    .resultats-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 22px 0 12px;
      gap: 10px;
    }

    .resultats-header h2 {
      font-size: 19px;
    }

    #compteur {
      font-size: 13px;
      color: #85756b;
      text-align: right;
    }

    .liste-recettes {
      display: grid;
      gap: 14px;
    }

    /* =========================
       CARTE RECETTE
    ========================= */

    .recette-card {
      background: white;
      border-radius: 22px;
      padding: 17px;
      box-shadow: 0 4px 16px rgba(91, 70, 55, 0.08);
      border: 1px solid #f0e5dd;
    }

    .recette-card-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .recette-card h3 {
      color: #4d4038;
      font-size: 18px;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .recette-meta {
      font-size: 13px;
      color: #8a7a70;
      line-height: 1.5;
    }

    .favori {
      border: none;
      background: #fff3ed;
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    .favori.active {
      background: #f5d7c7;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .badge {
      background: #eef4ea;
      color: #5d7355;
      border-radius: 12px;
      padding: 5px 8px;
      font-size: 11px;
    }

    .badge.peche {
      background: #f8e7dc;
      color: #9a6a51;
    }

    .badge.proteines {
      background: #f0e8dc;
      color: #78634e;
    }

    .ouvrir {
      display: block;
      width: 100%;
      border: none;
      background: #78936d;
      color: white;
      border-radius: 15px;
      padding: 12px;
      margin-top: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* =========================
       VIDE
    ========================= */

    .vide {
      background: white;
      border-radius: 22px;
      padding: 25px 18px;
      text-align: center;
      color: #75665d;
      box-shadow: 0 4px 16px rgba(91, 70, 55, 0.06);
    }

    .vide .emoji {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .vide p {
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .reset {
      border: none;
      background: #78936d;
      color: white;
      padding: 11px 18px;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72px;
      background: rgba(255, 250, 245, 0.97);
      border-top: 1px solid #eadfd7;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #82736a;
      font-size: 11px;
      text-align: center;
    }

    .bottom-nav a span {
      display: block;
      font-size: 22px;
      margin-bottom: 3px;
    }

    .bottom-nav a.active {
      color: #66805d;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <!-- =========================
       HERO
  ========================= -->

  <header class="hero">

    <a class="retour" href="../../index.html">
      ← Accueil
    </a>

    <h1>🍽️ Mes recettes</h1>

    <p>
      Des idées simples, gourmandes et adaptées à votre façon de manger.
    </p>

  </header>


  <main class="contenu">


    <!-- =========================
         CONTEXTE
    ========================= -->

    <div class="contexte" id="contexte">

      <strong id="contexteTitre"></strong>

      <span id="contexteTexte"></span>

    </div>


    <!-- =========================
         RECHERCHE
    ========================= -->

    <div class="recherche">

      <input
        type="search"
        id="recherche"
        placeholder="🔎 Rechercher une recette..."
      >

    </div>


    <!-- =========================
         CATEGORIES
    ========================= -->

    <h2 class="titre-section">
      Quel repas ?
    </h2>


    <div class="categories">

      <button
        class="categorie-btn active"
        data-categorie="Toutes">
        Toutes
      </button>

      <button
        class="categorie-btn"
        data-categorie="Petit-déjeuner">
        🌅 Petit-déjeuner
      </button>

      <button
        class="categorie-btn"
        data-categorie="Déjeuner">
        🥗 Déjeuner
      </button>

      <button
        class="categorie-btn"
        data-categorie="Dîner">
        🍽️ Dîner
      </button>

      <button
        class="categorie-btn"
        data-categorie="Collation">
        🍎 Collation
      </button>

      <button
        class="categorie-btn"
        data-categorie="Petite douceur">
        🍰 Petite douceur
      </button>

      <button
        class="categorie-btn"
        data-categorie="Végétarien">
        🥕 Végétarien
      </button>

      <button
        class="categorie-btn"
        data-categorie="Salades">
        🥗 Salades
      </button>

    </div>


    <!-- =========================
         FILTRES
    ========================= -->

    <h2 class="titre-section">
      Affiner mes recettes
    </h2>


    <div class="filtres">

      <button
        class="filtre"
        data-filtre="petite">
        🥄 Petite portion
      </button>

      <button
        class="filtre"
        data-filtre="vegetarien">
        🥕 Végétarien
      </button>

      <button
        class="filtre"
        data-filtre="batch">
        📦 Batch-cooking
      </button>

      <button
        class="filtre"
        data-filtre="pre">
        🌿 Pré-opératoire
      </button>

      <button
        class="filtre"
        data-filtre="post">
        🌸 Post-opératoire
      </button>

      <button
        class="filtre"
        data-filtre="gluten">
        🌾 Sans gluten
      </button>

    </div>


    <!-- =========================
         TRI PROTEINES
    ========================= -->

    <h2 class="titre-section">
      💪 Trier par protéines
    </h2>


    <div class="tri">

      <button
        class="tri-btn active"
        data-tri="defaut">
        ↕️ Ordre du catalogue
      </button>

      <button
        class="tri-btn"
        data-tri="croissant">
        ↗️ Protéines croissantes
      </button>

      <button
        class="tri-btn"
        data-tri="decroissant">
        ↘️ Protéines décroissantes
      </button>

    </div>


    <!-- =========================
         RESULTATS
    ========================= -->

    <div class="resultats-header">

      <h2>
        Mes recettes
      </h2>

      <span id="compteur">
        0 recette
      </span>

    </div>


    <div
      id="listeRecettes"
      class="liste-recettes">
    </div>


  </main>


  <!-- =========================
       NAVIGATION
  ========================= -->

  <nav class="bottom-nav">

    <a href="../../index.html">

      <span>🏠</span>

      Accueil

    </a>


    <a
      href="Recettes.html"
      class="active">

      <span>🍽️</span>

      Recettes

    </a>


    <a href="Favoris.html">

      <span>❤️</span>

      Favoris

    </a>


    <a href="MonProfil.html">

      <span>👤</span>

      Profil

    </a>

  </nav>


  <script>

    /* ==================================================
       VARIABLES
    ================================================== */

    let recettes = [];

    let categorieActive = "Toutes";

    let recherche = "";

    let triActif = "defaut";


    const filtresActifs = {

      petite: false,

      vegetarien: false,

      batch: false,

      pre: false,

      post: false,

      gluten: false

    };


    /* ==================================================
       NORMALISATION
    ================================================== */

    function normaliser(texte) {

      return String(texte || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[-_]/g, " ")
        .trim();

    }


    /* ==================================================
       PARAMETRES URL
    ================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const typeRepas =
      params.get("type");

    const filtrePetite =
      params.get("petite");

    const filtreBatch =
      params.get("batch");

    const filtreTexture =
      params.get("texture");


    /* ==================================================
       CORRESPONDANCE TYPE REPAS
    ================================================== */

    const correspondanceTypeRepas = {

      "petit-dejeuner":
        "Petit-déjeuner",

      "dejeuner":
        "Déjeuner",

      "diner":
        "Dîner",

      "collation":
        "Collation",

      "petite-douceur":
        "Petite douceur"

    };


    /* ==================================================
       INITIALISATION TYPE REPAS
    ================================================== */

    if (

      typeRepas &&

      typeRepas !== "peu-importe" &&

      correspondanceTypeRepas[typeRepas]

    ) {

      categorieActive =
        correspondanceTypeRepas[typeRepas];


      afficherContexte(
        correspondanceTypeRepas[typeRepas]
      );

    }


    /* ==================================================
       PARAMETRE PETITE PORTION
    ================================================== */

    if (

      filtrePetite === "true"

    ) {

      filtresActifs.petite = true;


      const bouton =
        document.querySelector(
          '[data-filtre="petite"]'
        );


      if (bouton) {

        bouton.classList.add("active");

      }

    }


    /* ==================================================
       PARAMETRE BATCH
    ================================================== */

    if (

      filtreBatch === "true"

    ) {

      filtresActifs.batch = true;


      const bouton =
        document.querySelector(
          '[data-filtre="batch"]'
        );


      if (bouton) {

        bouton.classList.add("active");

      }

    }


    /* ==================================================
       CONTEXTE
    ================================================== */

    function afficherContexte(type) {

      const bloc =
        document.getElementById(
          "contexte"
        );


      const titre =
        document.getElementById(
          "contexteTitre"
        );


      const texte =
        document.getElementById(
          "contexteTexte"
        );


      bloc.style.display =
        "block";


      titre.textContent =
        "✨ Vous recherchez des recettes pour : " +
        type;


      texte.textContent =
        "Les recettes affichées correspondent à votre choix.";

    }


    /* ==================================================
       ACTIVER LA CATEGORIE
    ================================================== */

    document
      .querySelectorAll(
        ".categorie-btn"
      )
      .forEach(
        function(button) {

          if (

            normaliser(
              button.dataset.categorie
            ) ===

            normaliser(
              categorieActive
            )

          ) {

            document
              .querySelectorAll(
                ".categorie-btn"
              )
              .forEach(
                function(btn) {

                  btn.classList.remove(
                    "active"
                  );

                }
              );


            button.classList.add(
              "active"
            );

          }

        }
      );


    /* ==================================================
       CHARGEMENT RECETTES
    ================================================== */

    fetch("../recettes.json")

      .then(
        function(response) {

          if (!response.ok) {

            throw new Error(
              "Impossible de charger recettes.json"
            );

          }


          return response.json();

        }
      )

      .then(
        function(data) {

          recettes =
            Array.isArray(data)
              ? data
              : [];


          afficherRecettes();

        }
      )

      .catch(
        function(error) {

          console.error(error);


          document.getElementById(
            "listeRecettes"
          ).innerHTML = `

            <div class="vide">

              <div class="emoji">
                ⚠️
              </div>

              <p>
                Impossible de charger les recettes.
                Vérifiez que le fichier
                <strong>recettes.json</strong>
                est bien présent dans le dossier
                <strong>src</strong>.
              </p>

            </div>

          `;

        }
      );


    /* ==================================================
       CATEGORIES
    ================================================== */

    document
      .querySelectorAll(
        ".categorie-btn"
      )
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              categorieActive =
                button.dataset.categorie;


              document
                .querySelectorAll(
                  ".categorie-btn"
                )
                .forEach(
                  function(btn) {

                    btn.classList.remove(
                      "active"
                    );

                  }
                );


              button.classList.add(
                "active"
              );


              afficherRecettes();

            }
          );

        }
      );


    /* ==================================================
       FILTRES
    ================================================== */

    document
      .querySelectorAll(
        ".filtre"
      )
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              const filtre =
                button.dataset.filtre;


              filtresActifs[filtre] =
                !filtresActifs[filtre];


              button.classList.toggle(
                "active",
                filtresActifs[filtre]
              );


              afficherRecettes();

            }
          );

        }
      );


    /* ==================================================
       TRI PAR PROTEINES
    ================================================== */

    document
      .querySelectorAll(
        ".tri-btn"
      )
      .forEach(
        function(button) {

          button.addEventListener(
            "click",
            function() {

              triActif =
                button.dataset.tri;


              document
                .querySelectorAll(
                  ".tri-btn"
                )
                .forEach(
                  function(btn) {

                    btn.classList.remove(
                      "active"
                    );

                  }
                );


              button.classList.add(
                "active"
              );


              afficherRecettes();

            }
          );

        }
      );


    /* ==================================================
       RECHERCHE
    ================================================== */

    document
      .getElementById("recherche")
      .addEventListener(
        "input",
        function(event) {

          recherche =
            normaliser(
              event.target.value
            );


          afficherRecettes();

        }
      );


    /* ==================================================
       VALEUR DES PROTEINES
    ================================================== */

    function obtenirProteines(recette) {

      if (
        recette.proteines === null ||
        recette.proteines === undefined ||
        recette.proteines === ""
      ) {

        return null;

      }


      /*
        On accepte :
        15
        "15"
        "15 g"
        "15g"
        "15,5"
        "15.5"
      */

      const texte =
        String(
          recette.proteines
        )
        .replace(",", ".");


      const correspondance =
        texte.match(
          /-?\d+(?:\.\d+)?/
        );


      if (!correspondance) {

        return null;

      }


      const valeur =
        parseFloat(
          correspondance[0]
        );


      return Number.isFinite(
        valeur
      )
        ? valeur
        : null;

    }


    /* ==================================================
       FILTRAGE
    ================================================== */

    function filtrerRecettes() {

      const resultat =
        recettes.filter(
          function(recette) {


            /* ------------------------------------------
               CATEGORIE
            ------------------------------------------ */

            if (
              categorieActive !==
              "Toutes"
            ) {

              const categorieRecette =
                normaliser(
                  recette.categorie
                );


              const categorieChoisie =
                normaliser(
                  categorieActive
                );


              /*
                Pour les salades :
                certaines recettes sont classées
                "Salade complète" et non simplement
                "Salades".
              */

              if (
                categorieChoisie ===
                "salades"
              ) {

                const nom =
                  normaliser(
                    recette.nom
                  );


                const type =
                  normaliser(
                    recette.type
                  );


                if (

                  !nom.includes(
                    "salade"
                  ) &&

                  !categorieRecette.includes(
                    "salade"
                  ) &&

                  !type.includes(
                    "salade"
                  )

                ) {

                  return false;

                }

              }

              else if (

                categorieRecette !==
                categorieChoisie

              ) {

                return false;

              }

            }


            /* ------------------------------------------
               RECHERCHE
            ------------------------------------------ */

            if (recherche) {

              const texteRecherche =
                normaliser(

                  (recette.nom || "") +
                  " " +
                  (recette.categorie || "") +
                  " " +
                  (recette.type || "") +
                  " " +
                  (
                    Array.isArray(
                      recette.envies
                    )
                      ? recette.envies.join(" ")
                      : ""
                  )

                );


              if (
                !texteRecherche.includes(
                  recherche
                )
              ) {

                return false;

              }

            }


            /* ------------------------------------------
               PETITE PORTION
            ------------------------------------------ */

            if (
              filtresActifs.petite
            ) {

              if (

                !recette.petitAppetit &&

                !recette.portion &&

                !(
                  recette.quantites &&

                  recette.quantites.petite
                )

              ) {

                return false;

              }

            }


            /* ------------------------------------------
               VEGETARIEN
            ------------------------------------------ */

            if (
              filtresActifs.vegetarien
            ) {

              if (
                !recette.vegetarien
              ) {

                return false;

              }

            }


            /* ------------------------------------------
               BATCH
            ------------------------------------------ */

            if (
              filtresActifs.batch
            ) {

              if (
                !recette.batchCooking
              ) {

                return false;

              }

            }


            /* ------------------------------------------
               PRE-OPERATOIRE
            ------------------------------------------ */

            if (
              filtresActifs.pre
            ) {

              if (
                !recette.preOperatoire
              ) {

                return false;

              }

            }


            /* ------------------------------------------
               POST-OPERATOIRE
            ------------------------------------------ */

            if (
              filtresActifs.post
            ) {

              if (
                !recette.postOperatoire
              ) {

                return false;

              }

            }


            /* ------------------------------------------
               SANS GLUTEN
            ------------------------------------------ */

            if (
              filtresActifs.gluten
            ) {

              if (
                !recette.sansGluten
              ) {

                return false;

              }

            }


            /* ------------------------------------------
               TEXTURE
            ------------------------------------------ */

            if (
              filtreTexture
            ) {

              const textureRecette =
                normaliser(
                  recette.texture
                );


              const textureDemandee =
                normaliser(
                  filtreTexture
                );


              if (
                textureRecette !==
                textureDemandee
              ) {

                return false;

              }

            }


            return true;

          }
        );


      /* ==================================================
         TRI DES RESULTATS
      ================================================== */

      if (
        triActif ===
        "croissant"
      ) {

        resultat.sort(
          function(a, b) {

            const proteinesA =
              obtenirProteines(a);

            const proteinesB =
              obtenirProteines(b);


            /*
              Les recettes sans protéines
              sont placées à la fin.
            */

            if (
              proteinesA === null &&
              proteinesB === null
            ) {

              return 0;

            }


            if (
              proteinesA === null
            ) {

              return 1;

            }


            if (
              proteinesB === null
            ) {

              return -1;

            }


            return (
              proteinesA -
              proteinesB
            );

          }
        );

      }


      if (
        triActif ===
        "decroissant"
      ) {

        resultat.sort(
          function(a, b) {

            const proteinesA =
              obtenirProteines(a);

            const proteinesB =
              obtenirProteines(b);


            /*
              Les recettes sans protéines
              sont placées à la fin.
            */

            if (
              proteinesA === null &&
              proteinesB === null
            ) {

              return 0;

            }


            if (
              proteinesA === null
            ) {

              return 1;

            }


            if (
              proteinesB === null
            ) {

              return -1;

            }


            return (
              proteinesB -
              proteinesA
            );

          }
        );

      }


      return resultat;

    }


    /* ==================================================
       AFFICHAGE
    ================================================== */

    function afficherRecettes() {

      const liste =
        document.getElementById(
          "listeRecettes"
        );


      const resultat =
        filtrerRecettes();


      document.getElementById(
        "compteur"
      ).textContent =
        resultat.length +
        (
          resultat.length > 1
            ? " recettes"
            : " recette"
        );


      if (
        resultat.length === 0
      ) {

        liste.innerHTML = `

          <div class="vide">

            <div class="emoji">
              🥄
            </div>

            <p>
              Aucune recette ne correspond
              à vos critères pour le moment.
            </p>

            <button
              class="reset"
              onclick="reinitialiser()"
            >
              Voir toutes les recettes
            </button>

          </div>

        `;

        return;

      }


      liste.innerHTML =
        resultat
          .map(
            creerCarteRecette
          )
          .join("");

    }


    /* ==================================================
       CARTE RECETTE
    ================================================== */

    function creerCarteRecette(
      recette
    ) {

      const favoris =
        JSON.parse(
          localStorage.getItem(
            "favoris"
          ) || "[]"
        );


      const estFavori =
        favoris.includes(
          recette.id
        );


      let badges = "";


      if (
        recette.petitAppetit
      ) {

        badges +=
          '<span class="badge">🥄 Petite assiette</span>';

      }


      if (
        recette.batchCooking
      ) {

        badges +=
          '<span class="badge">📦 Batch-cooking</span>';

      }


      if (
        recette.vegetarien
      ) {

        badges +=
          '<span class="badge">🥕 Végétarien</span>';

      }


      if (
        recette.preOperatoire
      ) {

        badges +=
          '<span class="badge">🌿 Pré-op</span>';

      }


      if (
        recette.postOperatoire
      ) {

        badges +=
          '<span class="badge peche">🌸 Post-op</span>';

      }


      if (
        recette.categorie ===
        "Petite douceur"
      ) {

        badges +=
          '<span class="badge">🍰 Petite douceur</span>';

      }


      const proteines =
        obtenirProteines(
          recette
        );


      if (
        proteines !== null
      ) {

        badges +=
          '<span class="badge proteines">💪 ' +
          proteines +
          ' g protéines</span>';

      }


      return `

        <article class="recette-card">

          <div class="recette-card-top">

            <div>

              <h3>
                ${recette.nom || "Recette"}
              </h3>

              <div class="recette-meta">

                ${recette.categorie || ""}

                ${
                  recette.temps
                    ? " · ⏱️ " +
                      recette.temps +
                      " min"
                    : ""
                }

              </div>

            </div>


            <button
              class="favori ${
                estFavori
                  ? "active"
                  : ""
              }"
              onclick="toggleFavori('${recette.id}', event)"
              aria-label="Ajouter aux favoris"
            >

              ${
                estFavori
                  ? "❤️"
                  : "♡"
              }

            </button>

          </div>


          <div class="badges">

            ${badges}

          </div>


          <button
            class="ouvrir"
            onclick="ouvrirRecette('${recette.id}')"
          >

            Voir la recette →

          </button>

        </article>

      `;

    }


    /* ==================================================
       OUVRIR RECETTE
    ================================================== */

    function ouvrirRecette(id) {

      window.location.href =
        "Recette.html?id=" +
        encodeURIComponent(id);

    }


    /* ==================================================
       FAVORIS
    ================================================== */

    function toggleFavori(
      id,
      event
    ) {

      event.stopPropagation();


      let favoris =
        JSON.parse(
          localStorage.getItem(
            "favoris"
          ) || "[]"
        );


      if (
        favoris.includes(id)
      ) {

        favoris =
          favoris.filter(
            function(item) {

              return item !== id;

            }
          );

      }

      else {

        favoris.push(id);

      }


      localStorage.setItem(
        "favoris",
        JSON.stringify(favoris)
      );


      afficherRecettes();

    }


    /* ==================================================
       REINITIALISER
    ================================================== */

    function reinitialiser() {

      categorieActive =
        "Toutes";


      recherche = "";


      triActif =
        "defaut";


      document.getElementById(
        "recherche"
      ).value = "";


      Object.keys(
        filtresActifs
      ).forEach(
        function(cle) {

          filtresActifs[cle] =
            false;

        }
      );


      document
        .querySelectorAll(
          ".filtre"
        )
        .forEach(
          function(button) {

            button.classList.remove(
              "active"
            );

          }
        );


      document
        .querySelectorAll(
          ".tri-btn"
        )
        .forEach(
          function(button) {

            button.classList.remove(
              "active"
            );

          }
        );


      document
        .querySelector(
          '[data-tri="defaut"]'
        )
        .classList.add(
          "active"
        );


      document
        .querySelectorAll(
          ".categorie-btn"
        )
        .forEach(
          function(button) {

            button.classList.remove(
              "active"
            );

          }
        );


      document
        .querySelector(
          '[data-categorie="Toutes"]'
        )
        .classList.add(
          "active"
        );


      afficherRecettes();

    }

  </script>

</body>
