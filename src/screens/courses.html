  <style>

    * {
      box-sizing: border-box;

      font-family: Arial, sans-serif;

    }

<body>

<header class="hero">

  <div class="emoji">🛒</div>

  <h1>Mes Courses</h1>

  <p>
    Tous les ingrédients nécessaires à vos menus,
    regroupés automatiquement.
  </p>

</header>


<main class="container">


  <!-- RESUME -->

  <section class="section">

    <div
      class="summary"
      id="resume"
    >
      Chargement de votre liste...
    </div>

    <input
      type="search"
      id="recherche"
      class="search"
      placeholder="🔎 Rechercher un ingrédient..."
      oninput="afficherIngredients()"
    >

    <div class="actions">

      <button
        class="btn btn-primary"
        onclick="toutCocher()"
      >
        ☑️ Tout cocher
      </button>

      <button
        class="btn btn-secondary"
        onclick="toutDecocher()"
      >
        ⬜ Tout décocher
      </button>

    </div>

  </section>


  <!-- RECETTES -->

  <section class="section">

    <h2>🍽️ Recettes concernées</h2>

    <div id="recettesSources"></div>

  </section>


  <!-- INGREDIENTS -->

  <section class="section">

    <h2>🥕 Ma liste de courses</h2>

    <div id="ingredients">
      Chargement...
    </div>

    <button
      class="btn btn-finish"
      onclick="coursesTerminees()"
    >
      ✅ Courses terminées
    </button>

  </section>


</main>


<div
  id="message"
  class="message hidden"
></div>


<nav class="bottom-nav">

  <a href="../../index.html">
    <span>🏠</span>
    Accueil
  </a>

  <a href="Recettes.html">
    <span>🍴</span>
    Recettes
  </a>

  <a href="MesMenus.html">
    <span>📋</span>
    Mes Menus
  </a>

  <a href="courses.html">
    <span>🛒</span>
    Mes Courses
  </a>

</nav>


<script>

  let recettesCatalogue = [];

  let recettesSelectionnees = [];

  let ingredientsCourses = [];

  let casesCochees =
    JSON.parse(
      localStorage.getItem(
        "ingredientsCoursesCoches"
      ) || "[]"
    );


  /* =====================================================
     CHARGEMENT
  ===================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    charger
  );


  async function charger() {

    try {

      const response =
        await fetch("../recettes.json");

      if (!response.ok) {
        throw new Error();
      }

      recettesCatalogue =
        await response.json();

      chargerRecettesSelectionnees();

      construireListeCourses();

      afficherRecettesSources();

      afficherIngredients();

    } catch (error) {

      document.getElementById(
        "ingredients"
      ).innerHTML = `
        <div class="empty">
          ❌ Impossible de charger les recettes.
        </div>
      `;

    }

  }


  /* =====================================================
     RECUPERATION DES RECETTES DES MENUS
  ===================================================== */

  function chargerRecettesSelectionnees() {

    const ids = [];

    /*
      Planning de la semaine
    */

    const planning =
      JSON.parse(
        localStorage.getItem(
          "planningSemaine"
        ) || "{}"
      );

    Object.values(planning)
      .forEach(jour => {

        if (!jour) return;

        ["dejeuner", "diner"]
          .forEach(repas => {

            if (
              jour[repas] &&
              jour[repas].id
            ) {

              ids.push(
                String(jour[repas].id)
              );

            }

          });

      });


    /*
      Menus enregistrés
    */

    const menus =
      JSON.parse(
        localStorage.getItem(
          "menusSauvegardes"
        ) || "[]"
      );


    menus.forEach(menu => {

      if (
        !Array.isArray(menu.recettes)
      ) {
        return;
      }

      menu.recettes.forEach(recette => {

        if (recette && recette.id) {

          ids.push(
            String(recette.id)
          );

        }

      });

    });


    /*
      Suppression des doublons
    */

    const idsUniques =
      [...new Set(ids)];


    recettesSelectionnees =
      idsUniques
        .map(id =>
          recettesCatalogue.find(
            recette =>
              String(recette.id) ===
              String(id)
          )
        )
        .filter(Boolean);

  }


  /* =====================================================
     CONSTRUCTION LISTE COURSES
  ===================================================== */

  function construireListeCourses() {

    const agregats = {};


    recettesSelectionnees
      .forEach(recette => {

        const quantite =
          recette.quantites &&
          recette.quantites.petite;

        const ingredients =
          Array.isArray(quantite)
            ? quantite
            : (
                Array.isArray(recette.ingredients)
                  ? recette.ingredients
                  : []
              );


        ingredients.forEach(ingredient => {

          analyserEtAjouter(
            ingredient,
            agregats
          );

        });

      });


    ingredientsCourses =
      Object.values(agregats);

  }


  /* =====================================================
     ANALYSE INGREDIENT
  ===================================================== */

  function analyserEtAjouter(
    texte,
    agregats
  ) {

    const original =
      String(texte || "").trim();

    if (!original) return;


    let match;


    /*
      g / kg / mg
    */

    match =
      original.match(
        /^(\d+(?:[,.]\d+)?)\s*(kg|g|mg)\s+(?:de\s+)?(.+)$/i
      );

    if (match) {

      ajouterQuantite(
        agregats,
        match[3],
        match[2].toLowerCase(),
        parseFloat(
          match[1].replace(",", ".")
        )
      );

      return;

    }


    /*
      ml / cl / dl / l
    */

    match =
      original.match(
        /^(\d+(?:[,.]\d+)?)\s*(ml|cl|dl|l)\s+(?:de\s+)?(.+)$/i
      );

    if (match) {

      ajouterQuantite(
        agregats,
        match[3],
        match[2].toLowerCase(),
        parseFloat(
          match[1].replace(",", ".")
        )
      );

      return;

    }


    /*
      cuillères
    */

    match =
      original.match(
        /^(\d+(?:[,.]\d+)?)\s*(cs|cc|c\.\s*à\s*soupe|c\.\s*à\s*café)\s+(?:de\s+)?(.+)$/i
      );

    if (match) {

      let unite =
        match[2]
          .toLowerCase()
          .replace(/\s+/g, " ");

      if (
        unite.startsWith("c.") &&
        unite.includes("soupe")
      ) {
        unite = "cs";
      }

      if (
        unite.startsWith("c.") &&
        unite.includes("café")
      ) {
        unite = "cc";
      }

      ajouterQuantite(
        agregats,
        match[3],
        unite,
        parseFloat(
          match[1].replace(",", ".")
        )
      );

      return;

    }


    /*
      Quantité en pièces :
      1 œuf
      1 petit œuf
      2 mini toast
    */

    match =
      original.match(
        /^(\d+(?:[,.]\d+)?)\s+(.+)$/i
      );

    if (match) {

      const quantite =
        parseFloat(
          match[1].replace(",", ".")
        );

      const nom =
        match[2].trim();


      /*
        On ne considère comme pièce
        que les ingrédients dont le nom
        n'est pas manifestement une unité
        de poids/volume.
      */

      ajouterQuantite(
        agregats,
        nom,
        "piece",
        quantite
      );

      return;

    }


    /*
      Sans quantité :
      Cannelle
      Sel
      Poivre...
    */

    const cle =
      cleIngredient(
        original,
        ""
      );

    if (!agregats[cle]) {

      agregats[cle] = {

        nom: original,

        unite: "",

        quantite: null

      };

    }

  }


  /* =====================================================
     AJOUT QUANTITE
  ===================================================== */

  function ajouterQuantite(
    agregats,
    nom,
    unite,
    quantite
  ) {

    const uniteNormalisee =
      normaliserUnite(unite);

    const nomPropre =
      nettoyerNomIngredient(nom);

    const cle =
      cleIngredient(
        nomPropre,
        uniteNormalisee
      );


    if (!agregats[cle]) {

      agregats[cle] = {

        nom: nomPropre,

        unite: uniteNormalisee,

        quantite: 0

      };

    }

    agregats[cle].quantite += quantite;

  }


  /* =====================================================
     NORMALISATION UNITES
  ===================================================== */

  function normaliserUnite(unite) {

    const u =
      String(unite || "")
        .toLowerCase()
        .trim();

    if (u === "kilogramme" || u === "kilogrammes") {
      return "kg";
    }

    if (u === "gramme" || u === "grammes") {
      return "g";
    }

    if (u === "milligramme" || u === "milligrammes") {
      return "mg";
    }

    if (u === "millilitre" || u === "millilitres") {
      return "ml";
    }

    if (u === "centilitre" || u === "centilitres") {
      return "cl";
    }

    if (u === "litre" || u === "litres") {
      return "l";
    }

    return u;

  }


  /* =====================================================
     NETTOYAGE NOM
  ===================================================== */

  function nettoyerNomIngredient(nom) {

    return String(nom || "")
      .trim()
      .replace(/^de\s+/i, "")
      .replace(/^d['’]\s*/i, "");

  }


  /* =====================================================
     CLE INGREDIENT
  ===================================================== */

  function cleIngredient(
    nom,
    unite
  ) {

    let texte =
      nettoyerNomIngredient(nom)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

    /*
      Petit nettoyage uniquement pour
      faciliter les regroupements.
    */

    texte =
      texte
        .replace(/\s+/g, " ");

    return (
      texte +
      "|" +
      unite
    );

  }


  /* =====================================================
     AFFICHAGE INGREDIENTS
  ===================================================== */

  function afficherIngredients() {

    const container =
      document.getElementById(
        "ingredients"
      );

    const recherche =
      String(
        document.getElementById(
          "recherche"
        ).value || ""
      )
        .toLowerCase()
        .trim();


    const filtres =
      ingredientsCourses.filter(
        ingredient =>
          ingredient.nom
            .toLowerCase()
            .includes(recherche)
      );


    if (!filtres.length) {

      container.innerHTML = `
        <div class="empty">
          🛒 Aucun ingrédient à afficher.
        </div>
      `;

      mettreAJourResume();

      return;

    }


    container.innerHTML =
      filtres.map(
        (ingredient, index) => {

          const cle =
            cleIngredient(
              ingredient.nom,
              ingredient.unite
            );

          const cochee =
            casesCochees.includes(cle);

          return `

            <div
              class="ingredient ${cochee ? "checked" : ""}"
              data-cle="${echapperAttribut(cle)}"
            >

              <input
                type="checkbox"
                id="ingredient-${index}"
                ${cochee ? "checked" : ""}
                onchange="changerCase(
                  '${echapperJS(cle)}'
                )"
              >

              <label
                for="ingredient-${index}"
              >
                ${texteIngredient(ingredient)}
              </label>

            </div>

          `;

        }
      ).join("");


    mettreAJourResume();

  }


  /* =====================================================
     TEXTE INGREDIENT
  ===================================================== */

  function texteIngredient(
    ingredient
  ) {

    if (
      ingredient.quantite === null
    ) {

      return echapper(
        ingredient.nom
      );

    }


    const nombre =
      formaterNombre(
        ingredient.quantite
      );


    if (
      ingredient.unite === "piece"
    ) {

      return (
        nombre +
        " " +
        adapterPluriel(
          ingredient.nom,
          ingredient.quantite
        )
      );

    }


    return (
      nombre +
      " " +
      ingredient.unite +
      " de " +
      echapper(
        ingredient.nom
      )
    );

  }


  /* =====================================================
     PLURIEL
  ===================================================== */

  function adapterPluriel(
    nom,
    quantite
  ) {

    if (
      quantite <= 1
    ) {
      return echapper(nom);
    }

    const texte =
      String(nom);

    if (
      /s$/i.test(texte)
    ) {
      return echapper(texte);
    }

    return echapper(
      texte + "s"
    );

  }


  /* =====================================================
     FORMAT NOMBRE
  ===================================================== */

  function formaterNombre(
    nombre
  ) {

    if (
      Number.isInteger(nombre)
    ) {

      return String(nombre);

    }

    return String(
      Math.round(
        nombre * 100
      ) / 100
    )
      .replace(".", ",");

  }


  /* =====================================================
     CASES
  ===================================================== */

  function changerCase(cle) {

    const index =
      casesCochees.indexOf(cle);


    if (index >= 0) {

      casesCochees.splice(
        index,
        1
      );

    } else {

      casesCochees.push(cle);

    }


    localStorage.setItem(
      "ingredientsCoursesCoches",
      JSON.stringify(
        casesCochees
      )
    );


    afficherIngredients();

  }


  /* =====================================================
     TOUT COCHER
  ===================================================== */

  function toutCocher() {

    ingredientsCourses
      .forEach(ingredient => {

        const cle =
          cleIngredient(
            ingredient.nom,
            ingredient.unite
          );

        if (
          !casesCochees.includes(cle)
        ) {

          casesCochees.push(cle);

        }

      });


    sauvegarderCases();

    afficherIngredients();

  }


  /* =====================================================
     TOUT DECOCHER
  ===================================================== */

  function toutDecocher() {

    casesCochees = [];

    sauvegarderCases();

    afficherIngredients();

  }


  /* =====================================================
     COURSES TERMINEES
  ===================================================== */

  function coursesTerminees() {

    const confirmation =
      confirm(
        "Vos courses sont terminées ?\n\n" +
        "Les cases cochées vont être réinitialisées " +
        "pour votre prochaine liste.\n\n" +
        "Vos menus, votre planning et vos recettes " +
        "seront conservés."
      );


    if (!confirmation) {
      return;
    }


    /*
      IMPORTANT :
      On supprime UNIQUEMENT
      les cases cochées.
    */

    casesCochees = [];


    localStorage.removeItem(
      "ingredientsCoursesCoches"
    );


    afficherIngredients();


    afficherMessage(
      "🎉 Courses terminées ! Votre liste est prête pour la prochaine fois."
    );

  }


  function sauvegarderCases() {

    localStorage.setItem(
      "ingredientsCoursesCoches",
      JSON.stringify(
        casesCochees
      )
    );

  }


  /* =====================================================
     SOURCES RECETTES
  ===================================================== */

  function afficherRecettesSources() {

    const container =
      document.getElementById(
        "recettesSources"
      );


    if (
      recettesSelectionnees.length === 0
    ) {

      container.innerHTML = `
        <div class="empty">
          🍽️ Aucun menu ou planning enregistré.
          <br><br>
          Commencez par composer un menu.
        </div>
      `;

      return;

    }


    container.innerHTML =
      recettesSelectionnees
        .map(
          recette => `

            <div class="recipe-source">

              🍽️

              <a
                href="Recette.html?id=${encodeURIComponent(recette.id)}"
                style="color:#496044;font-weight:bold;text-decoration:none;"
              >
                ${echapper(recette.nom)}
              </a>

            </div>

          `
        )
        .join("");

  }


  /* =====================================================
     RESUME
  ===================================================== */

  function mettreAJourResume() {

    const resume =
      document.getElementById(
        "resume"
      );

    const total =
      ingredientsCourses.length;


    const cochees =
      ingredientsCourses.filter(
        ingredient =>
          casesCochees.includes(
            cleIngredient(
              ingredient.nom,
              ingredient.unite
            )
          )
      ).length;


    if (!total) {

      resume.innerHTML =
        "🛒 Votre liste de courses est vide.";

      return;

    }


    resume.innerHTML =
      `
        🛒 <strong>${total}</strong>
        ingrédients à prévoir
        ·
        <strong>${cochees}</strong>
        déjà cochés
      `;

  }


  /* =====================================================
     SECURITE
  ===================================================== */

  function echapper(texte) {

    return String(texte || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function echapperAttribut(texte) {

    return echapper(texte);

  }


  function echapperJS(texte) {

    return String(texte || "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/\n/g, "\\n")
      .replace(/\r/g, "");

  }


  /* =====================================================
     MESSAGE
  ===================================================== */

  function afficherMessage(texte) {

    const message =
      document.getElementById(
        "message"
      );

    message.textContent =
      texte;

    message.classList.remove(
      "hidden"
    );

    setTimeout(() => {

      message.classList.add(
        "hidden"
      );

    }, 2200);

  }

</script>

</body>
